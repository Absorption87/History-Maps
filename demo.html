<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Function Demo Board</title>
<style>
:root{--fs:16px;--bg:#f4f1ea;--panel:#fffdf8;--ink:#1f2125;--muted:#55595f;--line:#d6d0c3;--soft:#f1ece1;--focus:#1a5fb4}
html{font-size:var(--fs)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.hc{--bg:#fff;--panel:#fff;--ink:#000;--muted:#222;--line:#000;--soft:#f2f2f2}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;line-height:1.25}
:focus-visible{outline:3px solid var(--focus)!important;outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#000;color:#fff;padding:8px 12px;border-radius:6px;z-index:50}.skip:focus{top:8px}
header{padding:.7rem 1.2rem .2rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between}header h1{font-size:1.5rem}
button,select,input,textarea{font:inherit}
.btn,.chip{min-height:2.3rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:.3rem .85rem;font-size:.88rem;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.btn:disabled{opacity:.5;cursor:default}
.settings{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;font-size:.85rem}.settings .lbl{font-weight:600;color:var(--muted)}
.settings .btn,.settings .chip{min-height:2.1rem;font-size:.8rem;padding:.2rem .65rem}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:1rem;padding:.4rem 1.2rem 1.5rem;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem}
#board,#side{min-width:0}
.gwrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.3rem;position:relative}
#graph{width:100%;height:auto;aspect-ratio:1/1;display:block;max-height:calc(100vh - 9rem);margin:0 auto;cursor:crosshair}
body.pres #graph{max-height:calc(100vh - 5rem)}
.wincontrols{display:flex;flex-wrap:wrap;gap:.35rem;align-items:end;margin:.5rem 0 .2rem;font-size:.82rem}
.wincontrols label{display:flex;flex-direction:column;font-weight:600;color:var(--muted)}.wincontrols input{width:4.6rem;min-height:2.1rem;border:1px solid #9a9488;border-radius:6px;padding:.15rem .35rem;background:#fff;color:#000}
.trace{font-size:.95rem;margin:.35rem .2rem;min-height:1.5rem}
.desc{background:var(--soft);border-radius:10px;padding:.55rem .75rem;margin-top:.5rem;font-size:.93rem}.desc h2{font-size:1.05rem;margin-bottom:.2rem}.desc ul{margin:.2rem 0;padding-left:1.1rem}.desc li{margin:.2rem 0}
#side h2{font-size:1.1rem;margin:.1rem 0 .4rem}
.eqrow{border:1px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:.45rem .55rem;margin:.45rem 0;background:#fff}
.eqrow .top{display:flex;gap:.4rem;align-items:center}
.eqrow label.lab{font-weight:700;font-size:.82rem;white-space:nowrap}
.eqrow input[type=text]{flex:1;min-width:0;min-height:2.4rem;border:1px solid #9a9488;border-radius:8px;padding:.25rem .5rem;font:1.05rem/1.3 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#000}
.eqrow .prev{font:1.1rem Georgia,serif;margin:.3rem 0 .1rem;min-height:1.4rem}.eqrow .err{color:#9a2f2a;font-size:.85rem}
.eqrow .opts{display:flex;flex-wrap:wrap;gap:.2rem .8rem;font-size:.8rem;align-items:center}.eqrow .opts label{display:flex;gap:.3rem;align-items:center;min-height:1.9rem;cursor:pointer}.eqrow .opts input{width:1.05rem;height:1.05rem;accent-color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:2.2rem;min-height:2.2rem;cursor:pointer;font-size:.9rem}
.m{font-family:Georgia,"Times New Roman",serif;white-space:nowrap}.m i{font-style:italic}.ov{border-top:1.5px solid currentColor;padding-top:1px;margin-left:1px}
.prm{border:1px solid var(--line);border-radius:10px;padding:.4rem .6rem;margin:.4rem 0;background:#fff}
.prm .lr{display:flex;justify-content:space-between;align-items:center;gap:.4rem}.prm .lr label{font:italic 700 1.1rem Georgia,serif}.prm .rng label{font:600 .75rem Inter,system-ui,sans-serif;font-style:normal}.prm .rng input{font:.8rem Inter,system-ui,sans-serif}.prm output{font:700 1.1rem Georgia,serif}
.prm input[type=range]{width:100%;accent-color:var(--ink);height:2rem}
.prm .rng{display:flex;gap:.4rem;font-size:.75rem;color:var(--muted);align-items:center;flex-wrap:wrap}.prm .rng input{width:3.6rem;min-height:1.8rem;border:1px solid #9a9488;border-radius:6px;padding:0 .3rem;background:#fff;color:#000}
details.sec{background:var(--soft);border-radius:10px;padding:.15rem .7rem;font-size:.88rem;margin-top:.5rem}details.sec>summary{cursor:pointer;font-weight:700;min-height:2.3rem;display:flex;align-items:center}
.gopts label{display:flex;gap:.4rem;align-items:center;font-size:.85rem;min-height:2rem;cursor:pointer}.gopts input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--ink)}
.dtab{width:100%;border-collapse:collapse;font-size:.85rem;margin:.3rem 0 .5rem}.dtab th,.dtab td{border-bottom:1px solid var(--line);padding:.2rem .4rem;text-align:right}.dtab th:first-child,.dtab td:first-child{text-align:left}.dtw{max-height:20rem;overflow:auto}
textarea{width:100%;min-height:5rem;border:1px solid #9a9488;border-radius:8px;padding:.4rem;font:.85rem ui-monospace,Menlo,monospace;background:#fff;color:#000}
.ax{font:12px Inter,system-ui,sans-serif;fill:#4a4e54}body.hc .ax{fill:#000}body.pres .ax{font-size:15px}
.klbl{font:600 12px Inter,system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px}body.pres .klbl{font-size:15px}
.meta{font-size:.8rem;color:var(--muted)}
.help li{margin:.25rem 0}code{font:.9em ui-monospace,Menlo,monospace;background:#efeae0;padding:0 .2rem;border-radius:3px}
body.pres{--fs:19px}body.pres header .sub{display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr);padding:.4rem .6rem 1.5rem}}
@media print{.settings,#side .iconbtn,.wincontrols{display:none}}
</style></head><body>
<a class="skip" href="#eqs" id="skip"></a>
<header><div><h1 id="title"></h1><p class="meta sub" id="sub" style="margin:.15rem 0 0"></p></div><div class="settings" id="settings" role="group"></div></header>
<main class="wrap" id="main">
 <section id="board" class="box" aria-labelledby="board-h">
  <h2 id="board-h" class="vh"></h2>
  <div class="gwrap"><svg id="graph" viewBox="0 0 700 700" tabindex="0" role="img" aria-describedby="trace"></svg></div>
  <div class="wincontrols" role="group" id="win" aria-labelledby="win-l"><span id="win-l" class="vh"></span></div>
  <p class="trace" id="trace"></p>
  <div class="desc" role="region" aria-labelledby="desc-h"><div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap"><h2 id="desc-h"></h2><button class="btn" id="readdesc" data-act="readdesc"></button></div><div id="desctext"></div></div>
 </section>
 <section id="side" class="box" aria-labelledby="eqs-h">
  <h2 id="eqs-h"></h2>
  <div class="row" style="display:flex;gap:.35rem;flex-wrap:wrap;align-items:center"><label for="ex" class="meta" style="font-weight:700" id="ex-l"></label><select id="ex" style="min-height:2.3rem;border-radius:8px;border:1px solid var(--line);max-width:100%"></select><button class="btn" data-act="loadex" id="loadex"></button></div>
  <div id="eqs" tabindex="-1"></div>
  <div style="display:flex;gap:.35rem;flex-wrap:wrap"><button class="btn pri" data-act="add" id="add"></button><button class="btn" data-act="clear" id="clear"></button></div>
  <h2 id="prm-h" style="margin-top:.8rem"></h2><p class="meta" id="prm-note"></p><div id="params"></div>
  <details class="sec" open><summary id="go-s"></summary><div class="gopts" id="gopts"></div></details>
  <details class="sec"><summary id="tb-s"></summary><div id="tbctl" class="meta"></div><div class="dtw" id="tbl" tabindex="0" role="region"></div></details>
  <details class="sec"><summary id="setup-s"></summary><p class="meta" id="setup-note"></p><label for="setup" class="meta" id="setup-l" style="font-weight:700"></label><textarea id="setup"></textarea><div style="display:flex;gap:.35rem;flex-wrap:wrap;margin:.3rem 0"><button class="btn" data-act="copysetup" id="copysetup"></button><button class="btn" data-act="loadsetup" id="loadsetup"></button></div><p class="meta" id="setup-msg" role="status"></p></details>
  <details class="sec"><summary id="help-s"></summary><div id="help" class="help"></div></details>
 </section>
</main>
<div id="live" class="vh" aria-live="polite" aria-atomic="true"></div>

let ANIM=null;
function renderParams(){const ps=Object.keys(ST.params).sort();const box=$('params');if(!ps.length){box.innerHTML=`<p class="meta">${U.noPrm}</p>`;return;}
 box.innerHTML=ps.map(p=>{const o=ST.params[p];return `<div class="prm"><div class="lr"><label for="p-${p}">${p}</label><output id="o-${p}" for="p-${p}">${nf(o.v)}</output><button class="btn" data-act="anim" data-p="${p}" aria-pressed="${!!(ANIM&&ANIM.p===p)}">${ANIM&&ANIM.p===p?U.stopAnim:U.animate}</button></div>
 <input type="range" id="p-${p}" data-p="${p}" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.v}" aria-valuetext="${p} = ${o.v<0?SAY.neg+' '+nf(-o.v):nf(o.v)}">
 <div class="rng"><label>${U.min} <input type="number" data-pr="${p}" data-k="min" value="${o.min}" step="any"></label><label>${U.max} <input type="number" data-pr="${p}" data-k="max" value="${o.max}" step="any"></label><label>${U.step} <input type="number" data-pr="${p}" data-k="step" value="${o.step}" step="any" min="0.01"></label></div></div>`;}).join('');}
function renderDesc(){const P=PV();const items=[];CL.forEach((c,i)=>{const l=ST.lines[i];if(c.err||!l.vis)return;const F=c.F;const parts=[U.lineDesc(i+1,U.styles[i%6],l.hide?U.hidden:eqHTML(i))];
 if(!F.any)parts.push(U.offscreen);else{if(F.y0!==null&&F.y0>=ST.win[2]&&F.y0<=ST.win[3])parts.push(U.yint(ptM(0,F.y0)));parts.push(U.xints(F.roots.map(r=>ptM(r,0))));F.ext.slice(0,6).forEach(e=>parts.push(e.mx?U.maxAt(ptM(e.x,e.y)):U.minAt(ptM(e.x,e.y))));if(F.ext.length>6)parts.push(U.andMore);if(F.undef)parts.push(U.undef);}
 items.push(`<li data-r>${parts.join(' ')}</li>`);});$('desctext').innerHTML=items.length?`<ul>${items.join('')}</ul>`:`<p>${U.noLines}</p>`;}
function renderTable(){const [a,b,st]=ST.tb;$('tbctl').innerHTML=`<div class="wincontrols" style="margin:.2rem 0"><label>${U.tbFrom}<input type="number" data-tb="0" value="${a}" step="any"></label><label>${U.tbTo}<input type="number" data-tb="1" value="${b}" step="any"></label><label>${U.tbStep}<input type="number" data-tb="2" value="${st}" step="any" min="0.01"></label></div>`;
 const P=PV();const cols=CL.map((c,i)=>[c,i]).filter(([c,i])=>!c.err&&ST.lines[i].vis);let h=`<table class="dtab"><caption class="vh">${U.tbS}</caption><thead><tr><th scope="col"><i>x</i></th>${cols.map(([c,i])=>`<th scope="col">${U.lineN(i+1)}</th>`).join('')}</tr></thead><tbody>`;
 const n=Math.min(200,Math.floor((b-a)/st+1e-9));for(let j=0;j<=n;j++){const x=a+j*st;h+=`<tr><th scope="row">${nf(x)}</th>${cols.map(([c,i])=>`<td>${nf(c.f(x,P))}</td>`).join('')}</tr>`;}$('tbl').innerHTML=h+'</tbody></table>';$('tbl').setAttribute('aria-label',U.tbS);}
function traceText(){const c=CL[TI];if(!c||c.err)return U.traceHint;const y=c.f(TX,PV());return U.traceAt(TI+1,nf(TX),isFinite(y)?nf(y):null);}
function renderTrace(){$('trace').textContent=TRON?traceText():U.traceHint;}
function renderWin(){const w=ST.win;$('win').innerHTML=`<span id="win-l" class="vh">${U.winL}</span>${['xmin','xmax','ymin','ymax'].map((k,i)=>`<label>${U[k]}<input type="number" data-win="${i}" value="${w[i]}" step="any"></label>`).join('')}<button class="btn" data-act="zin">${U.zin}</button><button class="btn" data-act="zout">${U.zout}</button><button class="btn" data-act="zres">${U.zres}</button><button class="btn" data-act="zsq">${U.zsq}</button>`;}
function chrome(){const P=ST.P,s=U.set;document.documentElement.lang=L;document.documentElement.style.setProperty('--fs',P.fs+'px');document.body.classList.toggle('hc',P.hc);document.body.classList.toggle('pres',P.pres);
 document.title=U.title;$('title').textContent=U.title;$('sub').textContent=U.sub;$('skip').textContent=U.skip;$('board-h').textContent=U.boardH;$('eqs-h').textContent=U.eqsH;$('ex-l').textContent=U.exL;$('loadex').textContent=U.loadex;$('add').textContent=U.add;$('clear').textContent=U.clear;
 $('settings').setAttribute('aria-label',s.group);$('settings').innerHTML=`<span class="lbl">${s.lang}</span><button class="chip" data-pref="lang" data-v="en" aria-pressed="${L==='en'}" lang="en">English</button><button class="chip" data-pref="lang" data-v="es" aria-pressed="${L==='es'}" lang="es">Español</button><span class="lbl">${s.text}</span><button class="btn" data-pref="fs" data-v="-2" aria-label="${s.smaller}">A−</button><button class="btn" data-pref="fs" data-v="2" aria-label="${s.larger}">A+</button><button class="chip" data-pref="hc" aria-pressed="${P.hc}">${s.hc}</button><button class="chip" data-pref="pres" aria-pressed="${P.pres}">${s.pres}</button><button class="chip" data-pref="rm" aria-pressed="${P.rm}">${s.rm}</button><button class="btn" data-act="full">${s.full}</button>`;
 $('ex').innerHTML=U.ex.map((e,i)=>`<option value="${i}">${e[0]}</option>`).join('');
 $('prm-h').textContent=U.prmH;$('prm-note').textContent=U.prmNote;$('go-s').textContent=U.goS;$('gopts').innerHTML=Object.keys(ST.opts).map(k=>`<label><input type="checkbox" data-opt="${k}" ${ST.opts[k]?'checked':''}> ${U.go[k]}</label>`).join('');
 $('tb-s').textContent=U.tbS;$('setup-s').textContent=U.setupS;$('setup-note').textContent=U.setupNote;$('setup-l').textContent=U.setupL;$('copysetup').textContent=U.copySetup;$('loadsetup').textContent=U.loadSetup;$('help-s').textContent=U.helpS;$('help').innerHTML=U.help;
 $('desc-h').textContent=U.descH;$('readdesc').innerHTML=`<span aria-hidden="true">🔊 </span>${U.readDesc}`;renderWin();}
// ---------- animation
function stopAnim(){if(ANIM){cancelAnimationFrame(ANIM.raf);ANIM=null;renderParams();live(U.animOff);}}
function startAnim(p){stopAnim();const o=ST.params[p];const rm=ST.P.rm||matchMedia('(prefers-reduced-motion: reduce)').matches;let dir=1,last=performance.now(),acc=0;const span=o.max-o.min;const dur=rm?8:4;
 ANIM={p,raf:0,cur:o.v};const step=t=>{if(!ANIM)return;const dt=(t-last)/1000;last=t;acc+=dt;const every=rm?0.5:0;if(acc<every){ANIM.raf=requestAnimationFrame(step);return;}const d=rm?acc:dt;acc=0;let v=ANIM.cur+dir*span*d/dur;if(v>=o.max){v=o.max;dir=-1;}if(v<=o.min){v=o.min;dir=1;}ANIM.cur=v;const q=Math.round((v-o.min)/o.step)*o.step+o.min;o.v=Math.round(q*1e6)/1e6;const inp=$('p-'+p);if(inp){inp.value=o.v;$('o-'+p).textContent=nf(o.v);}if(rm)o.v=Math.max(o.min,Math.min(o.max,o.v));renderLight();ANIM.raf=requestAnimationFrame(step);};
 ANIM.raf=requestAnimationFrame(step);renderParams();live(U.animOn(p));}
// ---------- events
let typeT=null,slT=null;
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.eq!=null){const i=+t.dataset.eq;ST.lines[i].src=t.value;clearTimeout(typeT);typeT=setTimeout(()=>{const prevPrm=JSON.stringify(Object.keys(ST.params).sort());rebuild();const P=PV();CL.forEach(c=>{if(!c.err)c.F=features(c.f,P);});$('err-'+i).textContent=CL[i].err?errText(CL[i].err):'';if(JSON.stringify(Object.keys(ST.params).sort())!==prevPrm)renderParams();renderLight();},250);return;}
 if(t.dataset.p){const p=t.dataset.p;ST.params[p].v=+t.value;$('o-'+p).textContent=nf(+t.value);t.setAttribute('aria-valuetext',`${p} = ${+t.value<0?SAY.neg+' '+nf(-t.value):nf(+t.value)}`);renderLight();clearTimeout(slT);slT=setTimeout(()=>{const s=CL.map((c,i)=>!c.err&&c.prm.includes(p)&&!ST.lines[i].hide?sayN(subst(c.ast,PV()),c.lhs):null).filter(Boolean);if(s.length)live(U.nowGraph(s.join('; ')));},500);return;}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.vis!=null){ST.lines[+t.dataset.vis].vis=t.checked;renderLight();return;}if(t.dataset.hide!=null){ST.lines[+t.dataset.hide].hide=t.checked;renderLight();return;}
 if(t.dataset.opt){ST.opts[t.dataset.opt]=t.checked;renderLight();return;}
 if(t.dataset.pr){const o=ST.params[t.dataset.pr];const v=+t.value;if(!isFinite(v))return;o[t.dataset.k]=t.dataset.k==='step'?Math.max(0.01,v):v;if(o.min>=o.max){o.max=o.min+1;}o.v=Math.max(o.min,Math.min(o.max,o.v));renderParams();renderLight();return;}
 if(t.dataset.win!=null){const v=+t.value;if(!isFinite(v))return;const w=ST.win.slice();w[+t.dataset.win]=v;if(w[0]<w[1]&&w[2]<w[3]){ST.win=w;renderLight();}else renderWin();return;}
 if(t.dataset.tb!=null){const v=+t.value;if(!isFinite(v))return;ST.tb[+t.dataset.tb]=+t.dataset.tb===2?Math.max(0.01,v):v;renderTable();saveST();return;}});
function zoom(f){const [a,b,c,d]=ST.win;const cx=(a+b)/2,cy=(c+d)/2,hw=(b-a)/2*f,hh=(d-c)/2*f;ST.win=[cx-hw,cx+hw,cy-hh,cy+hh].map(v=>Math.round(v*1000)/1000);renderWin();renderLight();live(U.zoomed);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-pref]');if(!b)return;
 if(b.dataset.pref){const k=b.dataset.pref;if(k==='lang'){L=b.dataset.v;ST.P.lang=L;U=UI[L];SAY=SAYS[L];chrome();renderAll();live(U.langNow);return;}if(k==='fs')ST.P.fs=Math.max(14,Math.min(26,ST.P.fs+ +b.dataset.v));else ST.P[k]=!ST.P[k];chrome();renderLight();return;}
 const a=b.dataset.act;
 if(a==='add'){if(ST.lines.length<6){ST.lines.push({src:'',vis:true,hide:false});renderAll();const i=ST.lines.length-1;$('eq-'+i).focus();}}
 else if(a==='del'){stopAnim();ST.lines.splice(+b.dataset.i,1);if(!ST.lines.length)ST.lines.push({src:'',vis:true,hide:false});TI=0;renderAll();$('eqs').focus();}
 else if(a==='clear'){stopAnim();ST.lines=[{src:'',vis:true,hide:false}];ST.params={};renderAll();$('eq-0').focus();}
 else if(a==='loadex'){const ex=U.ex[+$('ex').value];if(!ex[1].length)return;stopAnim();ST.lines=ex[1].map(s=>({src:s,vis:true,hide:false}));ST.params={};ST.win=ex[0].match(/Sin|Seno/)?[-7,7,-4,4]:[-10,10,-10,10];renderWin();renderAll();live(ex[0]);}
 else if(a==='anim'){const p=b.dataset.p;if(ANIM&&ANIM.p===p)stopAnim();else startAnim(p);}
 else if(a==='zin')zoom(0.5);else if(a==='zout')zoom(2);else if(a==='zres'){ST.win=[-10,10,-10,10];renderWin();renderLight();live(U.zoomed);}
 else if(a==='zsq'){const [x0,x1,y0,y1]=ST.win;const cy=(y0+y1)/2,hw=(x1-x0)/2;ST.win=[x0,x1,cy-hw,cy+hw];renderWin();renderLight();live(U.zoomed);}
 else if(a==='full'){const m=document.documentElement;if(document.fullscreenElement){document.exitFullscreen();return;}if(m.requestFullscreen)m.requestFullscreen().catch(()=>live(U.fullNo));else live(U.fullNo);}
 else if(a==='readdesc'){const SS=window.speechSynthesis;if(!SS){live(U.fullNo);return;}SS.cancel();const c=$('desctext').cloneNode(true);c.querySelectorAll('[aria-hidden="true"]').forEach(x=>x.remove());const ut=new SpeechSynthesisUtterance(c.textContent.replace(/\s+/g,' '));ut.lang=L==='es'?'es-US':'en-US';const v=SS.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(L));if(v)ut.voice=v;SS.speak(ut);}
 else if(a==='copysetup'){const t=JSON.stringify({lines:ST.lines,params:ST.params,win:ST.win,opts:ST.opts});$('setup').value=t;const ok=()=>$('setup-msg').textContent=U.copied;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{$('setup').select();try{document.execCommand('copy');ok();}catch(e2){}});else{$('setup').select();try{document.execCommand('copy');ok();}catch(e2){}}}
 else if(a==='loadsetup'){try{const o=JSON.parse($('setup').value);if(!o||!Array.isArray(o.lines))throw 0;stopAnim();ST.lines=o.lines.slice(0,6).map(l=>({src:String(l.src||''),vis:l.vis!==false,hide:!!l.hide}));ST.params=o.params&&typeof o.params==='object'?o.params:{};if(Array.isArray(o.win)&&o.win.length===4)ST.win=o.win.map(Number);if(o.opts)Object.assign(ST.opts,o.opts);renderWin();chrome();renderAll();$('setup-msg').textContent=U.loaded;}catch(err){$('setup-msg').textContent=U.badSetup;}}});
const gEl=$('graph');
gEl.addEventListener('focus',()=>{TRON=true;if(CL[TI]&&CL[TI].err){const j=CL.findIndex(c=>!c.err);TI=j<0?0:j;}draw();renderTrace();});gEl.addEventListener('blur',()=>{TRON=false;draw();renderTrace();});
gEl.addEventListener('keydown',e=>{const k=e.key,[x0,x1]=ST.win,st=(x1-x0)/(e.shiftKey?200:40);let h=true;
 if(k==='ArrowRight')TX=Math.min(x1,TX+st);else if(k==='ArrowLeft')TX=Math.max(x0,TX-st);else if(k==='Home')TX=x0;else if(k==='End')TX=x1;
 else if(k==='ArrowUp'||k==='ArrowDown'){const ok=CL.map((c,i)=>!c.err&&ST.lines[i].vis?i:-1).filter(i=>i>=0);if(ok.length){const p=ok.indexOf(TI);TI=ok[(p+(k==='ArrowUp'?-1:1)+ok.length)%ok.length];}}
 else if(k==='+'||k==='='){zoom(0.5);return;}else if(k==='-'||k==='_'){zoom(2);return;}else h=false;
 if(!h)return;e.preventDefault();TX=Math.round(TX*1000)/1000;draw();renderTrace();live(traceText());});
gEl.addEventListener('mousemove',e=>{const r=gEl.getBoundingClientRect();const [x0,x1]=ST.win;TX=x0+((e.clientX-r.left)/r.width*GS-PAD)/(GS-2*PAD)*(x1-x0);TX=Math.round(Math.max(x0,Math.min(x1,TX))*100)/100;TRON=true;draw();renderTrace();});
gEl.addEventListener('mouseleave',()=>{if(document.activeElement!==gEl){TRON=false;draw();renderTrace();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopAnim();if(window.speechSynthesis)speechSynthesis.cancel();}});
chrome();renderAll();
