<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declaration of Independence of the Democratic Republic of Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#23252a;--muted:#676b72;--line:#dcd7cc;--sea:#e1e8ec;--bgland:#ece8de}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{padding:18px 24px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}
h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px;max-width:760px}
.seg-label{font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px}
#left{padding:14px 18px 30px 24px;min-width:0}
.mapbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
svg#map{width:100%;height:auto;display:block}
.bg{fill:var(--bgland);stroke:#cfc8b8;stroke-width:.6}
.unit{stroke:#fff;stroke-width:.8;cursor:pointer;transition:fill .3s}
.unit:hover{stroke:var(--ink);stroke-width:1.6}
.unit.sel{stroke:var(--ink);stroke-width:2.2}
.proxy{stroke:#fff;stroke-width:.8;cursor:pointer;opacity:.92}
.proxy:hover{stroke:var(--ink)}
.ulbl{font-size:calc(10px*var(--z,1));font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke-width:calc(2.5px*var(--z,1))}
.ulbl.tl{font-size:calc(9px*var(--z,1));font-weight:500;font-style:italic}
.bg,.unit,.proxy,.ovl,.inset{vector-effect:non-scaling-stroke}
.ovl{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.ovl-hit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer}
.ovl-lbl{font-size:calc(10.5px*var(--z,1));font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:calc(3px*var(--z,1));pointer-events:none}
.nat{font-size:calc(10.5px*var(--z,1));font-style:italic;fill:#5b3f22;text-anchor:middle;cursor:pointer;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:calc(2.6px*var(--z,1))}
.nat:hover{fill:#000}
.nat.moved{fill:#8a3b12;font-weight:600;font-size:calc(9.5px*var(--z,1))}
.claim{font-size:calc(11px*var(--z,1));font-weight:600;fill:#7c7465;text-anchor:middle;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;paint-order:stroke;stroke:var(--bgland);stroke-width:calc(3px*var(--z,1))}
.pt circle{r:calc(3.2px*var(--z,1));stroke:#fff;stroke-width:calc(1.2px*var(--z,1));cursor:pointer;fill:#23252a}
.pt text{font-size:calc(10px*var(--z,1));font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:calc(2.6px*var(--z,1));pointer-events:none}
.inset{fill:none;stroke:#b9b3a5;stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;max-width:270px;opacity:0;transition:opacity .1s;z-index:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 2px;font-size:12.5px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.layers{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin:8px 2px 0}
.layers label{display:flex;align-items:center;gap:5px;cursor:pointer}
#timeline{padding:14px 2px 6px}
.tl-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#play{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:15px;cursor:pointer;flex:none}
#play:focus-visible,.seg button:focus-visible{outline:2px solid #3a6ea5;outline-offset:2px}
.yr{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:650;min-width:120px;line-height:1}
.yr small{display:block;font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}
.phase{flex:1;min-width:240px;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.phase .ev{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.speed{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.speed select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 4px}
.track{position:relative;margin:16px 6px 0;height:52px}
.evdots{position:absolute;top:0;left:0;right:0;height:12px}
.evdots button{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);transform:translateX(-50%);padding:0;cursor:pointer}
.evdots button:hover{transform:translateX(-50%) scale(1.35)}
#slider{width:100%;margin:0;position:absolute;top:16px;left:0;accent-color:#34557a}
.ticks{position:absolute;top:38px;left:0;right:0;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.evkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 6px 0}
.evkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.chart h2{font-family:Fraunces,Georgia,serif;font-size:16.5px;margin:0 0 2px}
.chart p{font-size:12px;color:var(--muted);margin:0 0 6px}
.chart svg{width:100%;height:auto;display:block}
.ax{font-size:10.5px;fill:var(--muted)}
aside{border-left:1px solid var(--line);background:var(--panel);padding:20px 22px 28px;overflow:auto;max-height:100vh;position:sticky;top:0}
aside h2{font-family:Fraunces,Georgia,serif;font-size:23px;margin:0 0 4px;line-height:1.2}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:600}
aside p{margin:0 0 10px} aside ul{padding-left:18px;margin:0 0 10px} aside li{margin:5px 0;font-size:14px}
.back{border:0;background:none;color:#3a6ea5;font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:8px}
.when{display:inline-block;font-size:12.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:0 0 10px 6px}
.note{border-left:3px solid #8a6d3b;padding:6px 0 6px 12px;background:linear-gradient(90deg,#f1e9d8,transparent);font-size:13.5px;margin:10px 0}
.src{font-size:12px;color:var(--muted)}
details{margin-top:16px;font-size:13px} details summary{cursor:pointer;font-weight:600} details li{font-size:13px}
a{color:#3a6ea5}
@media (max-width:980px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);max-height:none;position:static}#left{padding:10px 10px 20px}header{padding:14px 14px 10px}h1{font-size:23px}.charts{grid-template-columns:1fr}}
@media (max-width:600px){.ticks span.odd{display:none}}

.land{fill:var(--bgland);stroke:#d3ccbc;stroke-width:.5;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:#cfd8de;stroke-width:.5;vector-effect:non-scaling-stroke}
.area{stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s}
.area:hover{stroke:var(--ink);stroke-width:1.5}
.area.sel{stroke:var(--ink);stroke-width:2.2}
.mk{cursor:pointer}
.mk circle{stroke:#fff;stroke-width:calc(1.2px*var(--z,1))}
.mk text,.lbl{font-size:calc(10.5px*var(--z,1));font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:calc(2.8px*var(--z,1));pointer-events:none}
.mk:hover circle{stroke:var(--ink)}
.lbl.big{font-family:Fraunces,Georgia,serif;font-size:calc(15px*var(--z,1));font-weight:650;letter-spacing:.04em;fill:#7c7465}
.lbl.it{font-style:italic;font-weight:500;fill:#5f6b75}
.ovl{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ovl-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer;vector-effect:non-scaling-stroke}
.seg+.seg{margin-left:8px}
.hdr-ctl{display:flex;gap:18px;flex-wrap:wrap}
.bars text{font-size:11px}
aside .back{display:block}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-size:18px;font-family:Fraunces,Georgia,serif;margin-right:4px}
</style>
</head>
<body>
<header>
  <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <div class="hdr-ctl" id="hdrctl"></div>
</header>
<main>
  <section id="left">
    <div class="mapbox" id="mapbox"><svg id="map" role="img"></svg><div class="tip" id="tip"></div></div>
    <div class="stat" id="stat"></div>
    <div class="legend" id="legend"></div>
    <div class="layers" id="layers"></div>
    <div id="timeline">
      <div class="tl-top">
        <button id="play" aria-label="Play">▶</button>
        <div class="yr" id="yr"></div>
        <div class="phase" id="phase"></div>
        <label class="speed">Speed <select id="speed"><option value="0.5">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option></select></label>
      </div>
      <div class="track"><div class="evdots" id="evdots"></div><input type="range" id="slider" step="0.001" aria-label="Date"><div class="ticks" id="ticks"></div></div>
      <div class="evkey" id="evkey"></div>
    </div>
    <div class="charts" id="charts"></div>
  </section>
  <aside id="panel"></aside>
</main>

 wash:['The U.S. is already paying for most of France’s war. Eisenhower warns that if Indochina falls, its neighbors could fall “like dominoes,” but he decides not to send U.S. forces to rescue the French at Dien Bien Phu.',
  'Washington backs Ngo Dinh Diem as an anticommunist leader for the South, sending money and advisers. It supports his refusal to hold the 1956 elections, which U.S. officials feared Ho Chi Minh would win.',
  'Kennedy sends more advisers to defeat the insurgency without sending combat troops. After the Gulf of Tonkin reports, Johnson wins broad war powers from Congress while telling voters in 1964 he does not want a wider war.',
  'Johnson’s advisers believe losing South Vietnam would damage U.S. credibility around the world. They choose gradual escalation: bombing to pressure Hanoi and ground troops to wear down the enemy, while avoiding war with China or the Soviet Union. Officials tell the public the war is being won.',
  'After Tet, Johnson caps troop levels and seeks talks. Nixon promises “peace with honor”: bring U.S. troops home slowly, build up South Vietnam’s army, and pressure Hanoi through bombing and diplomacy with China and the Soviet Union.',
  'With U.S. troops and prisoners home, a war-weary Congress, absorbed by the Watergate scandal, limits new military action and cuts aid to Saigon. In April 1975 President Ford says that, for America, the war is over.',
  'Americans argue for decades about the war’s lessons, sometimes called the “Vietnam syndrome.” The U.S. admits hundreds of thousands of refugees from Vietnam, Laos and Cambodia. The two countries restore relations in 1995.'],
 hanoi:['For Ho Chi Minh’s Viet Minh, this is a war of independence against French colonial rule, fought since 1946. Victory at Dien Bien Phu shows that a colonial power can be beaten. Many fighters are nationalists first; the leaders are communists.',
  'Hanoi expects the 1956 elections to reunify Vietnam and calls Diem an American puppet when they are cancelled. In the North, a harsh land-reform campaign kills thousands; the party later admits “errors.” In 1959 the leaders decide to back armed struggle in the South.',
  'The National Liberation Front recruits southerners angry at Diem’s government, landlords and foreign influence. Le Duan, the party’s leader, pushes to win in the South before the Americans arrive in force.',
  'Hanoi sees the Americans as the new colonial power. It accepts enormous losses, betting that the U.S. will tire before Vietnam does. The Soviet Union and China send weapons and aid, and Chinese troops help defend the North.',
  'Tet is costly: the Viet Cong lose many of their best fighters, and North Vietnamese troops do more of the fighting afterward. But Hanoi sees that American opinion has turned, and it holds firm at the Paris talks.',
  'The Paris Accords let North Vietnamese troops stay in the South. Hanoi rebuilds, judges that Washington will not return, and launches a final offensive in 1975 that succeeds faster than its own plans expected.',
  'Victory and reunification. The new government sends hundreds of thousands of former southern soldiers and officials to “re-education” camps. Many southerners flee, including some former NLF members. Vietnam later invades Cambodia (1978) and fights a border war with China (1979).'],
 saigon:['Many Vietnamese oppose both French rule and communism. The French-backed State of Vietnam, under former emperor Bao Dai, names Ngo Dinh Diem prime minister in June 1954.',
  'Roughly a million people, many of them Catholics, flee the communist North. Diem builds a new state with U.S. help but rules through his family, jails opponents and favors Catholics in a mostly Buddhist country.',
  'The Saigon government struggles to protect villages from the Viet Cong. “Strategic hamlets” move peasants off their land and breed resentment. After Diem is killed in 1963, a string of coups weakens the government.',
  'As Americans take over much of the fighting, the South Vietnamese army is often pushed aside, and many feel their country’s future is being decided by others. Nguyen Van Thieu is elected president in 1967. Millions of refugees crowd into camps and city slums.',
  'During Tet, most people in the South do not rise up as Hanoi hoped, and communist forces kill thousands of civilians in Hue. Under “Vietnamization” the South’s forces grow past a million and fight hard in 1972, with heavy U.S. air support.',
  'Thieu feels pushed into the Paris Accords. As U.S. aid falls, shortages of fuel and ammunition, corruption and inflation weaken the army. In 1975 a hasty retreat from the Central Highlands turns into a collapse.',
  'Many South Vietnamese remember April 30, 1975, as “Black April.” Former soldiers and officials are imprisoned, and hundreds of thousands later flee by sea. Many resettle in the U.S., where Vietnamese Americans now number more than 2 million.'],
 village:['Most Vietnamese are rice farmers. Many resent French landlords and taxes; the Viet Minh win support by promising land and independence.',
  'In the South, Diem’s land reform does little for poor tenant farmers, and his officials are often outsiders. Communist organizers return, sometimes killing village officials and building support among others.',
  'Villagers are caught between two sides: government soldiers by day, Viet Cong at night. Both recruit, tax and punish people suspected of helping the other side. Strategic hamlets uproot families from their ancestral land.',
  'American firepower (bombing, artillery and herbicides such as Agent Orange) falls on the countryside. “Search and destroy” missions and “free-fire zones” destroy villages. Millions become refugees. The Viet Cong also use terror, including assassinations and mines.',
  'My Lai (1968) becomes the best-known massacre of civilians, but civilians suffer from all sides: communist forces kill thousands in Hue, and bombing continues in Laos and Cambodia, where villagers have no say in the war.',
  'After the ceasefire, fighting over villages continues. In 1975, hundreds of thousands of civilians flee ahead of the North Vietnamese advance; many die on the roads.',
  'Unexploded bombs and Agent Orange contamination harm villagers for decades. In Laos, among the most heavily bombed countries in history, unexploded bombs still kill and injure people today.'],
 home:['Few Americans pay attention to Indochina in 1954. Fear of communism is strong after the Korean War and the McCarthy era.',
  'Most Americans support containing communism, and Vietnam rarely makes the news.',
  'Few Americans know about the advisers. A photograph of a burning Buddhist monk (1963) shocks readers. In 1964 Congress backs Johnson almost unanimously after the Tonkin reports.',
  'Polls show most Americans support the war in 1965, but the draft, rising deaths and nightly TV news change many minds. Students, civil rights leaders and clergy protest; many other Americans back the war and resent the protesters. Working-class and poor young men are more likely to be drafted.',
  '1968 brings Tet, the assassinations of Martin Luther King Jr. and Robert Kennedy, and clashes at the Democratic convention in Chicago. Nixon appeals to the “silent majority.” Protest peaks after Cambodia and Kent State, but so do pro-war rallies. Veterans themselves are divided.',
  'The draft ends in 1973 and prisoners of war come home. Watergate deepens distrust of government. Many returning veterans receive little welcome.',
  'The war leaves deep divisions. The Vietnam Veterans Memorial (1982) becomes a place of healing, and arguments about Vietnam shape later debates over Iraq and Afghanistan.'],
 laos:['Laos and Cambodia become independent kingdoms in 1953–54. Both try to stay out of the Cold War.',
  'In Laos, the communist Pathet Lao, backed by North Vietnam, fight the royal government. North Vietnam begins building the trail south through eastern Laos.',
  'A 1962 agreement declares Laos neutral, but foreign forces stay. The CIA arms a Hmong army under General Vang Pao, the “Secret War.” Cambodia’s Prince Sihanouk stays officially neutral but lets North Vietnam use Cambodian territory.',
  'U.S. planes bomb the trail in Laos heavily, hidden from the American public. Hmong soldiers fight and die in large numbers.',
  'Nixon secretly bombs Cambodia from 1969. In 1970 General Lon Nol overthrows Sihanouk, and U.S. and South Vietnamese troops invade Cambodian border areas. Cambodia’s civil war grows, and the Khmer Rouge gain recruits.',
  'U.S. bombing of Cambodia ends in August 1973. In April 1975 the Khmer Rouge take Phnom Penh; by December the Pathet Lao rule Laos, and many Hmong flee to Thailand.',
  'The Khmer Rouge kill an estimated 1.5–2 million Cambodians (1975–79). More than 100,000 Hmong eventually resettle abroad, many in the United States.'],

 mcn1965:{y:Y(1965,3,24),date:'Late March 1965',title:'U.S. aims in South Vietnam, by weight',who:'John McNaughton, Assistant Secretary of Defense, in a memo to Defense Secretary McNamara',type:'Secret internal memo (made public in the Pentagon Papers, 1971)',aud:'A handful of top officials',

 why:{q:'Why did the United States go to war in Vietnam?',v:[['Containing communism','U.S. leaders sincerely feared that a communist victory would spread across Asia and weaken U.S. allies. Given what they knew, intervening was a reasonable Cold War decision.','e.g., Mark Moyar, Triumph Forsaken (2006)'],['A choice driven by credibility','Leaders misread a nationalist, anti-colonial struggle as a Cold War contest. They escalated mainly to protect U.S. credibility and their own political standing, and passed over real alternatives.','e.g., Fredrik Logevall, Choosing War (1999); George Herring, America’s Longest War']],ev:'Compare what leaders said in public (Johnson, 1965) with what they wrote in private (McNaughton, 1965).'},

 tet:{q:'Did the news media turn the Tet Offensive into a U.S. defeat?',v:[['Yes: reporting misled the public','Tet was a military defeat for the communists, but reporters described it as a disaster for the U.S., and gloomy coverage turned Americans against the war.','e.g., Peter Braestrup, Big Story (1977)'],['No: coverage reflected real problems','Reporting mostly followed what officials and soldiers were saying. Public support had been falling for years as casualties rose, before Tet.','e.g., Daniel Hallin, The “Uncensored War” (1986); William Hammond, Reporting Vietnam (1998)']],ev:'Look at the U.S. deaths line in the troops chart. When did support start to fall? What did officials tell the public in late 1967?'},
 winnable:{q:'Could the United States have won?',v:[['No: the war was unwinnable','The South Vietnamese government never won enough popular support, and Hanoi was willing to pay almost any price. No U.S. strategy could fix that.','e.g., George Herring; Stanley Karnow, Vietnam: A History (1983)'],['Yes, or the South could have survived','A different strategy could have worked: cutting off the North’s supply lines, the improved approach under Gen. Creighton Abrams after 1968, or keeping Diem in power.','e.g., Harry Summers, On Strategy (1982); Lewis Sorley, A Better War (1999); Mark Moyar']],ev:'What would “winning” have meant: a separate South Vietnam that could defend itself? How did the South’s army perform in 1972 and in 1975?'},
 antiwar:{q:'Did the antiwar movement shorten the war?',v:[['Yes','Protests limited how far Johnson and Nixon could escalate, pushed Johnson toward talks, and pressed Nixon to bring troops home.','e.g., Melvin Small, Antiwarriors (2002)'],['No, or not much','Many Americans disliked the protesters even as they soured on the war. The movement’s radical image may have helped Nixon win and kept the war going longer.','e.g., Adam Garfinkle, Telltale Hearts (1995)']],ev:'Compare Nixon’s 1969 speech, Kerry’s 1971 testimony and the 1972 election result.'},
 fall:{q:'Why did South Vietnam fall in 1975?',v:[['The U.S. abandoned its ally','After the Paris Accords, Congress cut aid sharply and the U.S. did not respond to violations as Nixon had privately promised Thieu. Without supplies, the South could not fight.','e.g., George Veith, Black April (2012)'],['The South’s own weaknesses and Hanoi’s strength','Corruption, poor leadership and Thieu’s hasty retreat from the Central Highlands mattered more. Hanoi was determined, and more aid would only have delayed the end.','A view found in many general histories, such as Herring’s']],ev:'What did Thieu say in his resignation speech? Why should a historian be careful with that source?'},
};

 {y:Y(1954,7,25),t:'A colonial war ends',z:0,L:{battles:1,trail:0,bomb:0,bases:0},lens:'over',

const NSTOP=STOPS.length;
let BASEPH=null,API=null,ZSEG=null,LSEG=null,CUR=null,NOTES={};
try{NOTES=JSON.parse(localStorage.getItem('vn2-notes')||'{}')||{};}catch(e){NOTES={};}
const saveNotes=()=>{try{localStorage.setItem('vn2-notes',JSON.stringify(NOTES));}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ta=(k,ph)=>`<textarea data-note="${k}" placeholder="${ph||'Type here…'}">${esc(NOTES[k])}</textarea>`;
function srcCard(id,open){const s=SRC[id];return `<div class="src"><div class="meta">Primary source · ${s.date}</div><h3 class="st">${s.title}</h3><div class="meta"><b>${s.who}</b><br>${s.type}</div>${s.q}
 <details${open?' open':''}><summary>Source it: questions to ask</summary><ul><li><b>Who</b> made this, and what was their role in the war?</li><li><b>Audience:</b> ${s.aud}. How might that shape what is said?</li><li><b>Purpose:</b> what did the author want people to think or do?</li><li><b>Silences:</b> what might it leave out?</li><li>${s.ask}</li></ul></details>
 <p class="meta"><a href="${s.url}" target="_blank" rel="noopener">Read more of this source ↗</a>${s.y?` · <button class="lnk" data-act="srcgo" data-id="${id}">Go to ${s.date} on the map</button>`:''}</p></div>`;}
function backToStop(){return CUR!=null?`<button class="btn" data-act="stop" data-i="${CUR}">← Back to stop ${CUR+1}</button>`:'';}
function debCard(id){const d=DEB[id];return `<div class="deb"><h3 class="st">⚖ ${d.q}</h3>${d.v.map(v=>`<div class="view"><b>${v[0]}</b>${v[1]}<div class="meta">${v[2]}</div></div>`).join('')}<p class="meta"><b>Weigh the evidence:</b> ${d.ev}</p><div class="box"><b>Where do you stand so far, and why?</b>${ta('d_'+id)}</div></div>`;}
function stopHTML(i){const s=STOPS[i];const shown=!s.p||NOTES['s'+i+'_rev'];
 const dots=STOPS.map((x,j)=>`<button class="dot${j===i?' on':''}${NOTES['s'+j+'e']?' done':''}" data-act="stop" data-i="${j}" title="${j+1}. ${x.t}">${j+1}</button>`).join('')+`<button class="dot${NOTES.claim?' done':''}" data-act="stop" data-i="${NSTOP}" title="Your answer">✓</button>`;
 return `<div class="inq"><div class="dots">${dots}</div><div class="prog">Stop ${i+1} of ${NSTOP} · ${fmtM(s.y)}</div><h2>${s.t}</h2><p>${s.c}</p>
 ${s.p?`<div class="box pred"><b>Predict first.</b> ${s.p}${ta('s'+i+'p')}${shown?'':`<button class="pri" data-act="reveal" data-i="${i}">Reveal what happened</button>`}</div>`:''}
 <div id="rev${i}" style="display:${shown?'':'none'}"><p class="out"><b>What happened:</b> ${s.r}</p>${s.s.map(id=>srcCard(id)).join('')}
 ${s.d?`<button class="btn deb-b" data-act="debate" data-id="${s.d}">⚖ Historians disagree: ${DEB[s.d].q}</button>`:''}
 <div class="box ev"><b>Your evidence.</b> ${s.e}${ta('s'+i+'e','Write 2–4 sentences. Name your source.')}</div></div>
 <div class="nav">${i>0?`<button class="btn" data-act="stop" data-i="${i-1}">← Back</button>`:'<span></span>'}<button class="pri" data-act="stop" data-i="${i+1}">${i<NSTOP-1?'Next stop →':'Write your answer →'}</button></div></div>`;}
function claimHTML(){return `<div class="inq"><div class="dots">${STOPS.map((x,j)=>`<button class="dot${NOTES['s'+j+'e']?' done':''}" data-act="stop" data-i="${j}" title="${j+1}. ${x.t}">${j+1}</button>`).join('')}<button class="dot on">✓</button></div><div class="prog">Final step</div><h2>Your answer</h2>
 <div class="eqq">${EQ}</div><p>Answer the essential question in a short argument. Use evidence from at least two stops, and name your sources.</p>
 <div class="box"><b>Your name</b>${ta('name','Name')}</div>
 <div class="box"><b>1. Claim.</b> Your answer in one or two sentences.${ta('claim')}</div>
 <div class="box"><b>2. Evidence.</b> A fact or quotation that supports your claim, and where it comes from.${ta('ev1')}</div>
 <div class="box"><b>3. More evidence.</b> From a different stop or source.${ta('ev2')}</div>
 <div class="box"><b>4. Counterargument.</b> How might a historian who disagrees with you answer? (The “Historians disagree” cards can help.)${ta('counter')}</div>
 <div class="box"><b>5. Your response.</b> Why do you still hold your claim, or how would you change it?${ta('resp')}</div>
 <div class="nav"><button class="btn" data-act="stop" data-i="${NSTOP-1}">← Back</button><span><button class="btn" data-act="copy">Copy my notes</button> <button class="pri" data-act="dl">Download my notes</button></span></div>
 <p class="meta" id="cpmsg">Your notes are saved only in this browser on this device. Download or copy them to hand them in.</p></div>`;}
function sourcesHTML(){const ids=Object.keys(SRC);return `<h2>Primary sources</h2><p>Thirteen voices from the war. Speeches and government documents are quoted directly. Memoirs and broadcasts are quoted briefly or summarized, with links to read more. Open each source’s “Source it” questions as you read.</p>${backToStop()}<ul class="hist">${ids.map(id=>`<li><button class="lnk" data-act="src" data-id="${id}"><b>${SRC[id].title}</b></button><br><span class="meta">${SRC[id].who.split(',')[0]} · ${SRC[id].date}</span></li>`).join('')}</ul>`;}
function debatesHTML(){return `<h2>Historians disagree</h2><p>Historians agree on most of the facts, but they argue about what the facts mean. Here are six big arguments, each summarized in two positions. Real historians’ views have more nuance than these short summaries.</p>${backToStop()}${Object.keys(DEB).map(id=>`<p><button class="lnk" data-act="debate" data-id="${id}">⚖ <b>${DEB[id].q}</b></button></p>`).join('')}`;}
function notesText(){const L=[];L.push('VIETNAM WAR INVESTIGATION — NOTES','Name: '+(NOTES.name||''),'Essential question: '+EQ,'');
 STOPS.forEach((s,i)=>{L.push(`STOP ${i+1}: ${s.t} (${fmtM(s.y)})`);if(s.p)L.push('  Prediction: '+(NOTES['s'+i+'p']||'—'));L.push('  Evidence: '+(NOTES['s'+i+'e']||'—'),'');});
 const dk=Object.keys(DEB).filter(k=>NOTES['d_'+k]);if(dk.length){L.push('HISTORIANS DISAGREE');dk.forEach(k=>L.push('  '+DEB[k].q+' — '+NOTES['d_'+k]));L.push('');}
 L.push('MY ANSWER','  Claim: '+(NOTES.claim||'—'),'  Evidence 1: '+(NOTES.ev1||'—'),'  Evidence 2: '+(NOTES.ev2||'—'),'  Counterargument: '+(NOTES.counter||'—'),'  My response: '+(NOTES.resp||'—'));return L.join('\n');}
function setLens(id){const L=LENSES.find(l=>l.id===id)||LENSES[0];CFG.phases.forEach((p,i)=>{p[2]=id==='over'?BASEPH[i]:`<b>${L.pre}:</b> ${LT[id][i]}`;});API.render();}
function pickSeg(seg,i){const b=seg&&seg.querySelectorAll('button')[i];if(b&&!b.classList.contains('on'))b.click();}
function goStop(i){if(i<0||i>NSTOP)return;if(API.state.playing)document.getElementById('play').click();

 CUR=i;const s=STOPS[i];API.state.y=s.y;const ins=document.querySelectorAll('#layers input');CFG.layers.forEach((l,k)=>{if(l.id in s.L){API.state.layers[l.id]=!!s.L[l.id];if(ins[k])ins[k].checked=!!s.L[l.id];}});
 pickSeg(LSEG,LENSES.findIndex(l=>l.id===s.lens));pickSeg(ZSEG,s.z);API.render();API.open(stopHTML(i));}

 document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!b.closest('#panel'))return;const a=b.dataset.act;

 overview:`<h2>The Vietnam War: An Investigation</h2>
<div class="eq"><span>Essential question</span>Why did the United States go to war in Vietnam, and why couldn’t it reach its goals?</div>
<div class="tools"><button class="pri" data-act="stop" data-i="0">🔎 Start the investigation</button><button data-act="sources">📜 Primary sources</button><button data-act="debates">⚖ Historians disagree</button></div>
<p>From 1954 to 1975, Vietnamese communists fought first France and then South Vietnam and the United States, which sent more than half a million troops at the peak. The war spread into Laos and Cambodia, divided Americans, and ended with communist governments across Indochina.</p>
<h3>Ways to use this page</h3>
<ul><li><b>Investigate.</b> Eight stops take you from 1954 to 1975. At each one you make a prediction, read primary sources, and record evidence, then write your own answer to the essential question.</li>
<li><b>Change the point of view.</b> Use <b>Point of view</b> at the top to see each period from Washington, Hanoi, Saigon, the villages, the U.S. home front, or Laos and Cambodia.</li>
<li><b>Explore freely.</b> Press <b>▶</b> or drag the slider. Turn on more map layers, and click battles, countries and timeline dots for details.</li></ul>
<h3>Ideas to keep in view</h3>
<ul><li><b>Many wars in one.</b> It was a war of independence, a civil war among Vietnamese, and a Cold War contest, depending on whom you ask.</li>
<li><b>A war without front lines.</b> In the South, guerrillas often controlled the countryside at night while the government held cities and bases. The hatched areas on the map are rough sketches of communist strongholds, not borders.</li>
<li><b>Escalation and withdrawal.</b> U.S. involvement grew step by step under five presidents, peaked in 1968–69, and was wound down under Nixon.</li></ul>
<h3>Questions to explore</h3>
<ul><li>Switch between points of view for the same year. Which view is easiest for you to understand, and which is hardest? Why might that be?</li>
<li>In 1975 Laos and Cambodia became communist, but Thailand and the rest of Southeast Asia did not. Was the domino theory right, wrong or partly right?</li>
<li>Was the Vietnam War a war of independence, a civil war, a Cold War battle, or all three? Defend your answer with evidence.</li>
<li>Some sources here were created during the war (speeches, memos), others years later (memoirs). How does timing affect how much you trust a source?</li>
<li>Compare this war with the Korean War. Why did one end with a divided country and the other with a unified one?</li></ul>
<h3>Read with care</h3>
<ul><li>The point-of-view summaries are simplified: within every group people disagreed, and no short summary speaks for everyone.</li>
<li>The historians’ positions are short summaries of longer, more nuanced arguments.</li>
<li>Government documents are quoted directly. Memoirs and broadcasts under copyright are quoted briefly or summarized, with links to read more.</li>
<li>Areas of communist control are approximate. Death tolls are estimates and vary widely, especially for Vietnamese civilians, Cambodians and Laotians.</li>
<li>Some sources describe violence against civilians, including a massacre, torture and a protest suicide. Take your time with them, and talk to someone you trust if anything is upsetting.</li>
<li>Your notes are saved only in this browser on this device. Download or copy them to hand them in.</li></ul>
<details><summary>Sources</summary><ul>
<li>Primary sources: Public Papers of the Presidents (American Presidency Project); National Archives (Tonkin Gulf Resolution; Pentagon Papers); DocsTeach; Fordham Modern History Sourcebook; Senate Foreign Relations Committee hearings (1971); CBS News (1968); U.S. Department of Defense Vietnam War Commemoration; memoirs by Le Ly Hayslip (1989) and Truong Nhu Tang (1985).</li>
<li>Historians: George Herring, <i>America’s Longest War</i>; Fredrik Logevall, <i>Choosing War</i>; Mark Moyar, <i>Triumph Forsaken</i>; Edwin Moïse, <i>Tonkin Gulf and the Escalation of the Vietnam War</i>; Peter Braestrup, <i>Big Story</i>; Daniel Hallin, <i>The “Uncensored War”</i>; Lewis Sorley, <i>A Better War</i>; Harry Summers, <i>On Strategy</i>; Melvin Small, <i>Antiwarriors</i>; Adam Garfinkle, <i>Telltale Hearts</i>; George Veith, <i>Black April</i>; Stanley Karnow, <i>Vietnam: A History</i>.</li>
<li>U.S. troop levels and deaths: Edwin Moïse, “Selected Statistics on the Vietnam War” (Clemson University); Department of Defense.</li>
<li>Deaths: Vietnam’s government (1995), as reported by Encyclopaedia Britannica and the Associated Press; U.S. records (58,220 U.S. deaths). Bombing of Laos and Cambodia: Defense Department figures as reported by NPR; Ben Kiernan and Taylor Owen.</li>
<li>Hmong “Secret War”: Hmong Museum (Minnesota); CIA Studies in Intelligence. Country outlines: Natural Earth.</li></ul></details>`,
};

document.getElementById('title').textContent=C.title; document.getElementById('sub').textContent=C.sub;
const state={y:C.T0,playing:false,speed:1,mode:C.modes?C.modes[0].id:null,sel:null,layers:Object.fromEntries((C.layers||[]).map(l=>[l.id,l.on!==false]))};
try{const s=JSON.parse(localStorage.getItem(C.key+'-layers')||'null');if(s)for(const k in s)if(k in state.layers)state.layers[k]=s[k];}catch(e){}
const W=975,H=C.H||560;
const svg=document.getElementById('map'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('aria-label',C.title);
const defs=el('defs',{},svg);
function hatch(id,bg,fg,size=6,w=2.2){const p=el('pattern',{id,width:size,height:size,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);el('rect',{width:size,height:size,fill:bg},p);el('line',{x1:0,y1:0,x2:0,y2:size,stroke:fg,'stroke-width':w},p);}
const tipEl=document.getElementById('tip'), box=document.getElementById('mapbox');
function tip(e,html){const r=box.getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+14;if(x>r.width-280)x-=300;if(y>r.height-80)y-=60;tipEl.innerHTML=html;tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.style.opacity=1;}
function hideTip(){tipEl.style.opacity=0;}
function hover(node,fn){node.addEventListener('mousemove',e=>tip(e,fn()));node.addEventListener('mouseleave',hideTip);}
const panel=document.getElementById('panel');
function open(html){panel.innerHTML=`<button class="back">← Overview</button>`+html;panel.querySelector('.back').onclick=()=>{state.sel=null;render();panel.innerHTML=C.overview;};panel.scrollTop=0;if(window.innerWidth<=980)panel.scrollIntoView({behavior:'smooth',block:'start'});}
function clickable(node,fn){node.addEventListener('click',fn);node.setAttribute('tabindex',0);node.addEventListener('keydown',e=>{if(e.key==='Enter')fn();});}

// zoom
let Z=1, view=[0,0,W,H], anim=null; const zoomHooks=[];
function setViewBox(r){view=r;svg.setAttribute('viewBox',r.map(v=>v.toFixed(1)).join(' '));Z=r[2]/W;svg.style.setProperty('--z',Z.toFixed(4));zoomHooks.forEach(f=>f(Z));}
function zoomTo(r){cancelAnimationFrame(anim);const from=view.slice(),t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/650),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;setViewBox(from.map((v,i)=>v+(r[i]-v)*e));if(k<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
function rectFor(proj,pts){const ps=pts.map(p=>proj(p)).filter(Boolean);const xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;if(w/h>W/H)h=w*H/W;else w=h*W/H;w*=1.08;h*=1.08;w=Math.min(w,W);h=Math.min(h,H);return [Math.max(0,Math.min(W-w,cx-w/2)),Math.max(0,Math.min(H-h,cy-h/2)),w,h];}
const hdr=document.getElementById('hdrctl');
function seg(label,items,onPick){const wrap=document.createElement('div');wrap.innerHTML=`<div class="seg-label">${label}</div>`;const s=document.createElement('div');s.className='seg';
  items.forEach((it,i)=>{const b=document.createElement('button');b.textContent=it.label;b.classList.toggle('on',i===0);b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));onPick(it);};s.appendChild(b);});wrap.appendChild(s);hdr.appendChild(wrap);return s;}
if(C.modes&&C.modes.length>1) seg('Color by',C.modes,m=>{state.mode=m.id;render();});

// layers
const ly=document.getElementById('layers');
(C.layers||[]).forEach(l=>{const lab=document.createElement('label');lab.innerHTML=`<input type="checkbox" ${state.layers[l.id]?'checked':''}> ${l.label}`;lab.querySelector('input').onchange=e=>{state.layers[l.id]=e.target.checked;try{localStorage.setItem(C.key+'-layers',JSON.stringify(state.layers));}catch(err){}render(true);};ly.appendChild(lab);});

// charts helper
const chartsEl=document.getElementById('charts');
function chart(title,note,h=180){const div=document.createElement('div');div.className='chart';div.innerHTML=`<h2>${title}</h2><p>${note}</p>`;const s=el('svg',{viewBox:`0 0 440 ${h}`,role:'img','aria-label':title});div.appendChild(s);chartsEl.appendChild(div);return s;}
function axes(s,{x0,x1,max,min=0,log=false,yticks,xticks,yfmt=v=>v,h=180,L=40}){const w=440,R=10,T=10,B=22;
  const X=v=>L+(v-x0)/(x1-x0)*(w-L-R); const Y=log?(v=>h-B-(Math.log10(Math.max(v,min))-Math.log10(min))/(Math.log10(max)-Math.log10(min))*(h-B-T)):(v=>h-B-(v-min)/(max-min)*(h-B-T));
  for(const t of yticks){el('line',{x1:L,x2:w-R,y1:Y(t),y2:Y(t),stroke:'#e6e1d6'},s);const tx=el('text',{x:L-6,y:Y(t)+3,class:'ax','text-anchor':'end'},s);tx.textContent=yfmt(t);}
  for(const t of xticks){const tx=el('text',{x:X(t),y:h-6,class:'ax','text-anchor':'middle'},s);tx.textContent=t;}
  return {X,Y,L,R,T,B,w,h};}

// timeline
const slider=document.getElementById('slider');
const WP=C.warp||[[C.T0,0],[C.T1,1]];
const fw=y=>{for(let i=0;i<WP.length-1;i++){const [a,fa]=WP[i],[b,fb]=WP[i+1];if(y<=b||i===WP.length-2)return fa+(fb-fa)*Math.max(0,Math.min(1,(y-a)/(b-a)));}};
const fi=v=>{for(let i=0;i<WP.length-1;i++){const [a,fa]=WP[i],[b,fb]=WP[i+1];if(v<=fb||i===WP.length-2)return a+(b-a)*Math.max(0,Math.min(1,(v-fa)/(fb-fa)));}};
slider.min=0; slider.max=1; slider.step=0.0002;
const pos=y=>(fw(y)*100)+'%';
(function(){const t=document.getElementById('ticks');for(const [y,odd,lab] of C.ticks){const s=document.createElement('span');s.style.left=pos(y);s.textContent=lab||y;if(odd)s.className='odd';t.appendChild(s);}
  const dd=document.getElementById('evdots');C.events.forEach((e,i)=>{const b=document.createElement('button');b.style.left=pos(e[0]);b.style.background=C.evTypes[e[1]][1];b.title=`${e[2]}: ${e[3]}`;b.setAttribute('aria-label',b.title);b.onclick=()=>{stop();state.y=Math.min(C.T1,e[0]+0.0005);render();showEvent(i);};dd.appendChild(b);});
  document.getElementById('evkey').innerHTML=Object.values(C.evTypes).map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('');})();
let raf,lastT=null; const playBtn=document.getElementById('play');
function rateAt(y){ for(const r of C.rates) if(y>=r[0]&&y<r[1]) return r[2]; return C.rates[C.rates.length-1][2]; }
function tick(ts){ if(!state.playing) return; if(lastT!=null){ state.y=Math.min(C.T1,state.y+Math.min(0.1,(ts-lastT)/1000)*rateAt(state.y)*state.speed); render(); } lastT=ts; if(state.y>=C.T1){stop();return;} raf=requestAnimationFrame(tick); }
function play(){ if(state.y>=C.T1) state.y=C.T0; state.playing=true; lastT=null; playBtn.textContent='❚❚'; playBtn.setAttribute('aria-label','Pause'); raf=requestAnimationFrame(tick); }
function stop(){ state.playing=false; cancelAnimationFrame(raf); playBtn.textContent='▶'; playBtn.setAttribute('aria-label','Play'); }
playBtn.onclick=()=>state.playing?stop():play();
document.getElementById('speed').onchange=e=>state.speed=+e.target.value;
slider.oninput=e=>{stop();state.y=fi(+e.target.value);render();};
document.addEventListener('keydown',e=>{ if(e.target.closest('input,select,button,[tabindex]')) return; const st=C.step||1; if(e.code==='Space'){e.preventDefault();state.playing?stop():play();} if(e.key==='ArrowRight'){stop();state.y=Math.min(C.T1,state.y+st);render();} if(e.key==='ArrowLeft'){stop();state.y=Math.max(C.T0,state.y-st);render();} });
function showEvent(i){ const e=C.events[i]; open(`<span class="badge" style="background:${C.evTypes[e[1]][1]}">${C.evTypes[e[1]][0]}</span><span class="when">${e[2]}</span><h2>${e[3]}</h2><p>${e[4]}</p>`); }

const api={svg,defs,el,W,H,state,hatch,tip,hideTip,hover,open,clickable,chart,axes,zoomTo,rectFor,setViewBox,seg,zoomHooks,get Z(){return Z;},render:()=>render(true),fmtM,Y};
C.setup(api);
function render(force){
  const y=state.y;
  document.getElementById('yr').innerHTML=(C.fmtYear||(y=>`${Math.floor(y)}<small>${fmtM(y)}</small>`))(y);
  const ph=(C.phases.find(p=>y>=p[0]&&y<p[1])||C.phases[C.phases.length-1])[2];
  const recent=[...C.events].reverse().find(e=>e[0]<=y&&y-e[0]<(C.recent||2));
  document.getElementById('phase').innerHTML=ph+(recent?`<span class="ev">Latest: <b>${recent[3]}</b> (${recent[2]})</span>`:'');
  slider.value=fw(y);
  const out=C.render(y,api,force)||{};
  if(out.legend) document.getElementById('legend').innerHTML=out.legend.map(([c,l,extra])=>`<span><i style="background:${c};${extra||''}"></i>${l}</span>`).join('');
  if(out.stat!=null) document.getElementById('stat').innerHTML=out.stat;
}
setViewBox(api.initView||[0,0,W,H]); render(true); panel.innerHTML=C.overview;
