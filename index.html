<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bantu Expansion — Interactive Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe3; --panel:#fffaf1; --ink:#2a2118; --muted:#6f6253; --line:#d9ccb4;
  --ocean:#dbe5e6; --land:#f0e4cc; --land2:#e7e0d3; --border:#c9b996;
  --forest:#4f8a4c; --trunk:#5a3a22; --west:#17807c; --east:#c2492a;
  --ling:#6a4c93; --arch:#b06a1c; --gen:#2b6cb0; --env:#3b8a3b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{padding:18px 24px 10px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.seg-label{font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:calc(100vh - 80px)}
#mapwrap{position:relative;padding:12px 16px 0 24px;display:flex;flex-direction:column}
svg#map{width:100%;height:auto;max-height:calc(100vh - 230px);display:block;background:var(--ocean);border-radius:14px;border:1px solid var(--line);touch-action:manipulation}
aside{border-left:1px solid var(--line);background:var(--panel);padding:20px 22px 28px;overflow:auto;max-height:calc(100vh - 80px);position:sticky;top:0}
.land{fill:var(--land);stroke:var(--border);stroke-width:.6}
.land.out{fill:var(--land2)}
.forest{fill:var(--forest);opacity:.26}
.sri{fill:#e9d79a;opacity:.85;stroke:#b9a254;stroke-dasharray:3 3;stroke-width:1}
.today{fill:url(#hatch);stroke:#9b6b4a;stroke-width:1;stroke-dasharray:5 4;opacity:.9}
.lake{fill:var(--ocean);stroke:#9db3b8;stroke-width:.7}
.river{fill:none;stroke:#8fb0b8;stroke-width:1.3;stroke-linecap:round}
.lbl{font-size:10.5px;fill:#6d8389;font-style:italic;pointer-events:none}
.lbl.ocean{font-size:12px;letter-spacing:.25em;fill:#8aa0a6;font-style:normal}
.lbl.forest{font-size:12.5px;fill:#3f6e3c;letter-spacing:.04em}
.lbl.region{font-size:12px;fill:#a3916f;letter-spacing:.12em;text-transform:uppercase;font-style:normal}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ghost{fill:none;stroke-width:1.4;stroke-dasharray:2 5;opacity:.45;stroke-linecap:round}
.site{cursor:pointer}
.site .dot{stroke:#fff;stroke-width:2}
.site .halo{fill:none;stroke-width:1.5;stroke-dasharray:3 3}
.site.future{opacity:.28}
.site.future .dot{fill:#fff !important;stroke:#8a7b66;stroke-width:1.5}
.site.sel .dot{stroke:var(--ink);stroke-width:2.5}
.site.dim{opacity:.15}
.site .name{font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.site.future .name{display:none}
.site.pop .dot{animation:pop .7s ease-out}
@keyframes pop{0%{r:2}60%{r:11}100%{}}
.people{cursor:pointer}
.people text{font-size:11px;fill:#7a5c3c;font-style:italic;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.people .pt{font-weight:600;font-style:normal;letter-spacing:.02em}
.homering{fill:none;stroke:var(--trunk);stroke-width:1.5;stroke-dasharray:4 3}
.hidden{display:none}
.front{pointer-events:none}

/* timeline */
#timeline{padding:14px 2px 18px}
.tl-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#play{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:15px;cursor:pointer;flex:none}
#play:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--east);outline-offset:2px}
.yr{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:650;min-width:150px;line-height:1.1}
.yr small{display:block;font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:400}
.phase{flex:1;min-width:220px;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.track{position:relative;margin:14px 6px 0;height:46px}
#slider{width:100%;margin:0;position:absolute;top:0;left:0;accent-color:var(--east);height:20px}
.ticks{position:absolute;top:30px;left:0;right:0;height:16px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.evdots{position:absolute;top:21px;left:0;right:0;height:8px}
.evdots button{position:absolute;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;transform:translateX(-50%);padding:0;cursor:pointer}
.speed{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.speed select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 4px}

/* panel */
aside h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 4px;line-height:1.2}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:600}
aside p{margin:0 0 10px}
.place{color:var(--muted);font-size:13px;margin-bottom:10px}
.when{display:inline-block;font-size:12.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-bottom:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:11.5px;font-weight:600;color:#fff;border-radius:999px;padding:2px 9px}
.note{border-left:3px solid var(--east);padding:4px 0 4px 12px;color:#3f342a;background:linear-gradient(90deg,#f7e8dc,transparent)}
.src{font-size:12px;color:var(--muted)}
.back{border:0;background:none;color:var(--east);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13.5px}
.layers label{display:flex;align-items:center;gap:7px;cursor:pointer}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--c);color:#fff}
.legend-row{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0}
.legend-row svg{flex:none}
details{margin-top:18px;font-size:13px}
details summary{cursor:pointer;font-weight:600}
details li{margin:4px 0}
a{color:var(--west)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}
@media (max-width:600px){.ticks span.odd{display:none}}
@media (max-width:900px){
  main{grid-template-columns:1fr}
  aside{border-left:0;border-top:1px solid var(--line);max-height:none;position:static}
  svg#map{max-height:none}
  #mapwrap{padding:10px 10px 0}
  header{padding:14px 14px 10px}
  h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){.site.pop .dot{animation:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>The Bantu Expansion</h1>
    <div class="sub">How Bantu languages and farming spread across half a continent, c. 3000 BCE – 1500 CE</div>
  </div>
  <div>
    <div class="seg-label">Route model</div>
    <div class="seg" id="modelSeg" role="group" aria-label="Route model">
      <button data-m="late" class="on">Late split</button>
      <button data-m="early">Early split</button>
      <button data-m="both">Compare</button>
    </div>
  </div>
</header>
<main>
  <section id="mapwrap">
    <svg id="map" role="img" aria-label="Map of Africa showing Bantu migration routes"></svg>
    <div class="tip" id="tip"></div>
    <div id="timeline">
      <div class="tl-top">
        <button id="play" aria-label="Play">▶</button>
        <div class="yr" id="yr">3000 BCE<small>≈ 5,000 years ago</small></div>
        <div class="phase" id="phase"></div>
        <label class="speed">Speed
          <select id="speed"><option value="0.5">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option></select>
        </label>
      </div>
      <div class="track">
        <input type="range" id="slider" min="-3000" max="1500" step="10" value="-3000" aria-label="Year">
        <div class="evdots" id="evdots"></div>
        <div class="ticks" id="ticks"></div>
      </div>
    </div>
  </section>
  <aside id="panel"></aside>
</main>

6,392.3,-100],[420.5,393.4,-86],[422.4,394.6,-71],[424.3,395.9,-57],[426.2,397.4,-43],[428,399,-29],[430,400.9,-14],[431.9,403,0],[433.9,405.5,21],[436,408.4,43],[438.1,411.6,64],[440.3,415,86],[442.5,418.7,107],[444.6,422.4,129],[446.7,426.1,150],[448.6,429.8,171],[450.5,433.4,193],[452.3,436.7,214],[453.9,439.8,236],[455.4,442.5,257],[456.7,444.9,279],[457.7,446.7,300]]}]},"sites":[{"id":"homeland","name":"The Bantu homeland","place":"Grassfields & Cross River area, Cameroon–Nigeria border","lon":10.6,"lat":6.4,"year":-3000,"when":"Spread begins c. 5,000–4,000 years ago","ev":["linguistic"],"homeland":true,"text":"Bantu is one branch of the huge Niger-Congo language family. Its closest relatives, the Grassfields and other Bantoid languages, are packed into this small border region. Linguists treat the spot where a family's deepest branches meet as its most likely birthplace, much as the greatest variety of a crop usually marks where it was first domesticated.","note":"Reconstructed early Bantu vocabulary points to village life: pottery, goats, fishing, and tending yams and oil palms. Iron working came later and was picked up along the way. It did not set off the expansion.","x":199.6,"y":89},{"id":"shumlaka","name":"Shum Laka rock shelter","place":"Grassfields, northwest Cameroon","lon":10.07,"lat":5.86,"year":-1000,"when":"Burials c. 8,000 and 3,000 years ago","ev":["genetic","archaeological"],"text":"People used this rock shelter for about 30,000 years, and it lies inside the probable Bantu homeland. In 2020 researchers sequenced DNA from four children buried here, two from about 8,000 years ago and two from about 3,000 years ago. These were the first ancient genomes from West or Central Africa.","note":"The surprise was that their ancestry looks quite different from most present-day Bantu speakers. Roughly a third comes from a lineage related to Central African hunter-gatherers. So the homeland was home to genetically diverse groups, and the population that carried Bantu languages outward wasn't the one buried here.","src":"Lipson et al. 2020, Nature","x":190.7,"y":98.3},{"id":"obobogo","name":"Obobogo","place":"Near Yaoundé, southern Cameroon","lon":11.5,"lat":3.85,"year":-1000,"when":"First millennium BCE","ev":["archaeological"],"text":"This is one of the earliest known village sites on the forest margin of southern Cameroon. Its pits held pottery, stone tools, and the remains of oil-palm and canarium nuts, the kind of settled forest-edge life that the reconstructed early Bantu vocabulary describes.","x":214.6,"y":131.2},{"id":"sri","name":"Sangha River Interval","place":"Savanna corridor through the rainforest","lon":16.9,"lat":1.8,"year":-500,"when":"Corridor fully open c. 2,500 years ago","ev":["environmental","linguistic"],"region":true,"text":"About 3,000–2,500 years ago a drier climate broke up the Central African rainforest, and a strip of savanna opened along the Sangha River. Researchers long saw this corridor as the gateway that let farming peoples cross the forest.","note":"A 2022 phylogeographic study of Bantu language trees dates the forest crossing to about 4,400 years ago. That is well before the corridor opened, which suggests early Bantu speakers could move through intact forest, probably along rivers. The forest crisis may still have sped up later movements. This is an open question.","src":"Koile et al. 2022, PNAS","x":305.5,"y":163.1},{"id":"imbonga","name":"Imbonga tradition","place":"Inner Congo Basin, near Mbandaka","lon":18.3,"lat":0.05,"year":-400,"when":"From c. 4th century BCE","ev":["archaeological"],"text":"Imbonga pottery marks some of the earliest well-dated villages deep in the inner Congo Basin. The sites sit along the river network, consistent with people using waterways as highways through the forest.","x":329.3,"y":191.9},{"id":"latesplit","name":"Genetic clue: who are eastern Bantu speakers closest to?","place":"Western Bantu speakers south of the rainforest","lon":18.2,"lat":-8.6,"year":-1300,"when":"Split estimated after the forest crossing","ev":["genetic","linguistic"],"region":true,"text":"Genome-wide studies find that Bantu speakers in eastern and southern Africa are genetically closer to western Bantu speakers living south of the rainforest than to those still living north of it. That is what the late-split model predicts: the eastern branch broke off after the forest had been crossed.","note":"Bayesian trees of hundreds of Bantu languages agree, placing East Bantu as a late offshoot of West Bantu. Some archaeologists still read the Urewe evidence as supporting an earlier route north of the forest.","src":"de Filippo et al. 2012; Grollemund et al. 2015; Patin et al. 2017; Semo et al. 2020","x":329.2,"y":336.9},{"id":"urewe","name":"Urewe culture","place":"Around Lake Victoria (Kenya, Uganda, Tanzania, Rwanda)","lon":34.1,"lat":0.1,"year":-500,"when":"From c. 500 BCE","ev":["archaeological"],"text":"Urewe is an Early Iron Age tradition known for 'dimple-based' pottery and iron smelting. Some of the earliest iron furnaces in eastern Africa are found in this region. It is widely linked to early East Bantu speakers.","note":"The two models tell its origin differently. In the early-split model, Urewe's makers came along the northern edge of the forest. In the late-split model, they came from the southwest after crossing it.","x":595.5,"y":192.7},{"id":"kwale","name":"Kwale","place":"Kenyan coast, near Mombasa","lon":39.45,"lat":-4.17,"year":150,"when":"c. 2nd–3rd century CE","ev":["archaeological"],"text":"Kwale-ware pottery is closely related to Urewe ware. It shows Iron Age farming communities reaching the Indian Ocean coast within a few centuries of settling the Great Lakes.","x":683.6,"y":267.8},{"id":"matola","name":"Matola","place":"Southern Mozambique, near Maputo","lon":32.45,"lat":-25.97,"year":250,"when":"Early first millennium CE","ev":["archaeological"],"text":"These coastal sites have pottery tied to the Kwale tradition. They show how fast the eastern stream moved: more than 2,000 km down the coast in just a few centuries.","x":553.6,"y":629.2},{"id":"lydenburg","name":"Lydenburg Heads","place":"Mpumalanga, South Africa","lon":30.45,"lat":-25.1,"year":500,"when":"c. 500–600 CE","ev":["archaeological"],"text":"These seven terracotta heads came from an early farming community. They are among the oldest known sculptures in southern Africa and evidence of a settled Iron Age society.","x":523.9,"y":613.6},{"id":"clicks","name":"Click consonants in Nguni languages","place":"KwaZulu-Natal & Eastern Cape","lon":29.2,"lat":-30.6,"year":650,"when":"Contact over many centuries","ev":["linguistic","genetic"],"region":true,"text":"Zulu, Xhosa and other Nguni languages use click consonants borrowed from Khoe and San languages. The clicks record long contact and intermarriage, and genetic studies of southern Bantu speakers also find substantial Khoe-San ancestry.","note":"The farmers did not move into empty land. In every region the expansion was a story of interaction, exchange and mixing with the people already living there.","x":501.4,"y":704.5},{"id":"collapse","name":"Population collapse in the Congo rainforest","place":"Across the Congo Basin","lon":21.6,"lat":-1.6,"year":400,"when":"c. 400–600 CE","ev":["archaeological","environmental"],"region":true,"text":"A 2021 analysis of 1,149 radiocarbon dates and 115 pottery styles from 726 sites found that Early Iron Age villages across the Congo rainforest largely vanished between 400 and 600 CE. Major resettlement didn't happen until centuries later, from about 1000 CE. The authors suggest a long epidemic during wetter conditions as one possible cause.","note":"This challenges the picture of one continuous expansion. Today's forest-dwelling Bantu speakers may descend largely from a later resettlement, a 'spread-over-spread' pattern.","src":"Seidensticker et al. 2021, Science Advances","x":385,"y":218.9},{"id":"kilwa","name":"Kilwa Kisiwani","place":"Southern Tanzanian coast","lon":39.51,"lat":-8.96,"year":1000,"when":"c. 1000–1500 CE","ev":["archaeological","linguistic"],"text":"Kilwa was one of the Swahili coastal city-states trading gold, ivory and other goods across the Indian Ocean. Swahili is a Bantu language that took in many Arabic loanwords. Its grammar and core vocabulary are Bantu.","x":681.5,"y":348.7},{"id":"mapungubwe","name":"Mapungubwe","place":"Limpopo valley, South Africa","lon":29.37,"lat":-22.2,"year":1000,"when":"c. 1000–1290 CE","ev":["archaeological"],"text":"Mapungubwe was an early state in southern Africa, with an elite hilltop settlement above the town. Glass beads and Chinese celadon found here show it was tied into Indian Ocean trade networks. Many see it as a forerunner of Great Zimbabwe.","x":509,"y":564.8},{"id":"greatzim","name":"Great Zimbabwe","place":"Southeastern Zimbabwe","lon":30.93,"lat":-20.27,"year":1100,"when":"c. 1100–1450 CE","ev":["archaeological"],"text":"Great Zimbabwe is a city of monumental dry-stone walls built by ancestors of today's Shona speakers. It was the capital of a state that controlled the gold trade with the coast. It shows the large, complex societies that later grew out of the expansion.","x":534.6,"y":533.1},{"id":"kongo","name":"Mbanza Kongo","place":"Northern Angola","lon":14.24,"lat":-6.27,"year":1390,"when":"Kingdom of Kongo, from late 1300s","ev":["archaeological"],"text":"Mbanza Kongo was the capital of the Kingdom of Kongo, a centralized Kikongo-speaking state that Portuguese ships reached in 1483. Its rulers are among the best-documented of any early Bantu-speaking polity.","x":262.6,"y":299.4}],"peoples":[{"id":"foragers","name":"Rainforest foragers","sub":"ancestors of Baka, Aka, Mbuti, Batwa","lon":26.6,"lat":0.3,"text":"Hunter-gatherers had lived in the Central African forest for tens of thousands of years. Genetic studies show long-term mixing between them and incoming Bantu speakers. Many forager groups now speak Bantu languages, while keeping their own forest knowledge and words.","x":469.2,"y":187.2},{"id":"ubangian","name":"Ubangian & Central Sudanic speakers","sub":"north of the forest","lon":22,"lat":6.4,"text":"Speakers of other language families lived along the northern forest edge. In the early-split model, the eastern Bantu stream would have travelled through their lands.","x":391.6,"y":85.7},{"id":"herders","name":"Cushitic- & Nilotic-speaking herders","sub":"Pastoral Neolithic, East Africa","lon":37.6,"lat":2.4,"text":"Herding peoples were already in East Africa when Bantu-speaking farmers arrived. Contact with them and other neighbours probably helped bring cattle, sheep and cereal crops like sorghum into Bantu-speaking communities.","x":654.5,"y":156},{"id":"khoesan","name":"Khoe-San peoples","sub":"hunter-gatherers & herders","lon":19.6,"lat":-27.6,"text":"Khoe and San communities had lived in southern Africa for a very long time. They exchanged goods, knowledge, spouses, and even sounds of speech with incoming farmers. In drier lands unsuited to their crops, farmers often did not settle at all.","x":359.4,"y":654.5}],"labels":[{"t":"L. Victoria","x":576.4,"y":245.8,"k":"lake"},{"t":"L. Tanganyika","x":495.5,"y":292.8,"k":"lake"},{"t":"L. Malawi","x":622.1,"y":390.5,"k":"lake"},{"t":"Congo R.","x":415.2,"y":155.4,"k":"river"},{"t":"Zambezi R.","x":503,"y":450.7,"k":"river"},{"t":"Limpopo R.","x":471.7,"y":587.5,"k":"river"},{"t":"Niger R.","x":106.5,"y":58.9,"k":"river"},{"t":"ATLANTIC OCEAN","x":104.6,"y":472.7,"k":"ocean"},{"t":"INDIAN OCEAN","x":806.8,"y":306.5,"k":"ocean"},{"t":"equatorial rainforest","x":267.5,"y":235.9,"k":"forest"},{"t":"Kalahari","x":369.5,"y":574.2,"k":"region"},{"t":"Madagascar","x":783.7,"y":536,"k":"region"}]};
const T0=-3000, T1=1500;
const EV = {linguistic:['Linguistic','--ling'],archaeological:['Archaeological','--arch'],genetic:['Genetic','--gen'],environmental:['Environmental','--env']};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const BR = {trunk:'--trunk',west:'--west',east:'--east'};
const LABEL_POS = {homeland:[10,-12,'start'],shumlaka:[-9,10,'end'],obobogo:[-9,14,'end'],sri:[10,17,'start'],imbonga:[10,4,'start'],latesplit:[-12,4,'end'],urewe:[10,-8,'start'],kwale:[9,4,'start'],matola:[9,10,'start'],lydenburg:[-9,4,'end'],clicks:[12,4,'start'],collapse:[0,24,'middle'],kilwa:[9,4,'start'],mapungubwe:[-9,-6,'end'],greatzim:[-9,-4,'end'],kongo:[-9,-4,'end']};
const SHORT = {homeland:'Homeland',shumlaka:'Shum Laka',obobogo:'Obobogo',sri:'Sangha corridor',imbonga:'Imbonga',latesplit:'Late-split genetic signal',urewe:'Urewe',kwale:'Kwale',matola:'Matola',lydenburg:'Lydenburg',clicks:'Nguni clicks',collapse:'Rainforest collapse',kilwa:'Kilwa',mapungubwe:'Mapungubwe',greatzim:'Great Zimbabwe',kongo:'Mbanza Kongo'};

const state = {year:T0, model:'late', playing:false, speed:1, sel:null, ev:new Set(), layers:{forest:true,today:false,peoples:true,ghost:true,labels:true,refs:true}};
try{ const s=localStorage.getItem('bantu-layers'); if(s) Object.assign(state.layers, JSON.parse(s)); }catch(e){}

const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const svg=document.getElementById('map');
svg.setAttribute('viewBox',`0 0 ${DATA.W} ${DATA.H}`);

// defs
const defs=el('defs',{},svg);
const hatch=el('pattern',{id:'hatch',width:7,height:7,patternUnits:'userSpaceOnUse',patternTransform:'rotate(40)'},defs);
el('rect',{width:7,height:7,fill:'rgba(194,73,42,.06)'},hatch);
el('line',{x1:0,y1:0,x2:0,y2:7,stroke:'rgba(155,107,74,.45)','stroke-width':1.6},hatch);
for(const b of Object.keys(BR)){
  const m=el('marker',{id:'arr-'+b,viewBox:'0 0 10 10',refX:6,refY:5,markerWidth:4.2,markerHeight:4.2,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',fill:css(BR[b])},m);
}

// layers
const gLand=el('g',{},svg);
for(const c of DATA.land) el('path',{d:c.d,class:'land'+(c.af?'':' out')},gLand);
const gForest=el('g',{},svg);
el('path',{d:DATA.rainforest,class:'forest'},gForest);
const gToday=el('g',{},svg); el('path',{d:DATA.bantuToday,class:'today'},gToday);
const gRefs=el('g',{},svg);
for(const d of DATA.rivers) el('path',{d,class:'river'},gRefs);
for(const d of DATA.lakes) el('path',{d,class:'lake'},gRefs);
const gSri=el('g',{},svg); el('path',{d:DATA.sri,class:'sri'},gSri);
const gLbl=el('g',{},svg);
for(const l of DATA.labels){const t=el('text',{x:l.x,y:l.y,class:'lbl '+l.k,'text-anchor':'middle'},gLbl);t.textContent=l.t;}

const gPeople=el('g',{},svg);
const gGhost=el('g',{},svg);
const gRoutes=el('g',{},svg);
const gSites=el('g',{},svg);


// peoples
for(const p of DATA.peoples){
  const g=el('g',{class:'people',tabindex:0},gPeople);
  const t=el('text',{x:p.x,y:p.y,'text-anchor':'middle'},g);
  const a=el('tspan',{x:p.x,class:'pt'},t); a.textContent=p.name;
  const b=el('tspan',{x:p.x,dy:13},t); b.textContent=p.sub;
  g.addEventListener('click',()=>showPeople(p));
  g.addEventListener('keydown',e=>{if(e.key==='Enter')showPeople(p);});
}

// sites
const siteEls={};
for(const s of DATA.sites){
  const g=el('g',{class:'site',tabindex:0,role:'button','aria-label':s.name},gSites);
  const col=css(EV[s.ev[0]][1]);
  if(s.homeland){ el('circle',{cx:s.x,cy:s.y,r:22,class:'homering'},g); }
  if(s.region){ el('circle',{cx:s.x,cy:s.y,r:15,class:'halo',stroke:col},g); }
  el('circle',{cx:s.x,cy:s.y,r:s.homeland?8:6.5,class:'dot',fill:s.homeland?css('--trunk'):col},g);
  const [dx,dy,anc]=LABEL_POS[s.id]||[9,4,'start'];
  const t=el('text',{x:s.x+dx,y:s.y+dy,class:'name','text-anchor':anc},g); t.textContent=SHORT[s.id]||s.name;
  g.addEventListener('click',()=>selectSite(s.id,true));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectSite(s.id,true);}});
  g.addEventListener('mouseenter',()=>showTip(s));
  g.addEventListener('mouseleave',hideTip);
  siteEls[s.id]=g;
}

// tooltip
const tip=document.getElementById('tip');
function showTip(s){
  if(state.layers.labels) return;
  const r=svg.getBoundingClientRect(), wrap=document.getElementById('mapwrap').getBoundingClientRect();
  tip.textContent=s.name; tip.style.left=(r.left-wrap.left+s.x/DATA.W*r.width)+'px'; tip.style.top=(r.top-wrap.top+s.y/DATA.H*r.height)+'px'; tip.style.opacity=1;
}
function hideTip(){tip.style.opacity=0;}

// routes
let routeEls=[];
function buildRoutes(){
  gRoutes.innerHTML=''; gGhost.innerHTML=''; routeEls=[];
  const models= state.model==='both' ? ['early','late'] : [state.model];
  for(const m of models){
    for(const r of DATA.routes[m]){
      const color=css(BR[r.branch]);
      const dash = state.model==='both' && m==='early';
      const ghost=el('path',{d:'M'+r.pts.map(p=>p[0]+','+p[1]).join('L'),class:'ghost',stroke:color},gGhost);
      const p=el('path',{class:'route',stroke:color,'stroke-width': r.branch==='trunk'?5:4,'marker-end':`url(#arr-${r.branch})`,opacity: dash ? .75 : .92},gRoutes);
      if(dash){p.setAttribute('stroke-dasharray','7 6');p.setAttribute('stroke-width',3.2);}
      routeEls.push({r,p,ghost});
    }
  }
  render();
}
function partial(pts,t){
  if(t<pts[0][2]) return '';
  let d='M'+pts[0][0]+','+pts[0][1];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    if(b[2]<=t){ d+='L'+b[0]+','+b[1]; continue; }
    const f=(t-a[2])/Math.max(1,(b[2]-a[2]));
    if(f>0) d+='L'+(a[0]+(b[0]-a[0])*f).toFixed(1)+','+(a[1]+(b[1]-a[1])*f).toFixed(1);
    break;
  }
  return d;
}

// phases
const PHASES = [
  [-3000,-2300,{late:'Farming villages begin spreading south from the homeland toward the rainforest.',early:'Farming villages begin spreading from the homeland. In this model the speakers split early into eastern and western groups.'}],
  [-2300,-1300,{late:'Bantu speakers move into and through the equatorial rainforest, probably along rivers.',early:'One stream moves east along the northern edge of the forest. The other heads south toward the Atlantic coast.'}],
  [-1300,-600,{late:'South of the forest, an eastern branch splits off and heads toward the Great Lakes.',early:'The eastern stream nears the Great Lakes. The western stream settles the lower Congo and Angola.'}],
  [-600,0,{both:'Iron working spreads. The Urewe culture flourishes around Lake Victoria.'}],
  [0,350,{both:'A fast Early Iron Age spread carries farming communities down the east coast to southern Africa.'}],
  [350,650,{both:'Farmers reach KwaZulu-Natal. In the Congo rainforest, village populations collapse (400–600 CE).'}],
  [650,1000,{both:'Long contact with Khoe-San, forager and herder neighbours reshapes languages and genes.'}],
  [1000,1501,{both:'Bantu-speaking states and trading cities rise: Mapungubwe, Great Zimbabwe, Kilwa, Kongo.'}],
];
function phaseText(y){
  const ph=PHASES.find(p=>y>=p[0]&&y<p[1])||PHASES[PHASES.length-1];
  const o=ph[2]; if(o.both) return o.both;
  if(state.model==='both') return `<b>Late split:</b> ${o.late}<br><b>Early split:</b> ${o.early}`;
  return o[state.model];
}
const fmtYear=y=> y<0? `${Math.abs(Math.round(y/10)*10).toLocaleString()} BCE` : `${Math.max(1,Math.round(y/10)*10)} CE`;
const ago=y=> `≈ ${(Math.round((2025-y)/50)*50).toLocaleString()} years ago`;

let lastYear=T0;
function render(){
  const y=state.year;
  document.getElementById('yr').innerHTML=`c. ${fmtYear(y)}<small>${ago(y)}</small>`;
  document.getElementById('phase').innerHTML=phaseText(y);
  document.getElementById('slider').value=y;
  for(const {r,p,ghost} of routeEls){
    const d=partial(r.pts,y);
    p.setAttribute('d',d||'M0,0'); p.style.display=d?'':'none';
    ghost.style.display=state.layers.ghost?'':'none';
  }
  for(const s of DATA.sites){
    const g=siteEls[s.id];
    const fut=y<s.year;
    g.classList.toggle('future',fut);
    if(!fut && lastYear<s.year && state.playing){ g.classList.remove('pop'); void g.getBBox(); g.classList.add('pop'); }
    const dim = state.ev.size>0 && !s.ev.some(e=>state.ev.has(e));
    g.classList.toggle('dim',dim);
    g.classList.toggle('sel',state.sel===s.id);
    g.querySelector('.name').style.display = state.layers.labels ? '' : 'none';
  }
  gForest.style.display=state.layers.forest?'':'none';
  gSri.style.display=state.layers.forest?'':'none';
  gToday.style.display=state.layers.today?'':'none';
  gPeople.style.display=state.layers.peoples?'':'none';
  gRefs.style.display=state.layers.refs?'':'none';
  lastYear=y;
}

// timeline ticks & event dots
(function(){
  const ticks=document.getElementById('ticks'), dots=document.getElementById('evdots');
  const pos=y=>((y-T0)/(T1-T0)*100)+'%';
  for(let y=-3000;y<=1500;y+=500){const s=document.createElement('span');s.style.left=pos(y);if((y/500)%2) s.className='odd'; s.textContent=y<0?`${-y} BCE`:(y===0?'1 CE':`${y} CE`);ticks.appendChild(s);}
  for(const s of DATA.sites){
    const b=document.createElement('button');b.style.left=pos(s.year);b.style.background=s.homeland?css('--trunk'):css(EV[s.ev[0]][1]);
    b.title=`${s.name} (${s.when})`; b.setAttribute('aria-label',b.title);
    b.addEventListener('click',()=>{stop();state.year=s.year;selectSite(s.id,false);});
    dots.appendChild(b);
  }
})();

// play
let raf=null,lastT=null;
const playBtn=document.getElementById('play');
function tick(ts){
  if(!state.playing) return;
  if(lastT!=null){ state.year=Math.min(T1,state.year+(ts-lastT)/1000*100*state.speed); render(); }
  lastT=ts;
  if(state.year>=T1){stop();return;}
  raf=requestAnimationFrame(tick);
}
function play(){ if(state.year>=T1) state.year=T0; state.playing=true; lastT=null; playBtn.textContent='❚❚'; playBtn.setAttribute('aria-label','Pause'); raf=requestAnimationFrame(tick); }
function stop(){ state.playing=false; cancelAnimationFrame(raf); playBtn.textContent='▶'; playBtn.setAttribute('aria-label','Play'); }
playBtn.addEventListener('click',()=>state.playing?stop():play());
document.getElementById('speed').addEventListener('change',e=>state.speed=+e.target.value);
document.getElementById('slider').addEventListener('input',e=>{stop();state.year=+e.target.value;render();});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,button,[tabindex]')) return;
  if(e.code==='Space'){e.preventDefault();state.playing?stop():play();}
  if(e.key==='ArrowRight'){stop();state.year=Math.min(T1,state.year+100);render();}
  if(e.key==='ArrowLeft'){stop();state.year=Math.max(T0,state.year-100);render();}
});

// model toggle
document.querySelectorAll('#modelSeg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#modelSeg button').forEach(x=>x.classList.toggle('on',x===b));
  state.model=b.dataset.m; buildRoutes(); if(!state.sel) showOverview();
}));

// panel
const panel=document.getElementById('panel');
const MODEL_TEXT={
  late:`<p><b>Late split</b> is the view most linguistic and genetic studies now support. Bantu speakers moved <i>through</i> the equatorial rainforest first. Only after reaching its southern side did an eastern branch break away and head for the Great Lakes, then down the east coast to southern Africa.</p>`,
  early:`<p><b>Early split</b> is the older model, which some archaeologists still argue for. Bantu speakers divided early, near the homeland. An eastern stream skirted the <i>northern</i> edge of the rainforest to the Great Lakes, and a western stream went south along the Atlantic side.</p>`,
  both:`<p><b>Compare</b> shows both models together, with the late split as solid lines and the early split dashed. The key difference is how the eastern branch reached the Great Lakes: around the north of the forest, or through it and then east from its southern edge.</p>`
};
function layerBox(){
  const L=[['forest','Rainforest & Sangha corridor','var(--forest)'],['today','Bantu languages today (approx.)','#c99a7c'],['peoples','Peoples already there','#a88a62'],['ghost','Full route preview','#999'],['labels','Site labels','var(--ink)'],['refs','Rivers & lakes','#8fb0b8']];
  return `<div class="layers">${L.map(([k,t,c])=>`<label><input type="checkbox" data-layer="${k}" ${state.layers[k]?'checked':''}><span class="sw" style="background:${c};opacity:.75"></span>${t}</label>`).join('')}</div>`;
}
function evChips(){
  return `<div class="chips">${Object.entries(EV).map(([k,[t,c]])=>`<button class="chip ${state.ev.has(k)?'on':''}" data-ev="${k}" style="--c:var(${c})" aria-pressed="${state.ev.has(k)}">${t}</button>`).join('')}</div>`;
}
function routeLegend(){
  const row=(c,t,dash)=>`<div class="legend-row"><svg width="34" height="10"><line x1="2" y1="5" x2="30" y2="5" stroke="${c}" stroke-width="4" stroke-linecap="round" ${dash?'stroke-dasharray="6 5"':''}/></svg>${t}</div>`;
  return row('var(--trunk)','Shared early movement')+row('var(--west)','Western Bantu stream')+row('var(--east)','Eastern Bantu stream')+(state.model==='both'?row('#777','Early-split model (dashed)',true):'');
}
function wirePanel(){
  panel.querySelectorAll('[data-layer]').forEach(i=>i.addEventListener('change',()=>{state.layers[i.dataset.layer]=i.checked;try{localStorage.setItem('bantu-layers',JSON.stringify(state.layers));}catch(e){}render();}));
  panel.querySelectorAll('[data-ev]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.ev;state.ev.has(k)?state.ev.delete(k):state.ev.add(k);b.classList.toggle('on');b.setAttribute('aria-pressed',state.ev.has(k));render();}));
  const back=panel.querySelector('.back'); if(back) back.addEventListener('click',()=>{state.sel=null;render();showOverview();});
}
function showOverview(){
  panel.innerHTML=`
    <h2>About this map</h2>
    <p>Over roughly 4,000 years, speakers of Bantu languages spread from a small area on today's Cameroon–Nigeria border across most of central, eastern and southern Africa. Today more than 500 Bantu languages, among them Swahili, Zulu, Kikongo, Shona and Lingala, are spoken by hundreds of millions of people.</p>
    <p>Press <b>▶</b> or drag the timeline. Click any site for the evidence behind it.</p>
    <h3>Route model</h3>
    ${MODEL_TEXT[state.model]}
    ${routeLegend()}
    <h3>Filter by type of evidence</h3>
    ${evChips()}
    <p class="src" style="margin-top:8px">Each type answers a different question. Languages show relationships, archaeology shows dated material remains, genetics shows ancestry, and paleoclimate shows the changing landscape.</p>
    <h3>Layers</h3>
    ${layerBox()}
    <h3>Read the lines with care</h3>
    <p class="src">Each arrow summarises thousands of small, generational moves: a village relocating, people marrying into neighbouring communities, a language being adopted. None of them was a single march. Routes and dates are simplified from published reconstructions and remain debated. In some places languages spread mainly through people moving; in others, existing communities adopted them.</p>
    <details><summary>Sources</summary><ul>
      <li>de Filippo et al. 2012, <i>Proc. R. Soc. B</i>: <a href="https://doi.org/10.1098/rspb.2012.0318">linguistic + genetic test of the early- vs late-split models</a></li>
      <li>Grollemund et al. 2015, <i>PNAS</i>: Bantu language phylogeny and expansion routes</li>
      <li>Patin et al. 2017, <i>Science</i>: genomic evidence on Bantu dispersals</li>
      <li>Lipson et al. 2020, <i>Nature</i>: <a href="https://doi.org/10.1038/s41586-020-1929-1">ancient DNA from Shum Laka</a></li>
      <li>Semo et al. 2020, <i>Mol. Biol. Evol.</i>: genomic variation in Mozambique</li>
      <li>Seidensticker et al. 2021, <i>Science Advances</i>: <a href="https://doi.org/10.1126/sciadv.abd8352">population collapse in the Congo rainforest from 400 CE</a></li>
      <li>Koile et al. 2022, <i>PNAS</i>: <a href="https://doi.org/10.1073/pnas.2112853119">phylogeography supports a rainforest route</a></li>
    </ul></details>`;
  wirePanel();
}
function selectSite(id,jump){
  const s=DATA.sites.find(x=>x.id===id); state.sel=id;
  if(jump && state.year<s.year){ stop(); state.year=s.year; }
  render();
  panel.innerHTML=`
    <button class="back">← Overview</button>
    <h2>${s.name}</h2>
    <div class="place">${s.place}</div>
    <div class="when">${s.when}</div>
    <div class="tags">${s.ev.map(e=>`<span class="tag" style="background:var(${EV[e][1]})">${EV[e][0]}</span>`).join('')}</div>
    <p>${s.text}</p>
    ${s.note?`<p class="note">${s.note}</p>`:''}
    ${s.src?`<p class="src">Source: ${s.src}</p>`:''}
    <h3>Filter by type of evidence</h3>${evChips()}
    <h3>Layers</h3>${layerBox()}`;
  wirePanel();
  panel.scrollTop=0;
  if(window.innerWidth<=900) panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function showPeople(p){
  state.sel=null; render();
  panel.innerHTML=`<button class="back">← Overview</button><h2>${p.name}</h2><div class="place">${p.sub}</div><p>${p.text}</p><h3>Layers</h3>${layerBox()}`;

}
