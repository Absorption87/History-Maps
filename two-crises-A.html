EV:{A:[[2,'Rebate checks law','Congress passes the Economic Stimulus Act (February 2008); checks of $300–$600 per adult go out from May.'],[3,'Bear Stearns rescued','The Federal Reserve helps JPMorgan Chase buy the failing investment bank (March 2008).'],[9,'Lehman fails','The government takes over Fannie Mae and Freddie Mac (Sept. 7); Lehman Brothers goes bankrupt (Sept. 15); the government rescues the insurer AIG (Sept. 16).'],[10,'Bank rescue (TARP) passes','The House first rejects it (Sept. 29), then Congress passes the $700 billion Troubled Asset Relief Program on October 3, 2008.'],[12,'Interest rates cut to zero','The Federal Reserve cuts its key interest rate to nearly zero (Dec. 16, 2008).'],[14,'Recovery Act signed','President Obama signs the $787 billion stimulus (Feb. 17, 2009). Two days later, a TV commentator’s rant against mortgage aid helps spark the Tea Party movement.'],[15,'Mortgage relief plan; stocks hit bottom','The Home Affordable Modification Program (HAMP) launches, and stock prices hit their low on March 9, 2009.'],[18,'Recession officially ends','Economists later date the end of the recession to June 2009, but unemployment keeps rising.'],[22,'Unemployment peaks at 10%','October 2009.'],[31,'Dodd-Frank Act','A major law adds new rules for banks and creates the Consumer Financial Protection Bureau (July 2010).'],[33,'Foreclosures peak','About 120,000 homes are foreclosed in September 2010 alone.'],[45,'Occupy Wall Street','Protesters camp in New York’s financial district from September 17, 2011, under the slogan “We are the 99%.”'],[77,'All jobs regained','May 2014: the U.S. finally has as many jobs as in December 2007, 77 months later.']],
 B:[[1,'Shutdowns and rescue','A national emergency is declared (Mar. 13, 2020); the Federal Reserve cuts rates to nearly zero (Mar. 15) and promises unlimited bond buying (Mar. 23); Congress passes the $2.2 trillion CARES Act (Mar. 27).'],[2,'Unemployment hits 14.8%','April 2020, the highest since record-keeping began in 1948. Economists later date the end of the recession to this month.'],[5,'Extra $600 ends','The $600 weekly unemployment supplement expires at the end of July 2020.'],[7,'Eviction ban','The CDC orders a nationwide halt to evictions of renters who can’t pay (Sept. 4, 2020).'],[10,'Second relief law','$900 billion (December 2020): $600 checks and $300 a week in extra unemployment benefits.'],[13,'American Rescue Plan','$1.9 trillion (Mar. 11, 2021): $1,400 checks, extended unemployment aid, and a larger child tax credit.'],[17,'Monthly child payments begin','The expanded child tax credit is paid monthly from July to December 2021.'],[18,'Eviction ban ends','The Supreme Court blocks the CDC’s eviction moratorium (Aug. 26, 2021).'],[19,'Federal jobless aid ends','Pandemic unemployment programs expire in early September 2021; 26 states had already ended some of them earlier.'],[25,'Fed starts raising rates','The Federal Reserve begins raising interest rates to fight inflation (March 2022).'],[28,'Inflation peaks; jobs regained','June 2022: prices are about 9% higher than a year earlier, and the U.S. has regained all the jobs lost in 2020, 28 months later.'],[43,'Child poverty doubles','The Census Bureau reports that child poverty, counting government aid, rose from 5.2% in 2021 to 12.4% in 2022 after the expanded child tax credit ended.']]},
PEOPLE:[
 {id:'worker',label:'A worker who lost a job',a:['Job losses spread from construction and factories to almost every industry. Openings were scarce, so job searches dragged on: by 2010, about 45% of unemployed people had been looking for more than six months.','[[ui|Unemployment benefits]] were extended, up to 99 weeks in the hardest-hit states, and the 2009 stimulus added $25 a week.','Unemployment stayed above 8% for more than three years (February 2009 to August 2012).'],b:['Restaurants, hotels, stores and gyms closed almost overnight. Most losses were in in-person service jobs, many of them low-paid, and many layoffs were expected to be temporary.','An extra $600 a week (April–July 2020), later $300, on top of state benefits. [[gig|Gig workers]] and the self-employed qualified for the first time. Overwhelmed state offices meant long delays for some.','Unemployment fell to 3.9% by December 2021, though many people who were still jobless in 2021 had been out of work a long time.']},
 {id:'owner',label:'A homeowner',a:['Home prices fell about 26% from their early-2007 peak to early 2012. Millions owed more than their homes were worth, and about 7.8 million homes were lost to [[foreclosure]] from 2007 to 2016.','HAMP and other programs lowered payments for some borrowers but reached far fewer than the 3–4 million homeowners first promised. Low mortgage rates helped those who could refinance.','Many families lost the home equity that was their main savings: the typical family’s [[networth|net worth]] fell 39% from 2007 to 2010.'],b:['Some owners lost income, but home prices kept rising.','Owners with federally backed mortgages could pause payments ([[forbearance]]), and foreclosures were halted. Mortgage rates fell to record lows in 2020–21.','Home prices rose about 41% from February 2020 to mid-2022, and the typical family’s net worth rose 37% from 2019 to 2022. But higher prices, and later higher mortgage rates, made buying a first home much harder.']},
 {id:'renter',label:'A renter',a:['Many families who lost homes to foreclosure became renters. Renters who lost jobs had little federal protection from [[eviction]].','Mostly general help: unemployment benefits and larger food aid (SNAP). A small federal program helped prevent homelessness.','Rents kept rising during the slow recovery.'],b:['Renters were more likely than homeowners to work in hard-hit service jobs.','A federal eviction ban for tenants who couldn’t pay (September 2020 to August 2021) and tens of billions of dollars in emergency rental aid, though the money was slow to reach many tenants.','Rents rose sharply in 2021–22 as aid ended.']},
 {id:'biz',label:'A small-business owner',a:['Customers disappeared and banks cut back on lending, so many small firms couldn’t borrow to get through the slump.','Expanded loan guarantees and tax breaks; no broad cash program for small businesses.','Many firms closed; credit for small businesses stayed tight for years.'],b:['Shutdown orders closed many businesses outright for weeks or months.','The [[ppp|Paycheck Protection Program]]: about $800 billion in loans that were forgiven if the business kept paying workers. About 93% of small businesses received at least one loan.','Researchers estimate it saved 2–3 million job-years, at a cost of $170,000–$257,000 per job-year, with most of the money going to owners and shareholders rather than to workers who would otherwise have lost jobs. Fraud was also a problem.']},
 {id:'family',label:'A family with children',a:['Parents lost jobs and income; the official poverty rate rose from 12.5% in 2007 to 15.1% in 2010.','Larger food aid (SNAP), bigger refundable tax credits for working families, and the “Making Work Pay” credit (up to $400 a worker in 2009–10).','Poverty, even counting government aid, stayed around 16% through 2012.'],b:['Schools and child care closed, and many parents had to cut back work.','Three rounds of checks, including money for each child, and in 2021 a larger [[ctc|child tax credit]] paid monthly: up to $300 a month for each child under 6.','Child poverty, counting aid ([[spm]]), fell to a record low of 5.2% in 2021, then more than doubled to 12.4% in 2022 after the expanded credit ended.']},
 {id:'retiree',label:'A retiree or saver',a:['Stock prices fell by more than half from late 2007 to early 2009, shrinking retirement accounts.','The bank rescue and Federal Reserve actions aimed to stop the collapse; stocks began recovering in March 2009. [[interest|Interest]] on savings stayed near zero for years.','People who held on saw stocks fully recover by 2013; those forced to sell near the bottom did not.'],b:['Stocks fell about a third in a few weeks in early 2020, then recovered within months.','The Fed’s fast action steadied markets. Social Security kept arriving, and retirees also received stimulus checks.','[[inflation|Inflation]] in 2021–22 squeezed fixed incomes, though Social Security payments rose 5.9% in 2022 and 8.7% in 2023 to keep up.']},
 {id:'tax',label:'Taxpayers and future generations',a:['Tax revenue fell while spending on aid rose.','The bank rescue’s final net cost was about $31 billion (CBO); the 2009 stimulus added about $831 billion to deficits over ten years.','[[debt|Federal debt]] rose from about 62% of the economy in 2007 to about 100% in 2012.'],b:['Tax revenue dropped briefly while relief spending soared.','More than $5 trillion in relief in 2020–21, mostly borrowed. Government auditors estimate $100–135 billion in unemployment benefits went to fraud.','Debt jumped from about 107% of the economy to 133% in mid-2020, then settled near 120%. Higher interest rates since 2022 have made that debt more expensive to carry.']},
 {id:'bank',label:'Banks and Wall Street',a:['Big banks and investment firms that had bet heavily on mortgages faced collapse; Lehman Brothers failed in September 2008.','Bank rescue ([[tarp]]) investments, emergency Federal Reserve loans and 2009 “stress tests.” Most TARP money was repaid.','Banks recovered faster than many households. The Dodd-Frank Act (2010) added new rules, and anger at “[[bailout|bailouts]]” fed both the Tea Party and Occupy Wall Street.'],b:['Banks entered 2020 with more capital, partly because of rules adopted after 2008, and did not cause this crisis.','The Fed cut rates to zero, bought trillions of dollars in bonds, and backstopped markets so companies could keep borrowing.','Markets recovered quickly, which raised the wealth of people who owned stocks and homes more than those who didn’t.']}],
TOOL:[['What caused it','Risky mortgage lending and a housing bubble; banks heavily exposed to mortgage investments','A pandemic, and the shutdowns and fear that came with it'],['How fast help came','Rebate-check law: month 2 (February 2008). Bank rescue: month 10 (October 2008). Main [[stimulus]]: month 14 (February 2009).','Main relief law (CARES Act): month 1 (March 27, 2020). More laws in April 2020, December 2020 and March 2021.'],['How big','2008 rebates (about $150 billion), the bank rescue ($700 billion allowed, about $444 billion used, final net cost about $31 billion) and the 2009 stimulus ($787 billion, later estimated at $831 billion)','More than $5 trillion across five relief laws in 2020–21, about a quarter of the size of the whole economy in one year'],['[[fed|Federal Reserve]] ([[monetary|monetary policy]])','Cut rates to nearly zero (December 2008); bought trillions in bonds over several years; emergency loans to banks and markets','Cut rates to nearly zero within weeks (March 2020); unlimited bond buying; new lending programs for businesses and local governments'],['Cash for households ([[fiscal|fiscal policy]])','2008: $300–$600 per adult plus $300 per child. 2009–10: “Making Work Pay” credit, up to $400 per worker','Three rounds of checks, $1,200, $600 and $1,400 per adult, plus money for children (less for higher earners)'],['Unemployment benefits','More weeks of benefits (up to 99 in the hardest-hit states); $25 a week extra in 2009','$600 a week extra (April–July 2020), then $300 (2021); gig workers and self-employed covered; ended September 2021'],['Homes and rent','HAMP mortgage modifications (goal: 3–4 million homeowners; fell well short)','Mortgage payment pauses, a foreclosure halt, a CDC eviction ban (September 2020 to August 2021) and emergency rental aid'],['Small businesses','Loan guarantees and tax breaks','Paycheck Protection Program: about $800 billion in mostly forgiven loans'],['Families with children','Larger refundable tax credits and food aid','2021 child tax credit of up to $3,600 per young child, paid monthly from July to December'],['Banks','TARP investments, stress tests and Fed emergency loans, then Dodd-Frank reforms (2010)','Fed backstops for markets; banks were stronger going in']],
SRC:{
 fcic:{k:'A',M:37,date:'January 2011',title:'Conclusions of the Financial Crisis Inquiry Commission',who:'A panel created by Congress to investigate the causes of the crisis',type:'Official government report (some members dissented)',aud:'Congress, the President and the public',q:'<blockquote data-r>“We conclude this financial crisis was avoidable. The crisis was the result of human action and inaction, not of Mother Nature or computer models gone haywire.”</blockquote><p data-r>The commission blamed failures in financial regulation, risky borrowing and investing by big firms, and poor risk management. Several commissioners disagreed with parts of the report and wrote dissents.</p>',plain:'A panel set up by Congress concluded that people, not bad luck, caused the crisis, especially weak regulation and risky decisions by big financial firms.',ask:'Why might it matter whether a crisis was “avoidable”? Who would want it to be seen one way or the other?',url:'https://fcic.law.stanford.edu/report/conclusions'},
 bush2008:{k:'A',M:9,date:'September 24, 2008',title:'Address to the nation on the economy',who:'President George W. Bush',type:'Televised speech asking Congress to pass a $700 billion rescue',aud:'Americans and members of Congress, many of them skeptical',q:'<blockquote data-r>“Financial assets related to home mortgages have lost value during the housing decline, and the banks holding these assets have restricted credit. As a result, our entire economy is in danger.”</blockquote><blockquote data-r>“This rescue effort is not aimed at preserving any individual company or industry; it is aimed at preserving America’s overall economy.”</blockquote>',plain:'The President told the public that banks’ losses on home loans were threatening the whole economy and asked Congress to approve a rescue.',ask:'Bush needed votes from his own skeptical party. How does he try to persuade people who dislike “bailouts”?',url:'https://www.presidency.ucsb.edu/documents/address-the-nation-the-national-economy'},
 obama2009:{k:'A',M:14,date:'February 17, 2009',title:'Signing the American Recovery and Reinvestment Act',who:'President Barack Obama',type:'Remarks at the bill signing in Denver',aud:'Americans, and supporters gathered for the signing',q:'<p data-r>Obama called the law “the most sweeping economic recovery package in our history.” He warned it was not a cure-all:</p><blockquote data-r>“Today does mark the beginning of the end: the beginning of what we need to do to create jobs for Americans scrambling in the wake of layoffs.”</blockquote>',plain:'The President said the new [[stimulus]] law was the biggest recovery plan in U.S. history, but only a first step.',ask:'Obama says this is only a “beginning.” Why would a president lower expectations on the day he signs his biggest bill?',url:'https://www.presidency.ucsb.edu/documents/remarks-signing-the-american-recovery-and-reinvestment-act-2009-denver-colorado'},
 santelli:{k:'A',M:14,date:'February 19, 2009',title:'The “Chicago Tea Party” rant',who:'Rick Santelli, a CNBC business reporter, speaking from a Chicago trading floor',type:'Live TV commentary (under copyright; quoted briefly)',aud:'CNBC viewers and the traders around him',q:'<p data-r>Reacting to the new plan to help struggling homeowners, Santelli said the government was rewarding bad behavior and called for a “Chicago Tea Party.” He asked the traders:</p><blockquote data-r>“How many of you people want to pay for your neighbor’s mortgage…?”</blockquote><p data-r>The clip spread widely and helped launch the Tea Party movement.</p>',plain:'A TV reporter angrily argued that people who pay their bills should not have to help neighbors who can’t pay their [[mortgage|mortgages]].',ask:'Santelli was speaking to traders, not homeowners in trouble. How might his audience shape his view of who “deserves” help?',url:'https://www.cnbc.com/2009/02/22/rick-santellis-shout-heard-round-the-world.html'},
 sigtarp:{k:'A',M:27,date:'March 25, 2010',title:'Report on the Home Affordable Modification Program',who:'Neil Barofsky’s office, the Special Inspector General for the bank rescue (SIGTARP)',type:'Government watchdog audit',aud:'Congress and the Treasury Department',q:'<p data-r>The Treasury had promised HAMP would help 3 to 4 million homeowners avoid foreclosure, but counted offers of short trial plans as success. The watchdog objected:</p><blockquote data-r>“Measuring trial modification offers, or even actual trial modifications, for that matter, is simply not particularly meaningful.”</blockquote>',plain:'A government watchdog said the housing-help program was judging its success by the wrong numbers.',ask:'Why does it matter how a government program measures success? What should HAMP have counted?',url:'https://fraser.stlouisfed.org/title/factors-affecting-implementation-home-affordable-modification-program-5106/fulltext'},
 powell2020:{k:'B',M:3,date:'May 13, 2020',title:'“Current Economic Issues”',who:'Jerome Powell, Chair of the Federal Reserve',type:'Speech to the Peterson Institute for International Economics',aud:'Economists, markets and, indirectly, Congress',q:'<blockquote data-r>“Additional fiscal support could be costly, but worth it if it helps avoid long-term economic damage and leaves us with a stronger recovery. This tradeoff is one for our elected representatives, who wield powers of taxation and spending.”</blockquote>',plain:'The head of the [[fed|Federal Reserve]] said more government spending might cost a lot but could prevent worse, longer damage, and that Congress should decide.',ask:'The Fed doesn’t control taxes or spending. Why might its chair still urge Congress to spend more?',url:'https://www.federalreserve.gov/newsevents/speech/powell20200513a.htm'},
 cdc2020:{k:'B',M:7,date:'First issued September 4, 2020',title:'Temporary halt in residential evictions',who:'The Centers for Disease Control and Prevention (CDC)',type:'Federal public-health order (wording from the August 2021 version)',aud:'Landlords, tenants and courts',q:'<blockquote data-r>“…a landlord, owner of a residential property, or other person with a legal right to pursue eviction or possessory action, shall not evict any covered person…”</blockquote><p data-r>Tenants had to declare that they couldn’t pay because of lost income and would be left homeless or crowded into shared housing. Rent was still owed. The Supreme Court ended the ban on August 26, 2021, ruling that the CDC lacked the authority.</p>',plain:'The CDC ordered landlords not to evict tenants who couldn’t pay because of the pandemic. Tenants still owed the rent.',ask:'Why did a public-health agency issue a housing rule? Whose interests does the order balance?',url:'https://www.federalregister.gov/documents/2020/09/04/2020-19654/temporary-halt-in-residential-evictions-to-prevent-the-further-spread-of-covid-19'},
 summers2021:{k:'B',M:12,date:'February 4, 2021',title:'Warning about the size of the relief plan',who:'Lawrence Summers, a Treasury Secretary under Bill Clinton and economic adviser to Barack Obama',type:'Opinion column in The Washington Post (under copyright; quoted briefly)',aud:'Policymakers and readers, while Congress debated the $1.9 trillion plan',q:'<p data-r>Summers praised the plan’s goals but argued it was much larger than the gap it was meant to fill. He warned there was a chance it would set off</p><blockquote data-r>“inflationary pressures of a kind we have not seen in a generation.”</blockquote><p data-r>Many economists disagreed at the time. Inflation reached about 9% in June 2022.</p>',plain:'A well-known economist warned that the 2021 relief plan was so large it could cause high [[inflation]].',ask:'Summers was a Democrat criticizing a Democratic plan. Does that make his warning more or less believable? Why?',url:'https://www.hks.harvard.edu/centers/mrcbg/programs/growthpolicy/inflation-we-can-learn-mistakes-past-or-repeat-them-lawrence'},
 census2022:{k:'B',M:31,date:'September 2022 and September 2023',title:'Child poverty reports',who:'U.S. Census Bureau',type:'Official statistical reports',aud:'The public, researchers and lawmakers',q:'<blockquote data-r>“Child poverty, calculated by the Supplemental Poverty Measure (SPM), fell to its lowest recorded level in 2021, declining 46% from 9.7% in 2020 to 5.2% in 2021.”</blockquote><p data-r>A year later the Bureau reported that the same measure for all people rose to 12.4% in 2022 from 7.8% in 2021, “when pandemic relief ended,” and child poverty rose to 12.4%.</p>',plain:'Child poverty fell to a record low in 2021 when aid was high, then more than doubled in 2022 after aid ended.',ask:'This measure counts government aid as income. Why does the choice of measure change the story? Which measure would you use, and why?',url:'https://www.census.gov/library/stories/2022/09/record-drop-in-child-poverty.html'},
 autor2022:{k:'B',M:23,date:'2022',title:'Where did the PPP money go?',who:'Economist David Autor and coauthors, including Federal Reserve researchers',type:'Peer-reviewed research article (under copyright; summarized)',aud:'Economists and policymakers',q:'<p data-r><i>Summary:</i> The Paycheck Protection Program reached about 93% of small businesses in roughly two months. The authors estimate it saved 2–3 million job-years at $170,000–$257,000 per job-year, and that only about a quarter to a third of the money went to workers who would otherwise have lost jobs. They conclude the program was fast but costly because it was, in their words,</p><blockquote data-r>“essentially untargeted.”</blockquote>',plain:'Researchers found the [[ppp|PPP]] saved jobs quickly but was very expensive per job, and most of its money went to business owners.',ask:'The authors praise the program’s speed and criticize its targeting. Can a program be both fast and well-targeted? What would it need?',url:'https://www.aeaweb.org/doi/10.1257/jep.36.2.55'},
 gao2023:{k:'B',M:43,date:'September 12, 2023',title:'Fraud in pandemic unemployment insurance',who:'U.S. Government Accountability Office (GAO), Congress’s auditors',type:'Audit report',aud:'Congress',q:'<blockquote data-r>“…the amount of fraud in unemployment insurance (UI) programs during the COVID-19 pandemic was likely between $100 billion and $135 billion.”</blockquote><p data-r>That is roughly 11–15% of benefits paid. The Labor Department said the estimate was too high.</p>',plain:'Government auditors estimated that 11–15% of pandemic [[ui|unemployment benefits]] went to fraud.',ask:'How should we weigh fraud against the speed of getting money to people who needed it?',url:'https://www.gao.gov/products/gao-23-106696'},
 scf2023:{k:'B',M:44,date:'October 2023',title:'Changes in U.S. family finances, 2019 to 2022',who:'Federal Reserve Board, Survey of Consumer Finances',type:'Official survey report',aud:'The public and researchers',q:'<blockquote data-r>“…the 2019–22 growth in median net worth was the largest three-year increase over the history of the modern SCF, more than double the next-largest one on record.”</blockquote><p data-r>The typical family’s net worth rose 37% after inflation. Between the 2007 and 2010 surveys it had fallen about 39%.</p>',plain:'The typical family’s [[networth|net worth]] grew faster from 2019 to 2022 than in any three-year period the Fed has measured.',ask:'Net worth rose partly because home and stock prices rose. Who gains most when those prices rise, and who might be left out?',url:'https://www.federalreserve.gov/publications/October-2023-Changes-in-US-Family-Finances-from-2019-to-2022.htm'}},
DEB:{
 bailouts:{q:'Were the 2008 bank rescues the right call?',v:[['Yes: they prevented something worse','Letting the financial system collapse would have caused a far deeper slump. Most of the money was repaid; the CBO put the final net cost of the bank rescue ([[tarp]]) at about $31 billion.','e.g., Ben Bernanke, The Courage to Act (2015); Timothy Geithner, Stress Test (2014)'],['No, or not the way it was done','The rescue protected the firms that caused the crisis while homeowners got far less help. That encourages future risk-taking ([[moral]]) and deepened distrust of government.','e.g., Neil Barofsky, Bailout (2012); Atif Mian and Amir Sufi, House of Debt (2014)']],ev:'Compare what happened to banks and to homeowners after 2008. No one can know what would have happened without the rescue, so what evidence would help you decide?'},
 stim09:{q:'Was the 2009 stimulus too small, or did it do little good?',v:[['Too small','It helped, but the economy had lost far more spending than $787 billion could replace, so the recovery was slow. The Congressional Budget Office estimated it raised employment by 1.4 to 3.6 million at its peak in 2010.','e.g., Christina Romer (chair of Obama’s Council of Economic Advisers); Paul Krugman'],['It did little lasting good','Much of the money was saved or used by states to avoid borrowing, so it gave a smaller boost than promised while adding to the debt.','e.g., John Cogan and John Taylor (2012)']],ev:'Compare the income and jobs charts after 2009 and after 2020. Does the bigger 2020 response settle this debate? Why or why not?'},
 inflation:{q:'Did COVID relief cause the 2021–22 inflation?',v:[['A large part','So much money reached households so quickly that demand outran what the economy could produce. A San Francisco Fed study estimated U.S. relief added about 3 percentage points to inflation by the end of 2021.','e.g., Lawrence Summers; Jason Furman; San Francisco Fed (2022)'],['Mostly other causes','Prices rose around the world, driven by supply-chain snarls, shifts in what people bought, and energy and food shocks after Russia invaded Ukraine in 2022. Estimates of relief spending’s role vary widely.','e.g., Ben Bernanke and Olivier Blanchard (2023)']],ev:'If relief caused inflation, U.S. inflation should have risen more than in countries that spent less. What else would you want to compare?'},
 ui:{q:'Did extra unemployment benefits keep people from working?',v:[['Somewhat','When about half the states ended extra benefits early in mid-2021, more unemployed people in those states moved into jobs, one study found.','e.g., Harry Holzer, Glenn Hubbard and Michael Strain (2021)'],['Only a little','Another study using bank data found that ending benefits early raised employment only slightly, while spending by people who lost benefits fell sharply.','e.g., Kyle Coombs, Arindrajit Dube and coauthors (2021–22)']],ev:'What does “keeping people from working” mean during a pandemic, when some jobs carried health risks and schools and child care were closed?'},
 ppp:{q:'Was the Paycheck Protection Program worth it?',v:[['Yes: speed mattered','In about two months it reached almost every small business and kept millions of people on payrolls at the worst moment of the crisis.','A view held by many small-business groups and the program’s supporters in both parties'],['Too costly and poorly aimed','Each year of a job saved cost $170,000–$257,000, most of the money went to owners and shareholders, and fraud was common.','e.g., David Autor and coauthors (2022)']],ev:'Was there a faster way to get money to the businesses and workers who needed it most? What would the government have needed in place beforehand?'},
 debt:{q:'Is the debt from these rescues a serious problem?',v:[['Yes','More debt means more of the budget goes to interest, especially now that rates are higher, leaving less for other priorities and the next emergency.','e.g., Committee for a Responsible Federal Budget; CBO long-term budget outlooks'],['Worth it in an emergency','Borrowing in a crisis prevents deeper, longer damage that would also shrink tax revenue. What matters most is long-run growth and interest costs, not the debt total alone.','e.g., Jason Furman and Lawrence Summers (2019)']],ev:'Look at the debt chart. Should the government borrow differently in emergencies than in normal times? Who decides what counts as an emergency?'}},
STOPS:[
 {M:0,t:'Two very different shocks',focus:['jobs'],min:6,skill:'Using data and sources to compare causes',std:'HSS-PoE.12.5.2; Analysis HI 1; RH.11–12.1, RH.11–12.7',c:'<b>The 2008 crisis</b> (starting December 2007): years of easy [[mortgage]] lending pushed home prices up. When prices fell, millions of borrowers fell behind, and banks holding mortgage investments faced huge losses. <b>The 2020 crisis</b> (starting February 2020): a new virus spread worldwide. To slow it, governments and businesses closed workplaces, schools and stores, and many people stayed home.',p:'Which crisis do you think will destroy more jobs in its first few months? Which will take longer to recover from? Explain your thinking.',r:'From December 2007 to February 2010, the U.S. lost about 8.7 million jobs over two years. In March and April 2020 alone, it lost about 21.9 million. Press play on the timeline to watch the jobs chart, then keep going: the slow-burning 2008 crisis took far longer to undo.',s:['fcic'],d:null,e:'Using the commission’s conclusion and the jobs chart, explain how the causes of the two crises differed, and why that might matter for how the government should respond.',person:null,deep:'Economists distinguish demand shocks from supply shocks. Classify each crisis, and explain why the right policy response might depend on the type of shock.'},
 {M:10,t:'Panic and rescue',focus:['jobs','ur'],min:8,skill:'Evaluating an argument; the tools of monetary policy',std:'HSS-PoE.12.3.4, 12.3.2; Analysis HR 1; RH.11–12.6, RH.11–12.8',c:'In September 2008 (month 9), the investment bank Lehman Brothers collapsed and the giant insurer AIG nearly did. Banks stopped trusting each other and cut lending, even to healthy businesses. President Bush asked Congress for $700 billion to stabilize the financial system. Compare the timing: in 2020, the [[fed|Federal Reserve]] and Congress acted within weeks of the first shutdowns (month 1).',p:'If banks stop lending, who besides bankers gets hurt? Should taxpayers rescue banks that made risky bets?',r:'The House first voted the rescue down on September 29, 2008, and stock prices plunged; Congress then passed it on October 3. The government put about $444 billion into banks, automakers, AIG and housing programs. Most was repaid, and the CBO’s final estimate of the net cost was about $31 billion. In March 2020, the Fed cut [[interest|interest rates]] to nearly zero and promised to buy as many bonds as needed, and Congress passed the $2.2 trillion CARES Act on March 27.',s:['bush2008'],d:'bailouts',e:'What reasons does Bush give for the rescue, and who does he say it will help? Do you find his argument convincing? Why or why not?',person:'bank',deep:'Walter Bagehot’s classic rule says a central bank in a panic should lend freely, at a penalty rate, to sound firms with good collateral. Did the 2008 and 2020 responses follow that rule? Where did they depart from it, and why?'},
 {M:14,t:'Money for households',focus:['inc'],min:8,skill:'Comparing viewpoints; fiscal policy; real versus nominal data',std:'HSS-PoE.12.3.3, 12.5.1; RH.11–12.6, RH.11–12.7',c:'In February 2009 (month 14), Congress passed the $787 billion American Recovery and Reinvestment Act ([[stimulus]]): tax cuts, aid to states, longer unemployment benefits, food aid, and spending on roads, energy and research. In 2020–21, Congress passed five relief laws worth more than $5 trillion, including three rounds of checks ($1,200, $600 and $1,400 per adult), extra weekly unemployment benefits, and a bigger [[ctc|child tax credit]].',p:'Is it better to send money straight to people, or to spend it on projects and programs? What are the trade-offs of each?',r:'Look at the income chart, which is [[real|adjusted for inflation]]. After 2008, Americans’ total after-tax income barely grew: it was only about 1% higher than at the start in early 2009 and 1.3% higher two years in. In 2020–21 it jumped above its pre-crisis level, spiking each time checks went out: 13% above February 2020 in April 2020, and 29% above in March 2021. The CBO estimated the 2009 law raised employment by 1.4 to 3.6 million at its peak in 2010.',s:['obama2009','powell2020'],d:'stim09',e:'Both leaders argued for more government spending. What risks does each one admit, and what did they expect the money to do?',person:'family',deep:'Compare the makeup of the two packages (cash transfers, tax cuts, government purchases, aid to states). Which parts would you expect to have the largest “multiplier” effect on spending, and why?'},
 {M:15,t:'Keeping a roof overhead',focus:['del','hp'],min:8,warn:'This stop discusses losing a home and eviction, which may be close to home for some readers.',skill:'Weighing competing values in a policy debate',std:'HSS-11.11; HSS-PoE.12.3.2; Analysis HR 1; RH.11–12.6',c:'In 2008, falling home prices left millions of families owing more than their homes were worth, and many couldn’t keep up with payments. In February 2009 the Obama administration announced a plan to lower payments for struggling homeowners. In 2020, Congress let most homeowners with federally backed mortgages pause payments ([[forbearance]]), and the CDC banned most [[eviction|evictions]] of renters who couldn’t pay.',p:'Should the government help people who can’t pay their mortgage or rent? What would be fair to neighbors who are still paying?',r:'About 7.8 million homes were lost to [[foreclosure]] from 2007 to 2016. The main relief program, HAMP, aimed to help 3 to 4 million homeowners and fell well short. In 2020, late mortgage payments barely rose (see the chart), home prices climbed, and foreclosures nearly stopped. The eviction ban lasted until the Supreme Court ended it in August 2021.',s:['santelli','sigtarp','cdc2020'],d:null,e:'Santelli and the CDC order take very different positions on helping people who can’t pay. Explain each in your own words. Which do you think is fairer, and why?',person:'owner',deep:'Mortgage modifications needed lenders and loan servicers to cooperate; the eviction ban needed no one’s cooperation but shifted losses to landlords. How does the design of a policy decide who bears its cost?'},
 {M:24,t:'Who lost the most?',focus:['ur','ltu'],toggle:true,min:6,skill:'Reading charts for patterns and unequal effects',std:'HSS-PoE.12.5.2; HSS-11.11; Analysis HI 2; RH.11–12.7',c:'[[unemployment|Unemployment]] rose in both crises, but not equally for everyone. On the unemployment chart, switch between all workers and Black workers. Then compare the long-term unemployment chart.',p:'Which groups of workers do you predict were hit hardest in each crisis? Why?',r:'In 2008–10, losses hit construction and manufacturing hard, and many people stayed jobless for months: by 2010, about 45% of unemployed people had been looking for more than six months ([[ltu]]). In 2020, losses were concentrated in in-person service jobs such as restaurants, hotels and stores, which employ many low-wage workers, women and young people. In both crises, unemployment for Black workers peaked near 17%, well above the overall rate.',s:[],d:'ui',e:'Describe one pattern you see in the charts. Which crisis would have been harder for a worker who lost a job, and why?',person:'worker',deep:'The unemployment rate can fall because people find jobs or because they stop looking. What other measure would you check to tell the difference, and what might it show for these two recoveries?'},
 {M:28,t:'How fast did people recover?',focus:['jobs','inc'],min:8,skill:'Choosing and using indicators to judge outcomes',std:'HSS-11.11.6; Analysis HI 6; RH.11–12.7, RH.11–12.9',c:'Recovery can be measured in different ways: jobs, income, poverty and wealth. Here, month 28 is June 2022 for the 2020 crisis and April 2010 for the 2008 crisis.',p:'Based on the size and speed of each response, which recovery do you predict was faster? Which measure would you use to decide?',r:'<b>Jobs:</b> the U.S. regained all the jobs lost in 2020 by June 2022, 28 months after the crisis began. After 2008 it took 77 months, until May 2014. <b>Poverty:</b> under the Census Bureau’s broader measure ([[spm]]), which counts government aid, poverty rose from 15.3% in 2009 to 16.1% in 2011, but in 2020–21 it fell to record lows (9.1% and 7.8%) before jumping to 12.4% in 2022 when aid expired. <b>Wealth:</b> the typical family’s [[networth|net worth]] fell about 39% from 2007 to 2010, and rose 37% from 2019 to 2022, after inflation.',s:['census2022','scf2023'],d:'debt',e:'Which measure best shows how regular people fared? Support your answer with one source and one chart.',person:'family',deep:'Wealth rose in 2019–22 partly because home and stock prices rose. Is a rising [[median]] net worth good evidence that policy helped “regular people”? What would a look at different groups add?'},
 {M:29,t:'The costs',focus:['inf','debt'],min:8,skill:'Weighing costs and benefits; evaluating competing explanations',std:'HSS-PoE.12.3.2, 12.3.3; Analysis HR 3; RH.11–12.3, RH.11–12.8',c:'Every response has costs. After 2008, help reached people slowly, the recovery was weak for years, and many felt that banks were rescued while families were not; the Tea Party (2009) and Occupy Wall Street (2011) grew partly from that anger. After 2020, prices rose at the fastest pace in about 40 years ([[inflation]]), [[debt|federal debt]] jumped, and fraud drained some programs.',p:'Is it worse for regular people when the government does too much, or too little? Which mistake would you rather risk, and why?',r:'Inflation peaked at about 9% in June 2022. The Federal Reserve raised interest rates quickly from March 2022, and inflation fell to about 3% by June 2023 without a recession. Federal debt rose from about 62% of the economy (2007) to about 100% (2012), and from about 107% (early 2020) to 133% in mid-2020 before settling near 120%. Auditors estimated $100–135 billion in unemployment fraud, and a study of the Paycheck Protection Program found most of its money went to business owners rather than workers.',s:['summers2021','autor2022','gao2023'],d:'inflation',e:'Name one benefit and one cost of the 2020–21 response, each with evidence. Was it worth it?',person:'tax',deep:'Some economists argue the 2008 response was too small and the 2020–21 response too large. Using the charts, describe what a “right-sized” response might have looked like in each case, and what information policymakers did not have at the time.'}],
GL:{recession:['recession','A significant, widespread decline in economic activity that lasts more than a few months.'],unemployment:['unemployment rate','The percentage of people in the labor force (working or actively looking for work) who do not have a job.'],inflation:['inflation','A general rise in prices over time, so each dollar buys less.'],real:['real (adjusted for inflation)','A number adjusted to remove the effect of price changes, so values from different years can be compared. “Nominal” numbers are not adjusted.'],fiscal:['fiscal policy','Government decisions about taxes, spending and borrowing, made by Congress and the President.'],monetary:['monetary policy','Decisions by the Federal Reserve about interest rates and the supply of money and credit.'],fed:['Federal Reserve','The central bank of the United States. It sets key interest rates and can lend to banks and markets in an emergency.'],interest:['interest rate','The price of borrowing money, shown as a yearly percentage of the amount borrowed.'],bailout:['bailout','Government money or guarantees given to a company or industry to keep it from failing.'],stimulus:['stimulus','Government spending or tax cuts meant to boost demand and support jobs during a downturn.'],tarp:['TARP','The Troubled Asset Relief Program: the 2008 law that let the Treasury put up to $700 billion into banks and other firms.'],foreclosure:['foreclosure','When a lender takes back a home because the borrower stopped making mortgage payments.'],forbearance:['forbearance','A lender’s agreement to let a borrower pause or reduce payments for a while. The money is still owed later.'],eviction:['eviction','When a landlord legally removes a tenant from a rental home.'],mortgage:['mortgage','A loan used to buy a home, with the home itself as security for the loan.'],delinquent:['delinquent','Behind on required loan payments (here, 30 or more days late).'],networth:['net worth','Everything a household owns (assets) minus everything it owes (debts).'],median:['median','The middle value when values are listed in order: half are higher and half are lower.'],moral:['moral hazard','The risk that people or firms take bigger risks because they expect someone else to cover their losses.'],debt:['federal debt','The total amount the federal government has borrowed and not yet repaid.'],gdp:['GDP','Gross domestic product: the total value of goods and services produced in the country in a year.'],spm:['Supplemental Poverty Measure','A Census Bureau poverty measure that counts government benefits and tax credits as income and subtracts necessary expenses.'],ltu:['long-term unemployed','People who have been unemployed and looking for work for 27 weeks (about six months) or more.'],disposable:['disposable income','Income left after taxes, including government payments such as benefits and relief checks.'],ppp:['Paycheck Protection Program (PPP)','A 2020–21 program of small-business loans that were forgiven if the business kept paying its workers.'],ui:['unemployment insurance','State-run benefits paid to workers who lose their jobs through no fault of their own.'],ctc:['child tax credit','A tax credit for families with children. In 2021 it was enlarged and paid monthly.'],gig:['gig workers','People who work task by task or for themselves, such as rideshare drivers, rather than as regular employees.']},
OVERVIEW:`<h2>Two crises, compared</h2><p>In 2008 a housing and banking collapse caused the worst downturn since the Great Depression. In 2020 a pandemic caused the sharpest job loss on record. Each time, the government stepped in, but in very different ways. This activity lines the two crises up month by month so you can compare what happened to regular people, what the government did, and how well it worked.</p>
<h3>What you will be able to do</h3><ul><li>Use economic indicators (unemployment, jobs, income, inflation, debt) to compare two recessions.</li><li>Explain the aims and tools of fiscal and monetary policy, and weigh their costs and benefits.</li><li>Evaluate primary sources and competing explanations, noting each author’s purpose and audience.</li><li>Write an evidence-based argument that answers the essential question and responds to a counterargument.</li></ul>
<h3>Ways to use this page</h3><ul><li><b>Investigate.</b> Seven stops (about 50 minutes) walk you through both crises. At each one you predict, check the charts, read sources and record evidence, then write your own answer.</li><li><b>Compare people.</b> “Who was affected” shows how each crisis played out for eight different people.</li><li><b>Explore freely.</b> Press play or drag the slider. Focus any chart and use the arrow keys, or open its data table.</li><li><b>Get support.</b> Use the settings at the top to switch to Spanish, enlarge text, raise contrast, add sentence starters, or reduce motion. Press “Read aloud” to hear the panel, or select text to hear just that part. Underlined words open a definition.</li></ul>
<h3>Ideas to keep in view</h3><ul><li><b>Different causes, different cures.</b> One crisis started in banks and housing; the other started with a virus that shut down whole industries.</li><li><b>Speed and size.</b> The 2020 response came faster and was several times larger relative to the economy.</li><li><b>Trade-offs.</b> Doing too little can leave lasting damage; doing too much can bring inflation, debt and waste.</li></ul>
<h3>Questions to explore</h3><ul><li>One crisis began in banks, the other with a virus. How should the cause of a crisis shape the response?</li><li>Pick one person under “Who was affected.” Which crisis was worse for them? Would everyone you know answer the same way?</li><li>The 2020 response was bigger and faster. Was the inflation that followed a fair price? Who paid it?</li><li>Child poverty fell to a record low in 2021 and doubled in 2022. What does that suggest about temporary versus permanent programs?</li><li>Many people saw the 2008 rescue as helping Wall Street over Main Street. Did the 2020 response avoid that problem? Use evidence.</li><li>Which measure would you use to judge “effectiveness”: jobs, poverty, wealth, inflation or something else? Why?</li></ul>
<h3>Read with care</h3><ul><li>Some stops discuss job loss, eviction and losing a home. These may be close to home for some readers.</li><li>The crises are lined up by months since each recession began: December 2007 and February 2020. The 2008 financial panic peaked later, in September 2008 (month 9).</li><li>Income is total after-tax income for the whole country, adjusted for inflation; it doesn’t show how income was shared. Debt is total federal debt as a share of the economy.</li><li>Data for the 2020 crisis run through mid-2025 (unemployment through December 2024). Inflation uses the seasonally adjusted consumer price index, so its 2022 peak (9.0%) is slightly below the often-quoted 9.1%.</li><li>Program sizes are as passed or as estimated by the Congressional Budget Office; some money was later changed or never spent.</li><li>Economists still disagree about causes and effects. The “Economists disagree” cards are short summaries of longer arguments.</li><li>Your notes and settings are saved only in this browser on this device. Download or copy your notes to hand them in. On a shared computer, clear your answers when you finish.</li></ul>
<h3>Standards</h3><p>California History–Social Science Content Standards: Principles of Economics 12.3 and 12.5; U.S. History 11.11 (11.11.6); Historical and Social Sciences Analysis Skills, grades 9–12. California Common Core Literacy in History/Social Studies: RH.11–12.1, 3, 4, 6, 7, 8, 9; WHST.11–12.1, 9.</p>
<h3>Sources</h3><ul><li>Charts: Federal Reserve Bank of St. Louis (FRED), using data from the U.S. Bureau of Labor Statistics (unemployment, jobs, long-term unemployment, consumer prices), Bureau of Economic Analysis (disposable income), S&amp;P CoreLogic Case-Shiller (home prices), Federal Reserve Board (mortgage delinquencies) and U.S. Treasury/OMB (federal debt).</li><li>Poverty: U.S. Census Bureau Supplemental Poverty Measure reports (2009–12, 2020–22). Wealth: Federal Reserve Survey of Consumer Finances.</li><li>Programs: Congressional Budget Office (TARP final report, 2024; Recovery Act estimates); Committee for a Responsible Federal Budget and Peter G. Peterson Foundation summaries of COVID relief; Congressional Research Service (eviction moratorium); SIGTARP and GAO (HAMP); GAO (unemployment fraud, 2023); CoreLogic (foreclosures, 2017).</li><li>Research: Autor and others (2022) on the Paycheck Protection Program; Coombs and others (2021–22) and Holzer, Hubbard and Strain (2021) on unemployment benefits; Federal Reserve Bank of San Francisco Economic Letter 2022-07; Bernanke and Blanchard (2023).</li><li>Primary sources as listed under “Primary sources.”</li></ul>`
}

EV:{A:[[2,'Ley de cheques de reembolso','El Congreso aprueba la Ley de Estímulo Económico (febrero de 2008); desde mayo se envían cheques de $300 a $600 por adulto.'],[3,'Rescate de Bear Stearns','La Reserva Federal ayuda a JPMorgan Chase a comprar el banco de inversión en quiebra (marzo de 2008).'],[9,'Quiebra de Lehman','El gobierno toma el control de Fannie Mae y Freddie Mac (7 de sept.); Lehman Brothers quiebra (15 de sept.); el gobierno rescata a la aseguradora AIG (16 de sept.).'],[10,'Se aprueba el rescate bancario (TARP)','La Cámara lo rechaza primero (29 de sept.) y luego el Congreso aprueba el Programa de Alivio de Activos en Problemas de $700 mil millones el 3 de octubre de 2008.'],[12,'Tasas de interés a cero','La Reserva Federal baja su tasa de interés clave a casi cero (16 de dic. de 2008).'],[14,'Se firma la Ley de Recuperación','El presidente Obama firma el estímulo de $787 mil millones (17 de feb. de 2009). Dos días después, la protesta de un comentarista de televisión contra la ayuda hipotecaria ayuda a iniciar el movimiento Tea Party.'],[15,'Plan de alivio hipotecario; la bolsa toca fondo','Comienza el Programa de Modificación Asequible de Viviendas (HAMP) y la bolsa llega a su punto más bajo el 9 de marzo de 2009.'],[18,'Termina oficialmente la recesión','Los economistas fijan después el fin de la recesión en junio de 2009, pero el desempleo sigue subiendo.'],[22,'El desempleo llega al 10%','Octubre de 2009.'],[31,'Ley Dodd-Frank','Una ley importante agrega nuevas reglas para los bancos y crea la Oficina de Protección Financiera del Consumidor (julio de 2010).'],[33,'Máximo de ejecuciones hipotecarias','Solo en septiembre de 2010 se ejecutan unas 120,000 hipotecas.'],[45,'Occupy Wall Street','Desde el 17 de septiembre de 2011 hay manifestantes acampados en el distrito financiero de Nueva York con el lema “Somos el 99%”.'],[77,'Se recuperan todos los empleos','Mayo de 2014: EE. UU. por fin tiene tantos empleos como en diciembre de 2007, 77 meses después.']],
 B:[[1,'Cierres y rescate','Se declara una emergencia nacional (13 de mar. de 2020); la Reserva Federal baja las tasas a casi cero (15 de mar.) y promete compras ilimitadas de bonos (23 de mar.); el Congreso aprueba la Ley CARES de $2.2 billones (27 de mar.).'],[2,'El desempleo llega al 14.8%','Abril de 2020, el nivel más alto desde que hay registros (1948). Los economistas fijan después el fin de la recesión en este mes.'],[5,'Terminan los $600 adicionales','El suplemento semanal de $600 del seguro de desempleo vence a fines de julio de 2020.'],[7,'Prohibición de desalojos','Los CDC ordenan detener en todo el país los desalojos de inquilinos que no pueden pagar (4 de sept. de 2020).'],[10,'Segunda ley de ayuda','$900 mil millones (diciembre de 2020): cheques de $600 y $300 semanales adicionales de desempleo.'],[13,'Plan de Rescate Estadounidense','$1.9 billones (11 de mar. de 2021): cheques de $1,400, ayuda de desempleo extendida y un crédito tributario por hijos más grande.'],[17,'Comienzan los pagos mensuales por hijos','El crédito tributario por hijos ampliado se paga cada mes de julio a diciembre de 2021.'],[18,'Termina la prohibición de desalojos','La Corte Suprema bloquea la moratoria de desalojos de los CDC (26 de ago. de 2021).'],[19,'Termina la ayuda federal por desempleo','Los programas de desempleo de la pandemia vencen a inicios de septiembre de 2021; 26 estados ya habían terminado algunos antes.'],[25,'La Fed empieza a subir las tasas','La Reserva Federal comienza a subir las tasas de interés para combatir la inflación (marzo de 2022).'],[28,'Máxima inflación; empleos recuperados','Junio de 2022: los precios están cerca de 9% más altos que un año antes, y EE. UU. ha recuperado todos los empleos perdidos en 2020, 28 meses después.'],[43,'La pobreza infantil se duplica','La Oficina del Censo informa que la pobreza infantil, contando la ayuda del gobierno, subió de 5.2% en 2021 a 12.4% en 2022 después de terminar el crédito por hijos ampliado.']]},
PEOPLE:[
 {id:'worker',label:'Un trabajador que perdió su empleo',a:['Las pérdidas de empleo se extendieron de la construcción y las fábricas a casi todas las industrias. Había pocas vacantes y las búsquedas se alargaban: en 2010, cerca del 45% de los desempleados llevaba más de seis meses buscando.','Se extendieron los [[ui|beneficios por desempleo]], hasta 99 semanas en los estados más afectados, y el estímulo de 2009 añadió $25 por semana.','El desempleo se mantuvo por encima del 8% más de tres años (febrero de 2009 a agosto de 2012).'],b:['Restaurantes, hoteles, tiendas y gimnasios cerraron casi de un día para otro. La mayoría de las pérdidas fueron en servicios presenciales, muchos mal pagados, y se esperaba que muchos despidos fueran temporales.','$600 adicionales por semana (abril a julio de 2020), luego $300, además de los beneficios estatales. Los [[gig|trabajadores por encargo]] y autónomos calificaron por primera vez. Las oficinas estatales saturadas causaron largos retrasos para algunos.','El desempleo bajó a 3.9% en diciembre de 2021, aunque muchos que seguían sin empleo en 2021 llevaban mucho tiempo sin trabajar.']},
 {id:'owner',label:'Un propietario de vivienda',a:['Los precios de las viviendas cayeron cerca de 26% desde su máximo a inicios de 2007 hasta inicios de 2012. Millones debían más de lo que valía su casa, y unas 7.8 millones de viviendas se perdieron por [[foreclosure|ejecución hipotecaria]] de 2007 a 2016.','HAMP y otros programas redujeron los pagos de algunos deudores, pero llegaron a muchos menos de los 3 a 4 millones de propietarios prometidos. Las tasas hipotecarias bajas ayudaron a quienes pudieron refinanciar.','Muchas familias perdieron el valor de su casa, que era su principal ahorro: el [[networth|patrimonio neto]] de la familia típica cayó 39% de 2007 a 2010.'],b:['Algunos propietarios perdieron ingresos, pero los precios de las viviendas siguieron subiendo.','Quienes tenían hipotecas con respaldo federal pudieron pausar sus pagos ([[forbearance|indulgencia]]) y se detuvieron las ejecuciones. Las tasas hipotecarias llegaron a mínimos históricos en 2020-21.','Los precios de las viviendas subieron cerca de 41% de febrero de 2020 a mediados de 2022, y el patrimonio neto de la familia típica subió 37% de 2019 a 2022. Pero los precios más altos, y luego las tasas más altas, hicieron mucho más difícil comprar la primera casa.']},
 {id:'renter',label:'Un inquilino',a:['Muchas familias que perdieron su casa pasaron a rentar. Los inquilinos que perdían el empleo tenían poca protección federal contra el [[eviction|desalojo]].','Sobre todo ayuda general: beneficios por desempleo y más ayuda alimentaria (SNAP). Un pequeño programa federal ayudó a prevenir la falta de vivienda.','Las rentas siguieron subiendo durante la lenta recuperación.'],b:['Los inquilinos tenían más probabilidad que los propietarios de trabajar en servicios muy afectados.','Una prohibición federal de desalojos para inquilinos que no podían pagar (septiembre de 2020 a agosto de 2021) y decenas de miles de millones de dólares en ayuda de emergencia para la renta, aunque el dinero tardó en llegar a muchos.','Las rentas subieron mucho en 2021-22 cuando terminó la ayuda.']},
 {id:'biz',label:'Dueño de un pequeño negocio',a:['Los clientes desaparecieron y los bancos prestaron menos, así que muchas pequeñas empresas no pudieron pedir préstamos para sobrevivir.','Más garantías de préstamos y beneficios fiscales; no hubo un programa amplio de dinero en efectivo para pequeños negocios.','Muchas empresas cerraron; el crédito para pequeños negocios siguió difícil durante años.'],b:['Las órdenes de cierre obligaron a muchos negocios a cerrar por semanas o meses.','El [[ppp|Programa de Protección de Nómina]]: cerca de $800 mil millones en préstamos que se perdonaban si el negocio seguía pagando a sus empleados. Cerca del 93% de los pequeños negocios recibió al menos un préstamo.','Los investigadores estiman que salvó de 2 a 3 millones de años-empleo, a un costo de $170,000 a $257,000 por año-empleo, y que la mayor parte del dinero fue a dueños y accionistas y no a trabajadores que habrían perdido su empleo. El fraude también fue un problema.']},
 {id:'family',label:'Una familia con hijos',a:['Los padres perdieron empleos e ingresos; la tasa oficial de pobreza subió de 12.5% en 2007 a 15.1% en 2010.','Más ayuda alimentaria (SNAP), créditos fiscales reembolsables más grandes para familias trabajadoras y el crédito “Making Work Pay” (hasta $400 por trabajador en 2009-10).','La pobreza, aun contando la ayuda del gobierno, se mantuvo cerca de 16% hasta 2012.'],b:['Las escuelas y guarderías cerraron, y muchos padres tuvieron que trabajar menos.','Tres rondas de cheques, con dinero por cada hijo, y en 2021 un [[ctc|crédito tributario por hijos]] más grande pagado cada mes: hasta $300 al mes por cada hijo menor de 6 años.','La pobreza infantil, contando la ayuda ([[spm|MSP]]), bajó a un mínimo histórico de 5.2% en 2021 y luego se duplicó con creces a 12.4% en 2022 cuando terminó el crédito ampliado.']},
 {id:'retiree',label:'Un jubilado o ahorrador',a:['Los precios de las acciones cayeron más de la mitad de fines de 2007 a inicios de 2009, reduciendo las cuentas de jubilación.','El rescate bancario y las acciones de la Reserva Federal buscaron detener el colapso; la bolsa empezó a recuperarse en marzo de 2009. El [[interest|interés]] de los ahorros se mantuvo cerca de cero durante años.','Quienes conservaron sus acciones vieron una recuperación total para 2013; quienes tuvieron que vender cerca del fondo, no.'],b:['La bolsa cayó cerca de un tercio en pocas semanas a inicios de 2020 y luego se recuperó en meses.','La acción rápida de la Fed calmó los mercados. El Seguro Social siguió llegando y los jubilados también recibieron cheques de estímulo.','La [[inflation|inflación]] de 2021-22 apretó los ingresos fijos, aunque los pagos del Seguro Social subieron 5.9% en 2022 y 8.7% en 2023 para compensar.']},
 {id:'tax',label:'Los contribuyentes y las generaciones futuras',a:['Los ingresos fiscales cayeron mientras aumentaba el gasto en ayuda.','El costo neto final del rescate bancario fue de unos $31 mil millones (CBO); el estímulo de 2009 sumó unos $831 mil millones a los déficits en diez años.','La [[debt|deuda federal]] subió de cerca de 62% de la economía en 2007 a cerca de 100% en 2012.'],b:['Los ingresos fiscales bajaron brevemente mientras el gasto en ayuda se disparaba.','Más de $5 billones en ayuda en 2020-21, casi todo prestado. Los auditores del gobierno estiman que de $100 mil a $135 mil millones en beneficios de desempleo se perdieron por fraude.','La deuda saltó de cerca de 107% de la economía a 133% a mediados de 2020 y luego se estabilizó cerca de 120%. Las tasas más altas desde 2022 encarecen mantener esa deuda.']},
 {id:'bank',label:'Los bancos y Wall Street',a:['Grandes bancos y firmas de inversión que habían apostado fuerte por las hipotecas estuvieron a punto de colapsar; Lehman Brothers quebró en septiembre de 2008.','Inversiones del rescate bancario ([[tarp]]), préstamos de emergencia de la Reserva Federal y “pruebas de resistencia” en 2009. Se devolvió la mayor parte del dinero del TARP.','Los bancos se recuperaron más rápido que muchos hogares. La Ley Dodd-Frank (2010) agregó nuevas reglas, y el enojo por los “[[bailout|rescates]]” alimentó tanto al Tea Party como a Occupy Wall Street.'],b:['Los bancos entraron a 2020 con más capital, en parte por las reglas adoptadas después de 2008, y no causaron esta crisis.','La Fed bajó las tasas a cero, compró billones de dólares en bonos y respaldó los mercados para que las empresas pudieran seguir pidiendo préstamos.','Los mercados se recuperaron rápido, lo que aumentó la riqueza de quienes tenían acciones y casas más que la de quienes no las tenían.']}],
TOOL:[['Qué la causó','Préstamos hipotecarios riesgosos y una burbuja inmobiliaria; bancos muy expuestos a inversiones hipotecarias','Una pandemia, con los cierres y el miedo que trajo'],['Qué tan rápido llegó la ayuda','Ley de cheques de reembolso: mes 2 (febrero de 2008). Rescate bancario: mes 10 (octubre de 2008). [[stimulus|Estímulo]] principal: mes 14 (febrero de 2009).','Ley principal de ayuda (Ley CARES): mes 1 (27 de marzo de 2020). Más leyes en abril de 2020, diciembre de 2020 y marzo de 2021.'],['Qué tan grande','Reembolsos de 2008 (unos $150 mil millones), el rescate bancario ($700 mil millones autorizados, unos $444 mil millones usados, costo neto final de unos $31 mil millones) y el estímulo de 2009 ($787 mil millones, luego estimado en $831 mil millones)','Más de $5 billones en cinco leyes de ayuda en 2020-21, cerca de una cuarta parte del tamaño de toda la economía en un año'],['[[fed|Reserva Federal]] ([[monetary|política monetaria]])','Bajó las tasas a casi cero (diciembre de 2008); compró billones en bonos durante varios años; préstamos de emergencia a bancos y mercados','Bajó las tasas a casi cero en semanas (marzo de 2020); compras ilimitadas de bonos; nuevos programas de préstamos para empresas y gobiernos locales'],['Dinero para los hogares ([[fiscal|política fiscal]])','2008: $300 a $600 por adulto más $300 por hijo. 2009-10: crédito “Making Work Pay”, hasta $400 por trabajador','Tres rondas de cheques: $1,200, $600 y $1,400 por adulto, más dinero por hijo (menos para quienes ganaban más)'],['Beneficios por desempleo','Más semanas de beneficios (hasta 99 en los estados más afectados); $25 semanales adicionales en 2009','$600 semanales adicionales (abril a julio de 2020), luego $300 (2021); se incluyó a trabajadores por encargo y autónomos; terminó en septiembre de 2021'],['Vivienda y renta','Modificaciones hipotecarias de HAMP (meta: 3 a 4 millones de propietarios; quedó muy por debajo)','Pausa en pagos hipotecarios, alto a las ejecuciones, prohibición de desalojos de los CDC (septiembre de 2020 a agosto de 2021) y ayuda de emergencia para la renta'],['Pequeños negocios','Garantías de préstamos y beneficios fiscales','Programa de Protección de Nómina: cerca de $800 mil millones en préstamos casi todos perdonados'],['Familias con hijos','Créditos fiscales reembolsables más grandes y ayuda alimentaria','Crédito tributario por hijos de 2021: hasta $3,600 por hijo pequeño, pagado mensualmente de julio a diciembre'],['Bancos','Inversiones del TARP, pruebas de resistencia y préstamos de emergencia de la Fed; luego reformas Dodd-Frank (2010)','Respaldo de la Fed a los mercados; los bancos estaban más fuertes al inicio']],
