 fcic:{k:'A',M:37,date:'Enero de 2011',title:'Conclusiones de la Comisión de Investigación de la Crisis Financiera',who:'Una comisión creada por el Congreso para investigar las causas de la crisis',type:'Informe oficial del gobierno (algunos miembros discreparon)',aud:'El Congreso, el presidente y el público',q:'<blockquote lang="en" data-r>“We conclude this financial crisis was avoidable. The crisis was the result of human action and inaction, not of Mother Nature or computer models gone haywire.”</blockquote><p class="tr" data-r><b>Traducción:</b> “Concluimos que esta crisis financiera era evitable. La crisis fue el resultado de la acción y la inacción humanas, no de la madre naturaleza ni de modelos de computadora que se descontrolaron”.</p><p data-r>La comisión culpó a fallas en la regulación financiera, a préstamos e inversiones riesgosos de grandes firmas y a una mala gestión del riesgo. Varios comisionados no estuvieron de acuerdo con partes del informe y escribieron opiniones disidentes.</p>',plain:'Una comisión creada por el Congreso concluyó que la crisis la causaron personas, no la mala suerte, sobre todo por una regulación débil y decisiones riesgosas de grandes firmas financieras.',ask:'¿Por qué importa si una crisis era “evitable”? ¿Quién querría que se viera de una forma u otra?',url:'https://fcic.law.stanford.edu/report/conclusions'},
 bush2008:{k:'A',M:9,date:'24 de septiembre de 2008',title:'Mensaje a la nación sobre la economía',who:'Presidente George W. Bush',type:'Discurso televisado para pedir al Congreso un rescate de $700 mil millones',aud:'Los estadounidenses y los miembros del Congreso, muchos de ellos escépticos',q:'<blockquote lang="en" data-r>“Financial assets related to home mortgages have lost value during the housing decline, and the banks holding these assets have restricted credit. As a result, our entire economy is in danger.”</blockquote><p class="tr" data-r><b>Traducción:</b> “Los activos financieros relacionados con hipotecas han perdido valor durante la caída de la vivienda, y los bancos que los tienen han restringido el crédito. Como resultado, toda nuestra economía está en peligro”.</p><blockquote lang="en" data-r>“This rescue effort is not aimed at preserving any individual company or industry; it is aimed at preserving America’s overall economy.”</blockquote><p class="tr" data-r><b>Traducción:</b> “Este esfuerzo de rescate no busca proteger a ninguna empresa o industria en particular; busca proteger la economía de Estados Unidos en su conjunto”.</p>',plain:'El presidente dijo al público que las pérdidas de los bancos en préstamos para vivienda amenazaban toda la economía y pidió al Congreso aprobar un rescate.',ask:'Bush necesitaba votos de su propio partido, que desconfiaba. ¿Cómo intenta convencer a quienes rechazan los “rescates”?',url:'https://www.presidency.ucsb.edu/documents/address-the-nation-the-national-economy'},
 obama2009:{k:'A',M:14,date:'17 de febrero de 2009',title:'Firma de la Ley de Recuperación y Reinversión',who:'Presidente Barack Obama',type:'Palabras durante la firma de la ley en Denver',aud:'Los estadounidenses y los simpatizantes reunidos para la firma',q:'<p data-r>Obama llamó a la ley “el paquete de recuperación económica más amplio de nuestra historia” (<span lang="en">“the most sweeping economic recovery package in our history”</span>). Advirtió que no lo resolvería todo:</p><blockquote lang="en" data-r>“Today does mark the beginning of the end: the beginning of what we need to do to create jobs for Americans scrambling in the wake of layoffs.”</blockquote><p class="tr" data-r><b>Traducción:</b> “Hoy sí marca el principio del fin: el principio de lo que necesitamos hacer para crear empleos para los estadounidenses que luchan tras los despidos”.</p>',plain:'El presidente dijo que la nueva ley de [[stimulus|estímulo]] era el mayor plan de recuperación de la historia de EE. UU., pero solo un primer paso.',ask:'Obama dice que esto es solo un “principio”. ¿Por qué un presidente bajaría las expectativas el día que firma su ley más importante?',url:'https://www.presidency.ucsb.edu/documents/remarks-signing-the-american-recovery-and-reinvestment-act-2009-denver-colorado'},
 santelli:{k:'A',M:14,date:'19 de febrero de 2009',title:'La protesta del “Tea Party de Chicago”',who:'Rick Santelli, reportero de negocios de CNBC, desde un piso de operaciones en Chicago',type:'Comentario en vivo por televisión (con derechos de autor; cita breve)',aud:'Los televidentes de CNBC y los operadores a su alrededor',q:'<p data-r>Reaccionando al nuevo plan para ayudar a propietarios en problemas, Santelli dijo que el gobierno premiaba el mal comportamiento y pidió un “Tea Party de Chicago”. Preguntó a los operadores:</p><blockquote lang="en" data-r>“How many of you people want to pay for your neighbor’s mortgage…?”</blockquote><p class="tr" data-r><b>Traducción:</b> “¿Cuántos de ustedes quieren pagar la hipoteca de su vecino…?”</p><p data-r>El video se difundió mucho y ayudó a lanzar el movimiento Tea Party.</p>',plain:'Un reportero de televisión argumentó con enojo que quienes pagan sus cuentas no deberían ayudar a vecinos que no pueden pagar su [[mortgage|hipoteca]].',ask:'Santelli hablaba a operadores de bolsa, no a propietarios en problemas. ¿Cómo podría su público influir en su idea de quién “merece” ayuda?',url:'https://www.cnbc.com/2009/02/22/rick-santellis-shout-heard-round-the-world.html'},
 sigtarp:{k:'A',M:27,date:'25 de marzo de 2010',title:'Informe sobre el Programa de Modificación Asequible de Viviendas',who:'La oficina de Neil Barofsky, inspector general especial del rescate bancario (SIGTARP)',type:'Auditoría de un organismo de control del gobierno',aud:'El Congreso y el Departamento del Tesoro',q:'<p data-r>El Tesoro había prometido que HAMP ayudaría a 3 o 4 millones de propietarios a evitar la ejecución hipotecaria, pero contaba como éxito las ofertas de planes de prueba cortos. El organismo de control objetó:</p><blockquote lang="en" data-r>“Measuring trial modification offers, or even actual trial modifications, for that matter, is simply not particularly meaningful.”</blockquote><p class="tr" data-r><b>Traducción:</b> “Medir las ofertas de modificaciones de prueba, o incluso las modificaciones de prueba reales, simplemente no es muy significativo”.</p>',plain:'Un organismo de control del gobierno dijo que el programa de ayuda para vivienda medía su éxito con los números equivocados.',ask:'¿Por qué importa cómo mide su éxito un programa del gobierno? ¿Qué debió contar HAMP?',url:'https://fraser.stlouisfed.org/title/factors-affecting-implementation-home-affordable-modification-program-5106/fulltext'},
 powell2020:{k:'B',M:3,date:'13 de mayo de 2020',title:'“Asuntos económicos actuales”',who:'Jerome Powell, presidente de la Reserva Federal',type:'Discurso ante el Instituto Peterson de Economía Internacional',aud:'Economistas, mercados e, indirectamente, el Congreso',q:'<blockquote lang="en" data-r>“Additional fiscal support could be costly, but worth it if it helps avoid long-term economic damage and leaves us with a stronger recovery. This tradeoff is one for our elected representatives, who wield powers of taxation and spending.”</blockquote><p class="tr" data-r><b>Traducción:</b> “Más apoyo fiscal podría ser costoso, pero valdría la pena si ayuda a evitar daños económicos a largo plazo y nos deja una recuperación más fuerte. Esta decisión corresponde a nuestros representantes electos, que tienen el poder de cobrar impuestos y gastar”.</p>',plain:'El jefe de la [[fed|Reserva Federal]] dijo que más gasto del gobierno podría costar mucho, pero podría evitar daños peores y más largos, y que el Congreso debía decidir.',ask:'La Fed no controla los impuestos ni el gasto. ¿Por qué su presidente pediría al Congreso gastar más?',url:'https://www.federalreserve.gov/newsevents/speech/powell20200513a.htm'},
 cdc2020:{k:'B',M:7,date:'Emitida por primera vez el 4 de septiembre de 2020',title:'Suspensión temporal de los desalojos residenciales',who:'Los Centros para el Control y la Prevención de Enfermedades (CDC)',type:'Orden federal de salud pública (texto de la versión de agosto de 2021)',aud:'Propietarios, inquilinos y tribunales',q:'<blockquote lang="en" data-r>“…a landlord, owner of a residential property, or other person with a legal right to pursue eviction or possessory action, shall not evict any covered person…”</blockquote><p class="tr" data-r><b>Traducción:</b> “…un arrendador, propietario de una vivienda u otra persona con derecho legal a solicitar un desalojo o una acción de posesión no desalojará a ninguna persona cubierta…”</p><p data-r>Los inquilinos tenían que declarar que no podían pagar por haber perdido ingresos y que quedarían sin hogar o tendrían que vivir hacinados. La renta se seguía debiendo. La Corte Suprema terminó la prohibición el 26 de agosto de 2021, al decidir que los CDC no tenían esa autoridad.</p>',plain:'Los CDC ordenaron a los arrendadores no desalojar a inquilinos que no podían pagar por la pandemia. Los inquilinos seguían debiendo la renta.',ask:'¿Por qué una agencia de salud pública emitió una regla sobre vivienda? ¿Qué intereses equilibra la orden?',url:'https://www.federalregister.gov/documents/2020/09/04/2020-19654/temporary-halt-in-residential-evictions-to-prevent-the-further-spread-of-covid-19'},
 summers2021:{k:'B',M:12,date:'4 de febrero de 2021',title:'Advertencia sobre el tamaño del plan de ayuda',who:'Lawrence Summers, secretario del Tesoro con Bill Clinton y asesor económico de Barack Obama',type:'Columna de opinión en The Washington Post (con derechos de autor; cita breve)',aud:'Legisladores y lectores, mientras el Congreso debatía el plan de $1.9 billones',q:'<p data-r>Summers elogió los objetivos del plan, pero argumentó que era mucho más grande que el hueco que debía llenar. Advirtió que había una posibilidad de que desatara</p><blockquote lang="en" data-r>“inflationary pressures of a kind we have not seen in a generation.”</blockquote><p class="tr" data-r><b>Traducción:</b> “presiones inflacionarias como no hemos visto en una generación”.</p><p data-r>Muchos economistas no estuvieron de acuerdo entonces. La inflación llegó a cerca de 9% en junio de 2022.</p>',plain:'Un economista conocido advirtió que el plan de ayuda de 2021 era tan grande que podía causar mucha [[inflation|inflación]].',ask:'Summers era demócrata y criticaba un plan demócrata. ¿Eso hace su advertencia más o menos creíble? ¿Por qué?',url:'https://www.hks.harvard.edu/centers/mrcbg/programs/growthpolicy/inflation-we-can-learn-mistakes-past-or-repeat-them-lawrence'},
 census2022:{k:'B',M:31,date:'Septiembre de 2022 y septiembre de 2023',title:'Informes sobre la pobreza infantil',who:'Oficina del Censo de EE. UU.',type:'Informes estadísticos oficiales',aud:'El público, los investigadores y los legisladores',q:'<blockquote lang="en" data-r>“Child poverty, calculated by the Supplemental Poverty Measure (SPM), fell to its lowest recorded level in 2021, declining 46% from 9.7% in 2020 to 5.2% in 2021.”</blockquote><p class="tr" data-r><b>Traducción:</b> “La pobreza infantil, calculada con la Medida Suplementaria de Pobreza (MSP), bajó a su nivel más bajo registrado en 2021, con una caída de 46%, de 9.7% en 2020 a 5.2% en 2021”.</p><p data-r>Un año después, la Oficina informó que la misma medida para toda la población subió a 12.4% en 2022 desde 7.8% en 2021, cuando terminó la ayuda de la pandemia, y que la pobreza infantil subió a 12.4%.</p>',plain:'La pobreza infantil bajó a un mínimo histórico en 2021, cuando la ayuda era alta, y luego se duplicó con creces en 2022 cuando terminó la ayuda.',ask:'Esta medida cuenta la ayuda del gobierno como ingreso. ¿Por qué la medida elegida cambia la historia? ¿Qué medida usaría usted y por qué?',url:'https://www.census.gov/library/stories/2022/09/record-drop-in-child-poverty.html'},
 autor2022:{k:'B',M:23,date:'2022',title:'¿A dónde fue el dinero del PPP?',who:'El economista David Autor y coautores, entre ellos investigadores de la Reserva Federal',type:'Artículo de investigación revisado por pares (con derechos de autor; resumido)',aud:'Economistas y legisladores',q:'<p data-r><i>Resumen:</i> El Programa de Protección de Nómina llegó a cerca del 93% de los pequeños negocios en unos dos meses. Los autores estiman que salvó de 2 a 3 millones de años-empleo a un costo de $170,000 a $257,000 por año-empleo, y que solo entre una cuarta y una tercera parte del dinero llegó a trabajadores que habrían perdido su empleo. Concluyen que el programa fue rápido pero costoso porque estaba, en sus palabras,</p><blockquote lang="en" data-r>“essentially untargeted.”</blockquote><p class="tr" data-r><b>Traducción:</b> “básicamente sin focalizar”.</p>',plain:'Los investigadores encontraron que el [[ppp|PPP]] salvó empleos rápido, pero fue muy caro por empleo, y la mayor parte del dinero fue a los dueños de negocios.',ask:'Los autores elogian la rapidez del programa y critican su focalización. ¿Puede un programa ser rápido y bien focalizado a la vez? ¿Qué necesitaría?',url:'https://www.aeaweb.org/doi/10.1257/jep.36.2.55'},
 gao2023:{k:'B',M:43,date:'12 de septiembre de 2023',title:'Fraude en el seguro de desempleo de la pandemia',who:'Oficina de Rendición de Cuentas del Gobierno de EE. UU. (GAO), los auditores del Congreso',type:'Informe de auditoría',aud:'El Congreso',q:'<blockquote lang="en" data-r>“…the amount of fraud in unemployment insurance (UI) programs during the COVID-19 pandemic was likely between $100 billion and $135 billion.”</blockquote><p class="tr" data-r><b>Traducción:</b> “…el monto del fraude en los programas de seguro de desempleo durante la pandemia de COVID-19 probablemente estuvo entre $100 mil millones y $135 mil millones”.</p><p data-r>Eso es aproximadamente entre 11% y 15% de los beneficios pagados. El Departamento de Trabajo dijo que la estimación era demasiado alta.</p>',plain:'Los auditores del gobierno estimaron que entre 11% y 15% de los [[ui|beneficios por desempleo]] de la pandemia se perdieron por fraude.',ask:'¿Cómo deberíamos comparar el fraude con la rapidez para hacer llegar dinero a quienes lo necesitaban?',url:'https://www.gao.gov/products/gao-23-106696'},
 scf2023:{k:'B',M:44,date:'Octubre de 2023',title:'Cambios en las finanzas de las familias de EE. UU., 2019 a 2022',who:'Junta de la Reserva Federal, Encuesta de Finanzas del Consumidor',type:'Informe oficial de encuesta',aud:'El público y los investigadores',q:'<blockquote lang="en" data-r>“…the 2019–22 growth in median net worth was the largest three-year increase over the history of the modern SCF, more than double the next-largest one on record.”</blockquote><p class="tr" data-r><b>Traducción:</b> “…el crecimiento del patrimonio neto mediano en 2019-22 fue el mayor aumento de tres años en la historia de la encuesta moderna, más del doble del siguiente más grande registrado”.</p><p data-r>El patrimonio neto de la familia típica subió 37% descontando la inflación. Entre las encuestas de 2007 y 2010 había caído cerca de 39%.</p>',plain:'El [[networth|patrimonio neto]] de la familia típica creció más rápido de 2019 a 2022 que en cualquier otro periodo de tres años medido por la Fed.',ask:'El patrimonio neto subió en parte porque subieron los precios de las casas y las acciones. ¿Quién gana más cuando esos precios suben y quién podría quedarse fuera?',url:'https://www.federalreserve.gov/publications/October-2023-Changes-in-US-Family-Finances-from-2019-to-2022.htm'}},
DEB:{
 bailouts:{q:'¿Fueron correctos los rescates bancarios de 2008?',v:[['Sí: evitaron algo peor','Dejar que el sistema financiero colapsara habría causado una caída mucho más profunda. Se devolvió la mayor parte del dinero; la CBO calculó el costo neto final del rescate bancario ([[tarp]]) en unos $31 mil millones.','p. ej., Ben Bernanke, The Courage to Act (2015); Timothy Geithner, Stress Test (2014)'],['No, o no de esa forma','El rescate protegió a las firmas que causaron la crisis mientras los propietarios recibieron mucha menos ayuda. Eso fomenta tomar más riesgos en el futuro ([[moral|riesgo moral]]) y aumentó la desconfianza en el gobierno.','p. ej., Neil Barofsky, Bailout (2012); Atif Mian y Amir Sufi, House of Debt (2014)']],ev:'Compare qué les pasó a los bancos y a los propietarios después de 2008. Nadie puede saber qué habría pasado sin el rescate. ¿Qué evidencia le ayudaría a decidir?'},
 stim09:{q:'¿Fue el estímulo de 2009 demasiado pequeño, o hizo poco bien?',v:[['Demasiado pequeño','Ayudó, pero la economía había perdido mucho más gasto del que $787 mil millones podían reemplazar, así que la recuperación fue lenta. La Oficina de Presupuesto del Congreso estimó que aumentó el empleo en 1.4 a 3.6 millones en su punto máximo en 2010.','p. ej., Christina Romer (presidenta del Consejo de Asesores Económicos de Obama); Paul Krugman'],['Hizo poco bien duradero','Mucho del dinero se ahorró o lo usaron los estados para no pedir préstamos, así que impulsó menos de lo prometido y aumentó la deuda.','p. ej., John Cogan y John Taylor (2012)']],ev:'Compare las gráficas de ingreso y empleo después de 2009 y después de 2020. ¿La respuesta más grande de 2020 resuelve este debate? ¿Por qué sí o por qué no?'},
 inflation:{q:'¿Causó la ayuda por la COVID la inflación de 2021-22?',v:[['Una gran parte','Llegó tanto dinero a los hogares tan rápido que la demanda superó lo que la economía podía producir. Un estudio de la Fed de San Francisco estimó que la ayuda en EE. UU. sumó unos 3 puntos porcentuales a la inflación a fines de 2021.','p. ej., Lawrence Summers; Jason Furman; Fed de San Francisco (2022)'],['Sobre todo otras causas','Los precios subieron en todo el mundo por problemas en las cadenas de suministro, cambios en lo que la gente compraba y choques de energía y alimentos tras la invasión rusa de Ucrania en 2022. Las estimaciones del papel de la ayuda varían mucho.','p. ej., Ben Bernanke y Olivier Blanchard (2023)']],ev:'Si la ayuda causó la inflación, la inflación en EE. UU. debió subir más que en países que gastaron menos. ¿Qué más querría comparar?'},
 ui:{q:'¿Los beneficios de desempleo adicionales hicieron que la gente no trabajara?',v:[['En parte','Cuando cerca de la mitad de los estados terminaron antes los beneficios adicionales a mediados de 2021, más desempleados en esos estados consiguieron empleo, según un estudio.','p. ej., Harry Holzer, Glenn Hubbard y Michael Strain (2021)'],['Solo un poco','Otro estudio con datos bancarios encontró que terminar antes los beneficios aumentó el empleo solo un poco, mientras que el gasto de quienes perdieron los beneficios cayó mucho.','p. ej., Kyle Coombs, Arindrajit Dube y coautores (2021-22)']],ev:'¿Qué significa “hacer que la gente no trabaje” durante una pandemia, cuando algunos empleos tenían riesgos de salud y las escuelas y guarderías estaban cerradas?'},
 ppp:{q:'¿Valió la pena el Programa de Protección de Nómina?',v:[['Sí: la rapidez importaba','En unos dos meses llegó a casi todos los pequeños negocios y mantuvo a millones de personas en nómina en el peor momento de la crisis.','Una opinión de muchos grupos de pequeños negocios y de defensores del programa en ambos partidos'],['Demasiado caro y mal dirigido','Cada año de empleo salvado costó de $170,000 a $257,000, la mayor parte del dinero fue a dueños y accionistas, y el fraude fue común.','p. ej., David Autor y coautores (2022)']],ev:'¿Había una forma más rápida de hacer llegar el dinero a los negocios y trabajadores que más lo necesitaban? ¿Qué habría necesitado tener listo el gobierno?'},
 debt:{q:'¿Es un problema serio la deuda de estos rescates?',v:[['Sí','Más deuda significa que más del presupuesto se va en intereses, sobre todo ahora que las tasas son más altas, y queda menos para otras prioridades y para la próxima emergencia.','p. ej., Committee for a Responsible Federal Budget; perspectivas presupuestarias de largo plazo de la CBO'],['Vale la pena en una emergencia','Pedir prestado en una crisis evita daños más profundos y largos que también reducirían los ingresos fiscales. Lo que más importa es el crecimiento a largo plazo y el costo de los intereses, no solo el total de la deuda.','p. ej., Jason Furman y Lawrence Summers (2019)']],ev:'Mire la gráfica de la deuda. ¿Debería el gobierno pedir prestado de forma distinta en emergencias que en tiempos normales? ¿Quién decide qué es una emergencia?'}},

 {M:0,t:'Dos golpes muy distintos',focus:['jobs'],min:6,skill:'Usar datos y fuentes para comparar causas',std:'HSS-PoE.12.5.2; Análisis HI 1; RH.11–12.1, RH.11–12.7',c:'<b>La crisis de 2008</b> (desde diciembre de 2007): años de préstamos [[mortgage|hipotecarios]] fáciles hicieron subir los precios de las viviendas. Cuando los precios bajaron, millones de deudores se atrasaron y los bancos con inversiones hipotecarias tuvieron enormes pérdidas. <b>La crisis de 2020</b> (desde febrero de 2020): un virus nuevo se propagó por el mundo. Para frenarlo, gobiernos y empresas cerraron lugares de trabajo, escuelas y tiendas, y mucha gente se quedó en casa.',p:'¿Qué crisis cree que destruirá más empleos en sus primeros meses? ¿De cuál será más lento recuperarse? Explique su razonamiento.',r:'De diciembre de 2007 a febrero de 2010, EE. UU. perdió cerca de 8.7 millones de empleos en dos años. Solo en marzo y abril de 2020 perdió cerca de 21.9 millones. Presione reproducir en la línea de tiempo para ver la gráfica de empleos y siga mirando: la crisis lenta de 2008 tardó mucho más en revertirse.',s:['fcic'],d:null,e:'Usando la conclusión de la comisión y la gráfica de empleos, explique en qué se diferenciaron las causas de las dos crisis y por qué eso podría importar para la respuesta del gobierno.',person:null,deep:'Los economistas distinguen entre choques de demanda y choques de oferta. Clasifique cada crisis y explique por qué la política adecuada podría depender del tipo de choque.'},
 {M:10,t:'Pánico y rescate',focus:['jobs','ur'],min:8,skill:'Evaluar un argumento; las herramientas de la política monetaria',std:'HSS-PoE.12.3.4, 12.3.2; Análisis HR 1; RH.11–12.6, RH.11–12.8',c:'En septiembre de 2008 (mes 9), el banco de inversión Lehman Brothers colapsó y la gigantesca aseguradora AIG estuvo a punto de hacerlo. Los bancos dejaron de confiar entre sí y prestaron menos, incluso a empresas sanas. El presidente Bush pidió al Congreso $700 mil millones para estabilizar el sistema financiero. Compare los tiempos: en 2020, la [[fed|Reserva Federal]] y el Congreso actuaron a pocas semanas de los primeros cierres (mes 1).',p:'Si los bancos dejan de prestar, ¿a quién más perjudica además de a los banqueros? ¿Deberían los contribuyentes rescatar a bancos que hicieron apuestas riesgosas?',r:'La Cámara rechazó primero el rescate el 29 de septiembre de 2008 y la bolsa se desplomó; luego el Congreso lo aprobó el 3 de octubre. El gobierno invirtió cerca de $444 mil millones en bancos, fabricantes de autos, AIG y programas de vivienda. Se devolvió la mayor parte, y la estimación final de la CBO del costo neto fue de unos $31 mil millones. En marzo de 2020, la Fed bajó las [[interest|tasas de interés]] a casi cero y prometió comprar todos los bonos necesarios, y el Congreso aprobó la Ley CARES de $2.2 billones el 27 de marzo.',s:['bush2008'],d:'bailouts',e:'¿Qué razones da Bush para el rescate y a quién dice que ayudará? ¿Le parece convincente su argumento? ¿Por qué sí o por qué no?',person:'bank',deep:'La regla clásica de Walter Bagehot dice que, en un pánico, un banco central debe prestar sin límite, a una tasa de castigo, a firmas sólidas con buenas garantías. ¿Siguieron esa regla las respuestas de 2008 y 2020? ¿En qué se apartaron y por qué?'},
 {M:14,t:'Dinero para los hogares',focus:['inc'],min:8,skill:'Comparar puntos de vista; política fiscal; datos reales y nominales',std:'HSS-PoE.12.3.3, 12.5.1; RH.11–12.6, RH.11–12.7',c:'En febrero de 2009 (mes 14), el Congreso aprobó la Ley de Recuperación y Reinversión de $787 mil millones ([[stimulus|estímulo]]): recortes de impuestos, ayuda a los estados, beneficios de desempleo más largos, ayuda alimentaria y gasto en carreteras, energía e investigación. En 2020-21, el Congreso aprobó cinco leyes de ayuda por más de $5 billones, con tres rondas de cheques ($1,200, $600 y $1,400 por adulto), beneficios semanales adicionales de desempleo y un [[ctc|crédito tributario por hijos]] más grande.',p:'¿Es mejor enviar dinero directamente a las personas o gastarlo en proyectos y programas? ¿Qué ventajas y desventajas tiene cada opción?',r:'Mire la gráfica de ingreso, que está [[real|ajustada por inflación]]. Después de 2008, el ingreso total de los estadounidenses después de impuestos apenas creció: era solo 1% más alto que al inicio a principios de 2009 y 1.3% más alto dos años después. En 2020-21 saltó por encima de su nivel previo a la crisis, con picos cada vez que llegaban cheques: 13% por encima de febrero de 2020 en abril de 2020 y 29% por encima en marzo de 2021. La CBO estimó que la ley de 2009 aumentó el empleo en 1.4 a 3.6 millones en su punto máximo en 2010.',s:['obama2009','powell2020'],d:'stim09',e:'Los dos líderes defendieron más gasto del gobierno. ¿Qué riesgos admite cada uno y qué esperaban que lograra el dinero?',person:'family',deep:'Compare la composición de los dos paquetes (transferencias de dinero, recortes de impuestos, compras del gobierno, ayuda a los estados). ¿Qué partes esperaría que tuvieran el mayor efecto “multiplicador” sobre el gasto y por qué?'},
 {M:15,t:'Conservar un techo',focus:['del','hp'],min:8,warn:'Esta parada trata sobre perder la casa y los desalojos, temas que pueden ser cercanos para algunos lectores.',skill:'Sopesar valores en conflicto en un debate de políticas',std:'HSS-11.11; HSS-PoE.12.3.2; Análisis HR 1; RH.11–12.6',c:'En 2008, la caída de los precios de las viviendas dejó a millones de familias debiendo más de lo que valía su casa, y muchas no podían pagar. En febrero de 2009, el gobierno de Obama anunció un plan para bajar los pagos de propietarios en problemas. En 2020, el Congreso permitió a la mayoría de los propietarios con hipotecas de respaldo federal pausar sus pagos ([[forbearance|indulgencia]]), y los CDC prohibieron la mayoría de los [[eviction|desalojos]] de inquilinos que no podían pagar.',p:'¿Debería el gobierno ayudar a quienes no pueden pagar su hipoteca o renta? ¿Qué sería justo para los vecinos que sí siguen pagando?',r:'Cerca de 7.8 millones de viviendas se perdieron por [[foreclosure|ejecución hipotecaria]] de 2007 a 2016. El principal programa de ayuda, HAMP, buscaba ayudar a 3 o 4 millones de propietarios y quedó muy por debajo. En 2020, los pagos hipotecarios atrasados casi no subieron (vea la gráfica), los precios de las viviendas subieron y las ejecuciones casi se detuvieron. La prohibición de desalojos duró hasta que la Corte Suprema la terminó en agosto de 2021.',s:['santelli','sigtarp','cdc2020'],d:null,e:'Santelli y la orden de los CDC tienen posturas muy distintas sobre ayudar a quienes no pueden pagar. Explique cada una con sus palabras. ¿Cuál le parece más justa y por qué?',person:'owner',deep:'Las modificaciones hipotecarias necesitaban la cooperación de los prestamistas y administradores de préstamos; la prohibición de desalojos no necesitaba la cooperación de nadie, pero pasó las pérdidas a los arrendadores. ¿Cómo decide el diseño de una política quién paga su costo?'},
 {M:24,t:'¿Quién perdió más?',focus:['ur','ltu'],toggle:true,min:6,skill:'Leer gráficas para encontrar patrones y efectos desiguales',std:'HSS-PoE.12.5.2; HSS-11.11; Análisis HI 2; RH.11–12.7',c:'El [[unemployment|desempleo]] subió en las dos crisis, pero no igual para todos. En la gráfica de desempleo, cambie entre todos los trabajadores y los trabajadores negros. Luego compare la gráfica de desempleo de larga duración.',p:'¿Qué grupos de trabajadores cree que sufrieron más en cada crisis? ¿Por qué?',r:'En 2008-10, las pérdidas golpearon con fuerza la construcción y la manufactura, y muchas personas pasaron meses sin empleo: en 2010, cerca del 45% de los desempleados llevaba más de seis meses buscando ([[ltu]]). En 2020, las pérdidas se concentraron en servicios presenciales como restaurantes, hoteles y tiendas, que emplean a muchos trabajadores de bajos salarios, mujeres y jóvenes. En las dos crisis, el desempleo de los trabajadores negros llegó cerca de 17%, muy por encima de la tasa general.',s:[],d:'ui',e:'Describa un patrón que vea en las gráficas. ¿Qué crisis habría sido más difícil para un trabajador que perdió su empleo y por qué?',person:'worker',deep:'La tasa de desempleo puede bajar porque la gente encuentra trabajo o porque deja de buscar. ¿Qué otra medida revisaría para notar la diferencia y qué podría mostrar en estas dos recuperaciones?'},
 {M:28,t:'¿Qué tan rápido se recuperó la gente?',focus:['jobs','inc'],min:8,skill:'Elegir y usar indicadores para juzgar resultados',std:'HSS-11.11.6; Análisis HI 6; RH.11–12.7, RH.11–12.9',c:'La recuperación se puede medir de varias formas: empleos, ingresos, pobreza y riqueza. Aquí, el mes 28 es junio de 2022 para la crisis de 2020 y abril de 2010 para la de 2008.',p:'Según el tamaño y la rapidez de cada respuesta, ¿qué recuperación cree que fue más rápida? ¿Qué medida usaría para decidir?',r:'<b>Empleos:</b> EE. UU. recuperó todos los empleos perdidos en 2020 en junio de 2022, 28 meses después del inicio de la crisis. Después de 2008 tardó 77 meses, hasta mayo de 2014. <b>Pobreza:</b> con la medida más amplia de la Oficina del Censo ([[spm|MSP]]), que cuenta la ayuda del gobierno, la pobreza subió de 15.3% en 2009 a 16.1% en 2011, pero en 2020-21 bajó a mínimos históricos (9.1% y 7.8%) antes de saltar a 12.4% en 2022 cuando venció la ayuda. <b>Riqueza:</b> el [[networth|patrimonio neto]] de la familia típica cayó cerca de 39% de 2007 a 2010 y subió 37% de 2019 a 2022, descontando la inflación.',s:['census2022','scf2023'],d:'debt',e:'¿Qué medida muestra mejor cómo le fue a la gente común? Apoye su respuesta con una fuente y una gráfica.',person:'family',deep:'La riqueza subió en 2019-22 en parte porque subieron los precios de las casas y las acciones. ¿Es un aumento del patrimonio neto [[median|mediano]] buena evidencia de que las políticas ayudaron a la “gente común”? ¿Qué añadiría mirar a distintos grupos?'},
 {M:29,t:'Los costos',focus:['inf','debt'],min:8,skill:'Sopesar costos y beneficios; evaluar explicaciones en competencia',std:'HSS-PoE.12.3.2, 12.3.3; Análisis HR 3; RH.11–12.3, RH.11–12.8',c:'Toda respuesta tiene costos. Después de 2008, la ayuda llegó lento, la recuperación fue débil durante años y muchos sintieron que se rescató a los bancos y no a las familias; el Tea Party (2009) y Occupy Wall Street (2011) crecieron en parte por ese enojo. Después de 2020, los precios subieron al ritmo más rápido en unos 40 años ([[inflation|inflación]]), la [[debt|deuda federal]] se disparó y el fraude afectó algunos programas.',p:'¿Qué es peor para la gente común: que el gobierno haga demasiado o demasiado poco? ¿Qué error preferiría arriesgar y por qué?',r:'La inflación llegó a cerca de 9% en junio de 2022. La Reserva Federal subió rápido las tasas de interés desde marzo de 2022, y la inflación bajó a cerca de 3% en junio de 2023 sin una recesión. La deuda federal subió de cerca de 62% de la economía (2007) a cerca de 100% (2012), y de cerca de 107% (inicios de 2020) a 133% a mediados de 2020 antes de estabilizarse cerca de 120%. Los auditores estimaron entre $100 mil y $135 mil millones en fraude de desempleo, y un estudio del Programa de Protección de Nómina encontró que la mayor parte del dinero fue a dueños de negocios y no a trabajadores.',s:['summers2021','autor2022','gao2023'],d:'inflation',e:'Nombre un beneficio y un costo de la respuesta de 2020-21, cada uno con evidencia. ¿Valió la pena?',person:'tax',deep:'Algunos economistas sostienen que la respuesta de 2008 fue demasiado pequeña y la de 2020-21 demasiado grande. Usando las gráficas, describa cómo habría sido una respuesta del “tamaño correcto” en cada caso y qué información no tenían los responsables en ese momento.'}],

OVERVIEW:`<h2>Dos crisis, comparadas</h2><p>En 2008, el colapso de la vivienda y de los bancos causó la peor caída económica desde la Gran Depresión. En 2020, una pandemia causó la pérdida de empleos más brusca registrada. Las dos veces el gobierno intervino, pero de formas muy distintas. Esta actividad compara las dos crisis mes a mes para que usted vea qué les pasó a las personas comunes, qué hizo el gobierno y qué tan bien funcionó.</p>
<h3>Lo que podrá hacer</h3><ul><li>Usar indicadores económicos (desempleo, empleos, ingreso, inflación, deuda) para comparar dos recesiones.</li><li>Explicar los objetivos y herramientas de la política fiscal y monetaria, y sopesar sus costos y beneficios.</li><li>Evaluar fuentes primarias y explicaciones en competencia, considerando el propósito y el público de cada autor.</li><li>Escribir un argumento basado en evidencia que responda la pregunta esencial y conteste un contraargumento.</li></ul>
<h3>Cómo usar esta página</h3><ul><li><b>Investigue.</b> Siete paradas (unos 50 minutos) recorren las dos crisis. En cada una, usted predice, revisa las gráficas, lee fuentes y anota evidencia; al final escribe su propia respuesta.</li><li><b>Compare personas.</b> “A quién afectó” muestra cómo vivieron cada crisis ocho personas distintas.</li><li><b>Explore libremente.</b> Presione reproducir o mueva el control deslizante. Seleccione cualquier gráfica y use las flechas, o abra su tabla de datos.</li><li><b>Use los apoyos.</b> Con las opciones de arriba puede cambiar a inglés, agrandar el texto, subir el contraste, agregar inicios de oración o reducir el movimiento. Presione “Leer en voz alta” para escuchar el panel, o seleccione un texto para escuchar solo esa parte. Las palabras subrayadas abren una definición.</li></ul>
<h3>Ideas clave</h3><ul><li><b>Causas distintas, remedios distintos.</b> Una crisis empezó en los bancos y la vivienda; la otra, con un virus que cerró industrias enteras.</li><li><b>Rapidez y tamaño.</b> La respuesta de 2020 llegó más rápido y fue varias veces más grande en relación con la economía.</li><li><b>Compensaciones.</b> Hacer muy poco puede dejar daños duraderos; hacer demasiado puede traer inflación, deuda y desperdicio.</li></ul>
<h3>Preguntas para explorar</h3><ul><li>Una crisis empezó en los bancos y la otra con un virus. ¿Cómo debería la causa de una crisis influir en la respuesta?</li><li>Elija una persona en “A quién afectó”. ¿Qué crisis fue peor para ella? ¿Todas las personas que usted conoce responderían igual?</li><li>La respuesta de 2020 fue más grande y rápida. ¿Fue la inflación que siguió un precio justo? ¿Quién la pagó?</li><li>La pobreza infantil bajó a un mínimo histórico en 2021 y se duplicó en 2022. ¿Qué sugiere eso sobre los programas temporales y los permanentes?</li><li>Mucha gente vio el rescate de 2008 como ayuda a Wall Street por encima de la gente común. ¿Evitó ese problema la respuesta de 2020? Use evidencia.</li><li>¿Qué medida usaría para juzgar la “eficacia”: empleos, pobreza, riqueza, inflación u otra? ¿Por qué?</li></ul>
<h3>Lea con atención</h3><ul><li>Algunas paradas tratan sobre la pérdida del empleo, los desalojos y perder la casa. Pueden ser temas cercanos para algunos lectores.</li><li>Las crisis se comparan por meses desde el inicio de cada recesión: diciembre de 2007 y febrero de 2020. El pánico financiero de 2008 llegó a su punto máximo más tarde, en septiembre de 2008 (mes 9).</li><li>El ingreso es el ingreso total después de impuestos de todo el país, ajustado por inflación; no muestra cómo se repartió. La deuda es la deuda federal total como porcentaje de la economía.</li><li>Los datos de la crisis de 2020 llegan hasta mediados de 2025 (el desempleo, hasta diciembre de 2024). La inflación usa el índice de precios al consumidor ajustado por temporada, por eso su máximo de 2022 (9.0%) es un poco menor que el 9.1% que se cita a menudo.</li><li>Los tamaños de los programas son los aprobados o estimados por la Oficina de Presupuesto del Congreso; parte del dinero se cambió después o nunca se gastó.</li><li>Los economistas todavía discuten causas y efectos. Las tarjetas “Los economistas no están de acuerdo” son resúmenes breves de argumentos más largos.</li><li>Las fuentes primarias están en inglés; se incluye una traducción al español junto a cada cita. Los enlaces llevan a páginas en inglés.</li><li>Sus notas y opciones se guardan solo en este navegador y en este dispositivo. Descargue o copie sus notas para entregarlas. En una computadora compartida, borre sus respuestas al terminar.</li></ul>
<h3>Estándares</h3><p>Estándares de contenido de Historia y Ciencias Sociales de California: Principios de Economía 12.3 y 12.5; Historia de EE. UU. 11.11 (11.11.6); Habilidades de Análisis Histórico y de Ciencias Sociales, grados 9 a 12. Estándares Comunes de California de Lectoescritura en Historia y Estudios Sociales: RH.11–12.1, 3, 4, 6, 7, 8, 9; WHST.11–12.1, 9.</p>
<h3>Fuentes</h3><ul><li>Gráficas: Banco de la Reserva Federal de St. Louis (FRED), con datos de la Oficina de Estadísticas Laborales (desempleo, empleos, desempleo de larga duración, precios al consumidor), la Oficina de Análisis Económico (ingreso disponible), S&amp;P CoreLogic Case-Shiller (precios de viviendas), la Junta de la Reserva Federal (morosidad hipotecaria) y el Tesoro/OMB de EE. UU. (deuda federal).</li><li>Pobreza: informes de la Medida Suplementaria de Pobreza de la Oficina del Censo (2009-12, 2020-22). Riqueza: Encuesta de Finanzas del Consumidor de la Reserva Federal.</li><li>Programas: Oficina de Presupuesto del Congreso (informe final del TARP, 2024; estimaciones de la Ley de Recuperación); resúmenes de la ayuda por la COVID del Committee for a Responsible Federal Budget y la Peter G. Peterson Foundation; Servicio de Investigación del Congreso (moratoria de desalojos); SIGTARP y GAO (HAMP); GAO (fraude de desempleo, 2023); CoreLogic (ejecuciones hipotecarias, 2017).</li><li>Investigación: Autor y otros (2022) sobre el Programa de Protección de Nómina; Coombs y otros (2021-22) y Holzer, Hubbard y Strain (2021) sobre los beneficios de desempleo; Federal Reserve Bank of San Francisco Economic Letter 2022-07; Bernanke y Blanchard (2023).</li><li>Fuentes primarias según la lista en “Fuentes primarias”.</li></ul>`

 else if(a==='reveal'){NOTES['s'+b.dataset.i+'_rev']=1;save();const r=$('rev'+b.dataset.i);if(r){r.hidden=false;const o=r.querySelector('.out');if(o){o.tabIndex=-1;o.focus();}}b.remove();}
 else if(a==='people')open({t:'person',id:T.PEOPLE[0].id},personHTML(T.PEOPLE[0].id));else if(a==='person')open({t:'person',id:b.dataset.id},personHTML(b.dataset.id));
 else if(a==='toolbox')open({t:'toolbox'},toolHTML());else if(a==='sources')open({t:'sources'},sourcesHTML());else if(a==='glossary')open({t:'glossary'},glossHTML());
 else if(a==='src'){VIEW={t:'src',id:b.dataset.id};render();}
 else if(a==='srcgo'){const s=T.SRC[b.dataset.id];stop();setM(Math.min(MAXM,s.M));announceMonth();}
 else if(a==='debates')open({t:'debates'},debatesHTML());else if(a==='debate'){VIEW={t:'debate',id:b.dataset.id};render();}
 else if(a==='ev')jumpEvent(b.dataset.k,+b.dataset.m);
 else if(a==='term'){const id=b.dataset.id;const nx=b.nextElementSibling;if(nx&&nx.classList.contains('def')){nx.remove();b.setAttribute('aria-expanded','false');}else{const d=document.createElement('span');d.className='def';d.setAttribute('role','note');d.id='def-'+id+'-'+Math.random().toString(36).slice(2,7);d.innerHTML=`<b>${T.GL[id][0]}:</b> ${T.GL[id][1]}`;b.after(d);b.setAttribute('aria-expanded','true');b.setAttribute('aria-controls',d.id);}}
 else if(a==='ra-play')raStart();else if(a==='ra-pause'){if(!RON)return;if(RPAUSE){RPAUSE=false;SS.resume();if(!SS.speaking)raNext();}else{RPAUSE=true;SS.pause();}raSetBtns();}else if(a==='ra-stop'){raStop();rmsg('');}
 else if(a==='dl'){const m=$('cpmsg');const say=t=>{if(m)m.textContent=t;};const t=notesText(),fn=T.ui.fileName;
  const plain=()=>{try{const bl=new Blob([t],{type:'text/plain'});const u=URL.createObjectURL(bl);const x=document.createElement('a');x.href=u;x.download=fn;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(err){say(T.ui.dlBlocked);}};
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(dl=>{if(!dl){plain();return;}dl.save({filename:fn,data:t}).then(()=>say(T.ui.dlSaved),err=>say(err&&err.code==='declined'?T.ui.dlCancel:T.ui.dlBlocked));},()=>plain());}else plain();}
 else if(a==='copy'){const m=$('cpmsg');const t=notesText();const ok=()=>{if(m)m.textContent=T.ui.copied;};const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok();}catch(e2){if(m)m.textContent=T.ui.copyBlocked;}x.remove();};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();}
});
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.note){NOTES[t.dataset.note]=t.value;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();if(RON){raStop();rmsg('');}}});
if(SS&&SS.onvoiceschanged!==undefined)SS.onvoiceschanged=()=>{};
applyPrefs();chrome();setPlayLabel();draw();open({t:'home'},homeHTML(),false);
</script></body></html>
